<!doctype html><meta charset="utf-8">
<title>Lab — rules of the road</title>
<style>
  @font-face{font-family:"Archivo";src:url("../../assets/fonts/Archivo[wdth,wght].ttf");font-weight:100 900;font-stretch:62% 125%;}
  @font-face{font-family:"IBM Plex Mono";src:url("../../assets/fonts/IBMPlexMono-Medium.ttf");font-weight:500;}
  @font-face{font-family:"Cormorant Garamond";src:url("../../assets/fonts/CormorantGaramond-Italic-LN[wght].ttf");font-style:italic;font-weight:300 700;}
  html,body{margin:0;background:#111;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
<canvas id=cv width=1920 height=1080></canvas>
<script type="module">
// Bàn thử phương án B cho pemdas ("Rules of the Road" — bài so sánh với lái xe bên trái/phải). KHÔNG phải code video.
//   node engine/render/shoot.js stills --page tools/lab/road.html --dur 2 --t 0.5,1.5 --outdir out/_lab/road
// Ý: biểu thức SƠN trên mặt đường nhìn từ trên xuống; phép tính là BIỂN BÁO, màu theo cấp; quy tắc ưu tiên = luật
// nhường đường; đọc trái → phải = chiều xe chạy; bài mơ hồ = NGÃ BA không có biển. 0 = bài viral · 1 = 10 − 3 + 2
import { toCanvas } from '../../engine/mascot.js';
import { hash } from '../../engine/lib.js';

const W = 1920, H = 1080, g = document.getElementById('cv').getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const C = { verge: '#3E4A34', road: '#34373C', edge: '#E9E7DF', paint: '#EDEBE3', yellow: '#F2C230',
            P: '#26262B', E: '#7A4FB0', MD: '#2160B0', AS: '#E07F22', red: '#D2402F', gold: '#E9BE4E', ink: '#1F2228' };
const IM = {}; let GROUND, ready = false;
const A = '800 ', ARC = '"Archivo"';

function noiseFill(c, hex, amp, seed) { const x = c.getContext('2d'), d = x.getImageData(0, 0, W, H), b = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  for (let i = 0; i < W * H; i++) { if (!d.data[i * 4 + 3]) continue; const n = (hash(i * 0.613 + seed) - 0.5) * amp; for (let k = 0; k < 3; k++) d.data[i * 4 + k] = b[k] + n; }
  x.putImageData(d, 0, 0); }
function ground(roads) {                              // cỏ ven đường + vạch biên trắng + mặt nhựa (hạt đá)
  const c = mk(), x = c.getContext('2d'); x.fillStyle = C.verge; x.fillRect(0, 0, W, H); noiseFill(c, C.verge, 26, 1);
  x.lineCap = x.lineJoin = 'round'; x.strokeStyle = C.edge; x.lineWidth = 300; for (const p of roads) { x.beginPath(); p(x); x.stroke(); }
  const a = mk(), y = a.getContext('2d'); y.lineCap = y.lineJoin = 'round'; y.strokeStyle = C.road; y.lineWidth = 284;
  for (const p of roads) { y.beginPath(); p(y); y.stroke(); } noiseFill(a, C.road, 22, 2); x.drawImage(a, 0, 0);
  return c;
}
function laneLines(p) {                               // vạch giữa đứt màu vàng
  g.save(); g.strokeStyle = C.yellow; g.lineWidth = 6; g.setLineDash([46, 40]); g.beginPath(); p(g); g.stroke(); g.restore();
}
function paint(s, x, y, size, color = C.paint) {     // chữ sơn trên đường: hơi mòn (lỗ hạt)
  g.save(); g.font = `${A}${size}px ${ARC}`; const w = g.measureText(s).width;
  g.fillStyle = C.road; g.fillRect(x - w / 2 - 14, y - 8, w + 28, 16);          // vạch giữa nhường chỗ chữ sơn
  g.fillStyle = color; g.globalAlpha = 0.92; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s, x, y); g.restore();
}
function sign(kind, s, x, y, r) {                     // biển báo theo cấp: tròn (×÷), thoi (+−), tam giác (^), ngoặc = cột đèn
  g.save(); g.translate(x, y); g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 18; g.shadowOffsetY = 10; g.fillStyle = '#ECECEC';
  g.beginPath();
  if (kind === 'MD') g.arc(0, 0, r, 0, 7); else if (kind === 'AS') { g.moveTo(0, -r * 1.15); g.lineTo(r * 1.15, 0); g.lineTo(0, r * 1.15); g.lineTo(-r * 1.15, 0); }
  else { g.roundRect(-r, -r, r * 2, r * 2, r * 0.25); }
  g.fill(); g.shadowColor = 'transparent'; g.fillStyle = C[kind] ?? '#FFFFFF';
  g.beginPath();
  if (kind === 'MD') g.arc(0, 0, r * 0.84, 0, 7); else if (kind === 'AS') { const q = r * 0.98; g.moveTo(0, -q); g.lineTo(q, 0); g.lineTo(0, q); g.lineTo(-q, 0); }
  else g.roundRect(-r * 0.86, -r * 0.86, r * 1.72, r * 1.72, r * 0.18);
  g.fill(); g.fillStyle = kind ? '#FFFFFF' : C.ink; g.font = `${A}${r * 1.05}px ${ARC}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s, 0, r * 0.06); g.restore();
}
function text(s, x, y, font, color, align = 'left') { g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'alphabetic'; g.fillText(s, x, y); }
function hand(pts, color, w, seed = 1) { g.strokeStyle = color; g.lineWidth = w; g.lineCap = g.lineJoin = 'round'; g.beginPath();
  pts.forEach(([px, py], i) => { const j = (hash(i * 3.1 + seed) - 0.5) * 3; i ? g.lineTo(px + j, py + j) : g.moveTo(px, py); }); g.stroke(); }
const seg = (x0, y0, x1, y1, n = 16) => Array.from({ length: n + 1 }, (_, i) => [x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n]);
const cross = (x, y, s) => { hand(seg(x - s, y - s, x + s, y + s), C.red, 10, 3); hand(seg(x + s, y - s, x - s, y + s), C.red, 10, 5); };
function car(x, y, rot = 0) {                         // xe nhìn từ trên: thân vàng, kính tối
  g.save(); g.translate(x, y); g.rotate(rot); g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 16; g.shadowOffsetY = 8;
  g.fillStyle = C.gold; g.beginPath(); g.roundRect(-70, -38, 140, 76, 22); g.fill(); g.shadowColor = 'transparent';
  g.fillStyle = '#2A2C30'; g.beginPath(); g.roundRect(10, -30, 34, 60, 8); g.fill(); g.beginPath(); g.roundRect(-52, -28, 24, 56, 6); g.fill(); g.restore();
}
function figure(pose, cx, foot, h, crop = 1) { const im = IM[pose], sh = im.height * crop, w = im.width * h / sh;
  g.save(); g.globalAlpha = 0.35; g.filter = 'brightness(0)'; g.drawImage(im, 0, 0, im.width, sh, cx - w / 2 + 16, foot - h + 12, w, h);
  g.filter = 'none'; g.globalAlpha = 1; g.drawImage(im, 0, 0, im.width, sh, cx - w / 2, foot - h, w, h); g.restore(); }
const ev = s => Function(`return (${s.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-')})`)();
const must = (s, v) => { if (ev(s) !== v) throw new Error(`sai: ${s} ≠ ${v}`); return v; };

const R0 = [y => { y.moveTo(-200, 420); y.lineTo(1180, 420); y.bezierCurveTo(1400, 420, 1460, 200, 1700, 180); y.lineTo(2200, 180); },
            y => { y.moveTo(1180, 420); y.bezierCurveTo(1400, 420, 1460, 700, 1700, 720); y.lineTo(2200, 720); }];
const R1 = [y => { y.moveTo(-200, 330); y.lineTo(2200, 330); }, y => { y.moveTo(700, 330); y.bezierCurveTo(900, 330, 900, 800, 1150, 800); y.lineTo(2200, 800); }];
const frames = [
  () => {                                            // 0 · bài viral sơn trên đường, ngã ba KHÔNG có biển: 9 lên, 1 xuống
    g.drawImage(GROUND[0], 0, 0); R0.forEach(p => laneLines(p));
    const nine = must('6 ÷ 2 × (1 + 2)', 9), one = must('6 ÷ (2 × (1 + 2))', 1);
    ['6', '÷', '2', '(', '1', '+', '2', ')', '=', '?'].forEach((s, i) => paint(s, 120 + i * 98, 420, 104, s === '?' ? C.yellow : C.paint));
    sign(null, '?', 1260, 610, 54);                  // biển trống ở ngã ba: không ai quy định
    paint(String(nine), 1840, 180, 150, C.gold); paint(String(one), 1840, 720, 150, C.gold);
    text('left to right', 1560, 90, 'italic 600 46px "Cormorant Garamond"', C.paint); text('glued-on × first', 1530, 905, 'italic 600 46px "Cormorant Garamond"', C.paint);
    figure('twoways', 300, 1080, 470, 1);
  },
  () => {                                            // 1 · 10 − 3 + 2: xe chạy trái → phải, đoạn đã qua gộp thành 7; lối rẽ "cộng trước" bị chặn
    g.drawImage(GROUND[1], 0, 0); R1.forEach(p => laneLines(p));
    const ok1 = must('10 − 3', 7), ok = must('10 − 3 + 2', 9), bad = must('10 − (3 + 2)', 5);
    paint(String(ok1), 330, 330, 120); car(560, 330); paint('+', 960, 330, 120); sign('AS', '+', 960, 110, 62); paint('2', 1240, 330, 120); paint('=', 1420, 330, 110); paint(String(ok), 1580, 330, 130, C.gold);
    paint('10', 1350, 800, 96, '#9A9A96'); paint('−', 1470, 800, 96, '#9A9A96'); paint(String(must('3 + 2', 5)), 1580, 800, 96, '#9A9A96');
    paint('=', 1700, 800, 96, '#9A9A96'); paint(String(bad), 1810, 800, 110, C.red); cross(1810, 800, 70);
    sign(null, '!', 860, 560, 50); text('add first?', 960, 610, 'italic 600 52px "Cormorant Garamond"', C.red);
    text('read left to right', 120, 470, 'italic 600 46px "Cormorant Garamond"', C.paint);
  },
];

(async () => {
  await Promise.all(['800 150px', '800 130px', '800 120px', '800 110px', '800 104px', '800 96px', '800 65px', '800 57px', '800 52px'].map(f => document.fonts.load(f + ' "Archivo"'))
    .concat(['italic 600 52px', 'italic 600 46px'].map(f => document.fonts.load(f + ' "Cormorant Garamond"'))));
  await new Promise((res, rej) => { const im = new Image(); im.onload = () => { IM.twoways = toCanvas(im); res(); }; im.onerror = () => rej(new Error('img'));
    im.src = '../../assets/character-v2/cut/pose-twoways.png'; });
  GROUND = [ground(R0), ground(R1)]; ready = true;
})().catch(e => { window.__intro.error = String(e); });
const frame = t => { g.setTransform(1, 0, 0, 1, 0, 0); frames[Math.min(1, Math.floor(t))](); };
window.__intro = { get ready() { return ready; }, still: frame, frame, DUR: 2 };
</script>
