<!doctype html><meta charset="utf-8">
<title>Lab — sliderule</title>
<style>
  @font-face{font-family:"Archivo";src:url("../../../assets/fonts/Archivo[wdth,wght].ttf");font-weight:100 900;font-stretch:62% 125%;}
  @font-face{font-family:"Plex Mono";src:url("../../../assets/fonts/IBMPlexMono-Medium.ttf");font-weight:500;}
  html,body{margin:0;background:#EEF4F6;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
<canvas id=cv width=1920 height=1080></canvas>
<script type="module">
// DNA tóm tắt — "sliderule · bàn kỹ sư 1950s" (logarithm). Bàn thử, KHÔNG phải code video. Chụp: node engine/render/shoot.js stills --page tools/lab/sliderule.html --dur 2 --t 0.5,1.5 --outdir out/_lab/sliderule
// Ý: logarit là thứ người ta từng CẦM TRONG TAY — 350 năm, mọi kỹ sư nhân bằng cách trượt hai thanh gỗ. Cả bài là một bàn gỗ sáng dưới cửa sổ nắng, tờ giấy kẻ ô xanh nhạt, thước trượt celluloid trắng ngà vạch đen/đỏ. Nhân = đặt hai đoạn độ dài nối nhau; đó là cái "à" của bài, và người xem THẤY nó trên thước.
// Vật xuyên suốt: THƯỚC TRƯỢT / THANG LOGARIT. (1) viên gạch = một đoạn thước dài log 2 (khối đỏ trên rãnh trượt); 2·2·2 = ba đoạn nối → tới vạch 8; 8 × 4 = trượt 3 đoạn + 2 đoạn = 5 · (2) bậc ×10 = các đoạn thước bằng nhau, mỗi đoạn là một thước 1–10 thu nhỏ; nối 11 đoạn thành thước dài, kiến và cá voi cùng nằm trên đó · (3) tiền = đồng xu đồng thau đặt lên thước, chồng xu gấp đôi; lãi chia nhỏ → các đồng xu nhỏ dần lấp dần tới vạch e = 2.718 · (4) động đất / dB / pH = cùng thước in thang khác (Richter, dB, pH), con trượt đếm bậc.
// Màu (một màu một nghĩa): gỗ phong #D6AE76, giấy kẻ ô #F0F5F7 (ô #D3E4EE / #A9CBE0) = nền mát · celluloid ngà #F7F0DB + mực đen #1E1C1A = trung tính, vạch thước · ĐỒNG THAU #E9AE3E (chữ #8A5300) = TIỀN / TĂNG TRƯỞNG (xu, ×2, 72) · ĐỎ SON thước #C0352B (chữ #A82A20) = CƠ SỐ / VIÊN GẠCH (vạch đỏ, khối log 2, sợi tóc con trượt) · XANH MỰC KỸ THUẬT #1F4F8F = LOGARIT / SỐ BẬC (thang L, số mũ, bước ×10) · CHÌ XÁM #6B6E75 = SAI / ước lượng (gạch chì, tẩy) · nắng #FFF1CF chỉ là ánh sáng, không mang nghĩa.
// Chữ: Archivo (đậm, số tiền, 72, nhãn lớn; đủ ₂ ¹ ¹ × ÷ ≈ − $ % ·; THIẾU ⁻ → log₂(1/8) = −3 viết dấu − thường, không mũ âm) · IBM Plex Mono Medium = chữ khắc trên thước, khung tên bản vẽ, bảng log in (giống chữ Leroy của kỹ sư). Mỗi chữ in trên vật (thẻ giấy, thước, khung tên), không trôi tự do.
// Tiếng (assets/sfx/library.json): trượt thước = whoosh ngắn khô · con trượt chốt vạch = tick/click · xu đặt xuống = coin · chồng xu gấp đôi = coin ×n + chime nhỏ · lật trang bảng log = paper/flap · số bật = pop. MỚI (đề xuất): tiếng gỗ-celluloid trượt rít (slide rule friction), tay quay máy tính cơ (Brunsviga crank ratchet), tem dập số lên trang.
// Các phần khác: viên gạch 2·2·2 = khối đỏ dài log 2 nối trên rãnh, đầu khối chạm vạch 2, 4, 8 · log₂(1/8) = ba khối lùi sang trái số 1 · thước ×10 = 11 đoạn bằng nhau (khung 1) · Napier / trang 1614 / bảng Briggs / thước trượt thật = ẢNH THẬT kẹp bằng kẹp giấy lên giấy kẻ ô, viền trắng như ảnh in, góc dán băng keo · động đất = băng địa chấn thật kẹp cạnh thước Richter, mỗi vạch ×32 năng lượng = chồng xu ×32 nhỏ · dB = thước dB cạnh ống loa / chuông · pH = chanh nằm trên thước pH 2 ↔ ly nước ở 7, 5 đoạn = ×100 000 · tạ 10 kg vs 100 kg = hai quả cân đồng thau trên thước, cách nhau đúng một đoạn · lãi chia nhỏ → e = xu nhỏ dần nối nhau trên thước, dừng ở vạch e đỏ · 69.3 → 72 = sợi tóc con trượt dời từ 69.3 sang 72 trên thang D, kèm dãy ước 2·3·4·6·8·9·12 khắc lên thước · máy tính cơ (tay quay) = đạo cụ phụ bàn bên.
import { toCanvas } from '../../../engine/mascot.js';
import { hash } from '../../../engine/lib.js';

const W = 1920, H = 1080, TAU = Math.PI * 2, g = document.getElementById('cv').getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const AR = '"Archivo"', PM = '"Plex Mono"';
const C = { paper: '#F0F5F7', gridMi: '#D3E4EE', gridMa: '#A9CBE0', wood: '#D6AE76', ink: '#1E1C1A', ivory: '#F7F0DB', ivoryDk: '#BBAF8E',
  brass: '#E9AE3E', money: '#8A5300', red: '#C0352B', redInk: '#A82A20', log: '#1F4F8F', bad: '#6B6E75', badInk: '#55585E', sun: '#FFF1CF' };
const IM = {}; let BG = null, ready = false;

// ---- số: tính bằng code, must() ----
const ev = s => Function(`return (${s})`)();
const must = (s, v) => { const r = ev(s); if (r !== v) throw new Error(`sai: ${s} = ${r} ≠ ${v}`); return v; };
const r3 = s => `Math.round((${s}) * 1000) / 1000`;
const P0 = must('1000', 1000), RATE = must('8', 8);
const RULE72 = must(`72 / ${RATE}`, 9);                                            // quy tắc 72
must(r3(`Math.log(2) / Math.log(1 + ${RATE} / 100)`), 9.006);                     // thật: 9 năm 2 ngày
must(`Math.round((Math.log(2) / Math.log(1.08) - 9) * 365)`, 2);
const P1 = must(`${P0} * 2`, 2000);
must(r3('Math.log10(72) - Math.log10(8)'), must(r3('Math.log10(9)'), 0.954));   // thước trượt: C8 trên D72 → D9 dưới chỉ số C
const SLIDE0 = must(r3('Math.log10(7.2 / 8)'), -0.046);                           // dời con trượt (đơn vị độ dài thước)
// kiến ↔ cá voi (CONTENT): 3 mg ↔ 150 t = 1.5e11 mg
const ANT_MG = 3, WHALE_MG = must('150 * 1e9', 1.5e11);
const STEPS = must(r3(`Math.log10(${WHALE_MG} / ${ANT_MG})`), 10.699);
must(`Math.round(${STEPS})`, 11);
const LANT = Math.log10(ANT_MG), LWHALE = Math.log10(WHALE_MG);
must(r3(`Math.log10(${ANT_MG})`), 0.477); must(r3(`Math.log10(${WHALE_MG})`), 11.176);
// mốc ≈ (không có trong CONTENT → ghi "≈"): chuột ≈ 20 g, người ≈ 70 kg, voi ≈ 6 t
const MARKS = [['mouse', must('20 * 1e3', 2e4), '≈ 20 g'], ['human', must('70 * 1e6', 7e7), '≈ 70 kg'], ['elephant', must('6 * 1e9', 6e9), '≈ 6 t']];
const money = v => '$' + v.toLocaleString('en-US');
must(`'${money(P0)}'`, '$1,000'); must(`'${money(P1)}'`, '$2,000');
const mant = v => String(Math.round(Math.log10(v) % 1 * 10000)).padStart(4, '0'); // bảng log in: phần định trị 4 chữ số
must(`'${mant(1.1)}'`, '0414'); must(`'${mant(2)}'`, '3010');
// tương phản đo bằng số
const lum = h => { const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
const cr = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
const CR = {}; for (const [k, fg, bg, min] of [['ink/paper', C.ink, C.paper, 4.5], ['money/paper', C.money, C.paper, 4.5], ['log/paper', C.log, C.paper, 4.5],
  ['redInk/ivory', C.redInk, C.ivory, 4.5], ['ink/ivory', C.ink, C.ivory, 4.5], ['log/ivory', C.log, C.ivory, 4.5], ['badInk/paper', C.badInk, C.paper, 4.5],
  ['money/tag', C.money, '#F6E7C4', 4.5], ['72/paper', '#C25A0C', C.paper, 3.0], ['drum', C.ink, '#F7F3E8', 4.5], ['plate', '#F3EEDF', '#33433D', 4.5]]) {
  CR[k] = Math.round(cr(fg, bg) * 100) / 100; if (CR[k] < min) throw new Error(`tương phản thấp ${k} = ${CR[k]}`); }

// ---- tiện ích ----
const rr = (x, y, w, h, r) => { const p = new Path2D(); p.roundRect(x, y, w, h, r); return p; };
const txt = (s, x, y, font, col = C.ink, align = 'left', base = 'alphabetic') => { g.save(); g.font = font; g.textAlign = align; g.textBaseline = base; g.fillStyle = col; g.fillText(s, x, y); const w = g.measureText(s).width; g.restore(); return w; };
const line = (x0, y0, x1, y1, col, w, cap = 'round', c = g) => { c.save(); c.strokeStyle = col; c.lineWidth = w; c.lineCap = cap; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); c.restore(); };
const BOX = window.__boxes = {};
// BÓNG TẤT ĐỊNH (LESSONS §127): sprite 9 mảnh vẽ MỘT lần trên canvas CPU, kéo giãn; không shadowBlur khi render.
const SPR = {};
function shadowSprite(r, blur, col) {
  const id = `${r}|${blur}|${col}`; if (SPR[id]) return SPR[id];
  const m = r + 2 * blur, n = 2 * m + 1, c = mk(n, n), x = c.getContext('2d', { willReadFrequently: true }), OFF = 4 * n;
  x.shadowColor = col; x.shadowBlur = blur; x.shadowOffsetX = OFF; x.fillStyle = '#000';
  const p = new Path2D(); p.roundRect(2 * blur - OFF, 2 * blur, 2 * r + 1, 2 * r + 1, r); x.fill(p);
  return (SPR[id] = { c, m });
}
function shadowRR(x, y, w, h, r = 14, { col = 'rgba(70,50,20,0.22)', blur = 16, ox = 10, oy = 12 } = {}, c = g) {
  r = Math.round(Math.max(0, Math.min(r, w / 2, h / 2))); blur = Math.round(blur);
  const { c: sp, m } = shadowSprite(r, blur, col), X = x - 2 * blur + ox, Y = y - 2 * blur + oy, TW = w + 4 * blur, TH = h + 4 * blur, mid = TW - 2 * m, midh = TH - 2 * m;
  const xs = [[0, m, X, m], [m, 1, X + m, mid], [m + 1, m, X + m + mid, m]], ys = [[0, m, Y, m], [m, 1, Y + m, midh], [m + 1, m, Y + m + midh, m]];
  for (const [sx, sw, dx, dw] of xs) for (const [sy, sh, dy, dh] of ys) if (dw > 0 && dh > 0) c.drawImage(sp, sx, sy, sw, sh, dx, dy, dw, dh);
}
function blob(x, y, rx, ry, a = 0.28, rgb = '70,50,20') {                         // bóng đổ mềm hình elip = gradient tròn bị nén
  g.save(); g.translate(x, y); g.scale(1, ry / rx); const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
  gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rx, 0, TAU); g.fill(); g.restore();
}

// ---- BÀN: gỗ phong sáng, tờ giấy kẻ ô xanh nhạt, nắng cửa sổ chéo từ trên trái ----
function desk() {
  const c = mk(), x = c.getContext('2d');
  let gr = x.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#E2BD86'); gr.addColorStop(1, '#C99B60'); x.fillStyle = gr; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 90; i++) {                                                   // vân gỗ: sóng mảnh, tất định
    const y0 = i * 13 + hash(i * 1.7) * 8, a = 0.05 + hash(i * 3.3) * 0.08; x.strokeStyle = `rgba(120,78,30,${a})`; x.lineWidth = 1 + hash(i * 5.1) * 2; x.beginPath();
    for (let px = 0; px <= W; px += 24) { const py = y0 + Math.sin(px / (180 + hash(i) * 200) + i) * 6 + Math.sin(px / 47 + i * 2) * 1.5; px ? x.lineTo(px, py) : x.moveTo(px, py); } x.stroke(); }
  // tờ giấy kẻ ô, hơi xoay
  x.save(); x.translate(W / 2, H / 2); x.rotate(-0.012);
  const PW = 1880, PH = 1040; shadowRR(-PW / 2, -PH / 2, PW, PH, 2, { col: 'rgba(70,45,15,0.30)', blur: 14, ox: 10, oy: 12 }, x);
  x.fillStyle = C.paper; x.fillRect(-PW / 2, -PH / 2, PW, PH);
  for (let k = 0; k * 24 <= PW; k++) { const px = -PW / 2 + 20 + k * 24; if (px > PW / 2) break; const ma = k % 5 === 0; x.fillStyle = ma ? C.gridMa : C.gridMi; x.fillRect(px, -PH / 2, ma ? 1.6 : 1, PH); }
  for (let k = 0; k * 24 <= PH; k++) { const py = -PH / 2 + 16 + k * 24; if (py > PH / 2) break; const ma = k % 5 === 0; x.fillStyle = ma ? C.gridMa : C.gridMi; x.fillRect(-PW / 2, py, PW, ma ? 1.6 : 1); }
  for (let i = 0; i < 1800; i++) { x.fillStyle = hash(i * 2.1) > 0.5 ? 'rgba(120,140,160,0.05)' : 'rgba(255,255,255,0.4)'; x.fillRect(-PW / 2 + hash(i * 1.3) * PW, -PH / 2 + hash(i * 7.7) * PH, 2, 2); }
  x.restore();
  // nắng: hai ô cửa sáng chéo + bóng song cửa
  x.save(); x.globalCompositeOperation = 'soft-light';
  [[-200, 0.55], [520, 0.45]].forEach(([ox, a]) => { const q = x.createLinearGradient(ox, 0, ox + 900, H); q.addColorStop(0, `rgba(255,236,190,${a})`); q.addColorStop(1, 'rgba(255,236,190,0)');
    x.fillStyle = q; x.beginPath(); x.moveTo(ox, 0); x.lineTo(ox + 620, 0); x.lineTo(ox + 1420, H); x.lineTo(ox + 800, H); x.closePath(); x.fill(); });
  x.restore();
  x.fillStyle = 'rgba(255,248,226,0.20)'; x.beginPath(); x.moveTo(-200, 0); x.lineTo(420, 0); x.lineTo(1220, H); x.lineTo(600, H); x.closePath(); x.fill();
  x.fillStyle = 'rgba(60,80,110,0.035)'; x.beginPath(); x.moveTo(420, 0); x.lineTo(520, 0); x.lineTo(1320, H); x.lineTo(1220, H); x.closePath(); x.fill();
  return c;
}

// ---- THƯỚC TRƯỢT: celluloid ngà trên lõi gỗ gụ, thang L (xanh) · C (đen, trên con trượt) · D (đen); con trượt kính sợi tóc đỏ ----
const TICKS = [];                                                                   // vạch thang 1–10: [giá trị, cấp]
for (let v = 100; v <= 1000; v += (v < 200 ? 2 : v < 500 ? 5 : 10)) TICKS.push([v / 100, v % 100 === 0 ? 0 : v % 50 === 0 ? 1 : v % 10 === 0 ? 2 : 3]);
function logScale(sx0, SL, y, dir, labelY, col, { labels = true, size = 30, minX = -1e9 } = {}) {   // dir = +1 vạch hướng xuống, −1 hướng lên
  for (const [v, lv] of TICKS) { const x = sx0 + SL * Math.log10(v), len = [26, 18, 13, 8][lv]; line(x, y, x, y + dir * len, col, lv === 0 ? 2.4 : 1.4, 'butt'); }
  if (labels) for (let k = 1; k <= 10; k++) if (sx0 + SL * Math.log10(k) > minX) txt(k === 10 ? '1' : String(k), sx0 + SL * Math.log10(k), labelY, `500 ${size}px ${PM}`, col, 'center', 'middle');
}
function slideRule(x0, y0, len, { slide = 0, cursor = null } = {}) {
  const h1 = 58, h2 = 62, h3 = 58, gap = 3, HT = h1 + h2 + h3 + 2 * gap, sx0 = x0 + 78, SL = len - 156, dx = slide * SL;
  shadowRR(x0, y0, len, HT, 6, { col: 'rgba(70,45,15,0.34)', blur: 16, ox: 16, oy: 18 });
  g.fillStyle = '#6E4026'; g.fill(rr(x0, y0 + h1 - 2, len, h2 + 2 * gap + 4, 3));       // lõi gụ lộ ở rãnh
  const ivo = (x, y, w, h) => { const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, '#FCF8EA'); gr.addColorStop(1, '#EEE4C8'); g.fillStyle = gr; g.fill(rr(x, y, w, h, 4)); g.strokeStyle = C.ivoryDk; g.lineWidth = 1.5; g.stroke(rr(x, y, w, h, 4)); };
  ivo(x0, y0, len, h1); ivo(x0, y0 + h1 + 2 * gap + h2, len, h3);
  ivo(x0 + 34 + dx, y0 + h1 + gap, len - 68, h2);                                       // con trượt
  // thang L (log, xanh) mép dưới thước trên: tuyến tính 0–1
  const yL = y0 + h1 - 2;
  for (let k = 0; k <= 50; k++) { const x = sx0 + SL * k / 50, lv = k % 10 === 0 ? 0 : k % 5 === 0 ? 1 : 2; line(x, yL, x, yL - [22, 15, 9][lv], C.log, lv ? 1.4 : 2.4, 'butt'); }
  for (let k = 0; k <= 10; k++) txt(k === 0 ? '0' : k === 10 ? '1' : '.' + k, sx0 + SL * k / 10, y0 + 18, `500 28px ${PM}`, C.log, 'center', 'middle');
  // thang C (con trượt, mép dưới) và D (thước dưới, mép trên)
  const yC = y0 + h1 + gap + h2, yD = y0 + h1 + 2 * gap + h2;
  g.save(); g.beginPath(); g.rect(x0 + 34 + dx, y0 + h1 + gap, len - 68, h2); g.clip();
  logScale(sx0 + dx, SL, yC, -1, yC - 40, C.ink, { minX: x0 + 34 + dx + 80 }); g.restore();
  logScale(sx0, SL, yD, 1, yD + 40, C.ink);
  [['L', y0 + 18, C.log], ['C', yC - 40, C.ink], ['D', yD + 40, C.ink]].forEach(([s, y, col]) => txt(s, x0 + 46, y, `500 28px ${PM}`, col, 'center', 'middle'));
  // nẹp nhôm hai đầu
  [x0 - 6, x0 + len - 18].forEach(bx => { const gr = g.createLinearGradient(bx, 0, bx + 24, 0); gr.addColorStop(0, '#E4E6E8'); gr.addColorStop(0.5, '#B9BEC3'); gr.addColorStop(1, '#8F959B');
    g.fillStyle = gr; g.fill(rr(bx, y0 - 4, 24, HT + 8, 4)); [y0 + 14, y0 + HT - 14].forEach(sy => { g.fillStyle = '#7A8086'; g.beginPath(); g.arc(bx + 12, sy, 5, 0, TAU); g.fill(); line(bx + 9, sy - 3, bx + 15, sy + 3, '#D8DCDF', 1.5); }); });
  if (cursor != null) {                                                              // con trượt kính: khung nhôm, sợi tóc đỏ
    const cx = sx0 + SL * Math.log10(cursor), cw = 84, cy0 = y0 - 22, ch = HT + 44;
    shadowRR(cx - cw / 2, cy0, cw, ch, 6, { col: 'rgba(70,45,15,0.18)', blur: 10, ox: 10, oy: 10 });
    g.fillStyle = 'rgba(214,236,248,0.30)'; g.fill(rr(cx - cw / 2, cy0, cw, ch, 6));
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(cx - cw / 2 + 8, cy0 + 20, 10, ch - 40);
    [cy0, cy0 + ch - 18].forEach(by => { const gr = g.createLinearGradient(0, by, 0, by + 18); gr.addColorStop(0, '#E8EAEC'); gr.addColorStop(1, '#9AA0A6'); g.fillStyle = gr; g.fill(rr(cx - cw / 2 - 4, by, cw + 8, 18, 4)); });
    line(cx, cy0 + 18, cx, cy0 + ch - 18, C.red, 2.2, 'butt');
    BOX.cursor = [cx, cy0, ch];
  }
  BOX.rule = [x0, y0, len, HT]; return { sx0, SL, HT, yC, yD };
}

// ---- TIỀN: chồng xu đồng thau ----
function coin(cx, y, rx, ry, th, top) {
  let gr = g.createLinearGradient(cx - rx, 0, cx + rx, 0); gr.addColorStop(0, '#9A6410'); gr.addColorStop(0.35, '#E3A73A'); gr.addColorStop(0.6, '#F6CE6A'); gr.addColorStop(1, '#A86D14');
  g.fillStyle = gr; g.beginPath(); g.ellipse(cx, y, rx, ry, 0, 0, Math.PI); g.lineTo(cx - rx, y - th); g.ellipse(cx, y - th, rx, ry, 0, Math.PI, 0, true); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(110,70,10,0.35)'; g.lineWidth = 1.2;                         // khía cạnh xu
  for (let k = 1; k < 24; k++) { const a = Math.PI * k / 24, px = cx - rx * Math.cos(a), py = y + ry * Math.sin(a); g.beginPath(); g.moveTo(px, py - th); g.lineTo(px, py); g.stroke(); }
  if (top) {
