<canvas id=cv width=1920 height=1080></canvas>
<script type="module">
// DNA tóm tắt — "切り紙 · Kirigami" (ja/chirality). Bàn thử, KHÔNG phải code video. Chụp: node engine/render/shoot.js stills --page tools/lab/kirigami.html --dur 2 --t 0.5,1.5 --outdir out/_lab/kirigami
// Ý: ai ở Nhật cũng từng gấp đôi tờ giấy rồi cắt (切り紙) ở tiểu học — mở ra là hai nửa đối xứng gương. Bài nói về "ảnh gương" → GƯƠNG = NẾP GẤP của MỘT tờ 和紙 trắng mở
//   hình chữ V nông trên tấm thớt cắt xanh (カッターマット, lưới ô): nửa trái = thế giới 左, nửa phải = 右, nếp gấp có rãnh tối + vệt sáng. Mọi khung dùng CÙNG tờ giấy, cùng nếp.
//   Ý thứ hai, đúng vật lý: lật một miếng giấy cắt = ảnh gương của nó, và lật thì lộ MẶT KIA. Giấy origami hai mặt 柿/藍 → tay trái là mặt 柿, tay phải là mặt 藍 (góc gấp
//   lộ mặt sau). Phân tử = quả cầu 3D chiếu, "đặt" trên tờ origami vuông với bóng đổ; bản thử xoay = 薄紙 (giấy can) đặt chồng, nguyên tử viền nét đứt.
// Màu: thớt #2C654C (lưới #4E8A6C) · 和紙 #F7F3EA→#E9E2D4 (nếp) · 墨 #1E1A16 · 左 = 柿 #E8853D (chữ #A3470F) · 右 = 藍 nhạt #86AED6 (chữ #22517F) — cam/xanh an toàn mù màu,
//   thêm vị trí trái/phải · 胡粉 #F4F0E6 chữ trên thớt · 朱 #B3261E CHỈ ✗ / cái sai. Nguyên tố: C #3A3632 · H #F5F1E8 · F #BBD97C · Cl #4E9C55 · Br #8C3B2C · O #D9667A (珊瑚) · N #5A6FB8.
// Chữ: Shippori Mincho Bold (タイトル, テロップ, 縦書き trục) · Noto Sans JP (nhãn, công thức, số; ✓ Noto, ✗ vẽ tay; chỉ số dưới vẽ tay).
// Tiếng: flap/page (gấp, mở tờ, lật miếng giấy) · tear (cắt kéo — nét cắt mới) · snap (miếng dán khớp) · pen (nhãn mực) · tick (bước 階段) · error (✗) · correct · coin
//   (đồng xu 37 lần) · shimmer (偏光 sáng lên) · whoosh (trượt giấy can) · hanko (chốt Nobel 2026, ít).
// Phần khác: Pasteur = tinh thể cắt giấy (hình bát diện có mặt vát) hai bên nếp, nhíp gắp sang hai phía; 偏光 = tấm giấy can xoay, vệt sáng nghiêng trái/phải · carvone = hai lá
//   bạc hà / hạt キャラウェイ cắt giấy mỗi bên nếp, chữ mùi · thalidomide = điềm tĩnh: hai phân tử trên hai tờ origami, một tờ được ghim nhãn chú ý (không người, không ảnh) · phân tử
//   phẳng hai mặt = MỘT miếng giấy cắt đặt ngay trên nếp, lật lên thấy mặt 柿 hay 藍 tuỳ phía gắn · 3 điều kiện Frank = ba 短冊 xếp hàng · sàn nhảy 56/38/6 = cặp hình người
//   cắt giấy nối tay (切り紙 dây người), cặp 柿-柿, 藍-藍, 柿-藍 · đồng xu 37 lần 19/18 = 37 chấm tròn đục lỗ trên băng giấy · まとめ = mở hết tờ: mọi miếng trong bài nằm đối xứng qua nếp.
import { toCanvas } from '../../../engine/mascot.js';
import { hash } from '../../../engine/lib.js';

const W = 1920, H = 1080, g = document.getElementById('cv').getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const MIN = '"Shippori Mincho"', NOTO = '"Noto Sans JP"';
const C = { mat: '#2C654C', grid: '#4E8A6C', washi: '#F7F3EA', washiDk: '#E9E2D4', sumi: '#1E1A16', grey: '#5A534B', gofun: '#F4F0E6',
  kaki: '#E8853D', kakiInk: '#A3470F', ai: '#86AED6', aiInk: '#22517F', shu: '#B3261E' };
const EL = { C: { col: '#3A3632', r: 0.44, ink: '#F4F0E6' }, H: { col: '#F5F1E8', r: 0.34, ink: '#1E1A16' }, F: { col: '#BBD97C', r: 0.42, ink: '#1E1A16' },
  Cl: { col: '#4E9C55', r: 0.52, ink: '#1E1A16' }, Br: { col: '#8C3B2C', r: 0.60, ink: '#F4F0E6' } };
const IM = {}, SH = {}; let MAT, FIB, MOL = {}, ready = false;

const ev = s => Function(`return (${s})`)();
const must = (s, v) => { const r = ev(s); if (r !== v) throw new Error(`sai: ${s} = ${r} ≠ ${v}`); return v; };
const lum = hex => { const v = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(c => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; };
const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
const needC = (a, b, k, what) => { const c = contrast(a, b); if (c < k) throw new Error(`tương phản ${what} ${c.toFixed(2)} < ${k}`); return c; };
const shade = (hex, f) => '#' + [1, 3, 5].map(i => Math.max(0, Math.min(255, Math.round(parseInt(hex.slice(i, i + 2), 16) * f))).toString(16).padStart(2, '0')).join('');

// ── vec3 ──
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a); return a.map(v => v / l); }, scl = (a, s) => a.map(v => v * s);
const rotX = (p, a) => [p[0], p[1] * Math.cos(a) - p[2] * Math.sin(a), p[1] * Math.sin(a) + p[2] * Math.cos(a)];
const rotY = (p, a) => [p[0] * Math.cos(a) + p[2] * Math.sin(a), p[1], -p[0] * Math.sin(a) + p[2] * Math.cos(a)];
// CIP từ toạ độ: ưu tiên Br > Cl > F > H; nhìn từ phía đối diện H, 1→2→3 theo chiều kim đồng hồ ⇔ R ⇔ (v1×v2)·h > 0
function cip(atoms) {
  const at = el => { const a = atoms.find(q => q.el === el); return [a.x, a.y, a.z]; }, c = at('C');
  return dot(cross(sub(at('Br'), c), sub(at('Cl'), c)), sub(at('H'), c)) > 0 ? 'R' : 'S';
}
const mirror = atoms => atoms.map(a => ({ ...a, x: -a.x }));

// ── vật liệu nạp sẵn ──
function cutmat() {                                    // thớt cắt xanh: lưới 1 cm mảnh + 5 cm đậm, vết dao mờ, sáng trên-trái
  const c = mk(), x = c.getContext('2d'), d = x.createImageData(W, H);
  for (let i = 0; i < W * H; i++) { const px = i % W, py = (i / W) | 0;
    const l = 10 - 22 * Math.min(1.2, Math.hypot(px + 300, py + 200) / 2600) + (hash(i * 0.613) - 0.5) * 6;
    d.data[i * 4] = 44 + l * 0.6; d.data[i * 4 + 1] = 101 + l; d.data[i * 4 + 2] = 76 + l * 0.8; d.data[i * 4 + 3] = 255; }
  x.putImageData(d, 0, 0);
  for (let k = 0; k * 40 < W + 40; k++) { x.fillStyle = k % 5 ? 'rgba(130,186,156,0.28)' : 'rgba(150,204,174,0.55)'; x.fillRect(k * 40 + 12, 0, k % 5 ? 1 : 2, H); }
  for (let k = 0; k * 40 < H + 40; k++) { x.fillStyle = k % 5 ? 'rgba(130,186,156,0.28)' : 'rgba(150,204,174,0.55)'; x.fillRect(0, k * 40 + 20, W, k % 5 ? 1 : 2); }
  for (let k = 0; k < 60; k++) { const sx = hash(k * 3.3) * W, sy = hash(k * 5.9) * H, a = hash(k * 7.1) * Math.PI, L = 40 + hash(k * 1.9) * 160;
    x.strokeStyle = `rgba(20,52,38,${0.12 + hash(k) * 0.12})`; x.lineWidth = 0.9; x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + L * Math.cos(a), sy + L * Math.sin(a)); x.stroke(); }
  return c;
}
function fibres() {                                     // sợi 楮 của 和紙 (lớp phủ trong suốt)
  const c = mk(), x = c.getContext('2d');
  for (let i = 0; i < 5200; i++) { const fx = hash(i * 1.7) * W, fy = hash(i * 3.1) * H, an = hash(i * 5.3) * Math.PI, L = 8 + hash(i * 2.9) * 30;
    x.strokeStyle = hash(i * 0.37) > 0.35 ? `rgba(160,140,105,${0.06 + hash(i * 0.7) * 0.09})` : 'rgba(255,255,255,0.5)'; x.lineWidth = 0.7;
    x.beginPath(); x.moveTo(fx, fy); x.quadraticCurveTo(fx + L * 0.5 * Math.cos(an + 0.5), fy + L * 0.5 * Math.sin(an + 0.5), fx + L * Math.cos(an), fy + L * Math.sin(an)); x.stroke(); }
  return c;
}

// ── TỜ GIẤY GẤP ĐÔI = GƯƠNG. Hai nửa hơi dựng (mép ngoài gần hơn → cao hơn), nếp lõm có rãnh tối + vệt sáng ──
function sheet(x0, x1, y0, y1, dip = 14) {
  const fx = (x0 + x1) / 2, L = [[x0, y0], [fx, y0 + dip], [fx, y1 - dip], [x0, y1]], R = [[fx, y0 + dip], [x1, y0], [x1, y1], [fx, y1 - dip]];
  const path = pts => { const p = new Path2D(); pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath(); return p; };
  g.save(); g.shadowColor = 'rgba(6,24,16,0.55)'; g.shadowBlur = 34; g.shadowOffsetX = 10; g.shadowOffsetY = 16; g.fillStyle = C.washi;
  g.fill(path([[x0, y0], [fx, y0 + dip], [x1, y0], [x1, y1], [fx, y1 - dip], [x0, y1]])); g.restore();
  [[L, -1], [R, 1]].forEach(([pts, s]) => {
    const p = path(pts); g.save(); g.clip(p);
    // nắng trên-trái: nửa phải (nghiêng về phía nắng) sáng hơn nửa trái; tối dần vào nếp
    g.fillStyle = s < 0 ? '#F2EDE2' : C.washi; g.fill(p);
    const gr = g.createLinearGradient(fx, 0, fx + s * 260, 0); gr.addColorStop(0, 'rgba(120,100,70,0.20)'); gr.addColorStop(0.25, 'rgba(120,100,70,0.06)'); gr.addColorStop(1, 'rgba(120,100,70,0)');
    g.fillStyle = gr; g.fill(p);
    g.globalAlpha = 0.9; g.drawImage(FIB, 0, 0); g.restore();
  });
  g.save(); g.lineCap = 'round';                                                  // nếp: rãnh + vệt sáng lệch phải
  g.strokeStyle = 'rgba(95,78,55,0.45)'; g.lineWidth = 3; g.beginPath(); g.moveTo(fx - 1, y0 + dip); g.lineTo(fx - 1, y1 - dip); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(fx + 2.5, y0 + dip); g.lineTo(fx + 2.5, y1 - dip); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x0, y1); g.lineTo(x0, y0); g.lineTo(fx, y0 + dip); g.lineTo(x1, y0); g.stroke();   // mép giấy bắt nắng
  g.restore();
  return { fx, x0, x1, y0, y1 };
}
// 折り紙 vuông hai mặt: mặt trước + một góc gấp lộ mặt sau. corner: 'bl' | 'br'
function origami(cx, cy, S, rot, face, back, corner, seed = 0) {
  const ear = S * 0.2;
  g.save(); g.translate(cx, cy); g.rotate(rot);
  const h = S / 2, pts = corner === 'bl' ? [[-h, -h], [h, -h], [h, h], [-h + ear, h], [-h, h - ear]] : [[-h, -h], [h, -h], [h, h - ear], [h - ear, h], [-h, h]];
  const p = new Path2D(); pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath();
  g.save(); g.shadowColor = 'rgba(60,40,15,0.42)'; g.shadowBlur = 16; g.shadowOffsetX = 6; g.shadowOffsetY = 9; g.fillStyle = face; g.fill(p); g.restore();
  g.save(); g.clip(p);
  for (let i = 0; i < 160; i++) { const fx = (hash(i * 2.1 + seed) - 0.5) * S, fy = (hash(i * 4.7 + seed) - 0.5) * S, a = hash(i * 1.3 + seed) * 3.1, L = 6 + hash(i * 9.1) * 16;
    g.strokeStyle = hash(i * 0.9) > 0.5 ? 'rgba(255,255,255,0.18)' : 'rgba(60,30,10,0.08)'; g.lineWidth = 0.8; g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx + L * Math.cos(a), fy + L * Math.sin(a)); g.stroke(); }
  const lt = g.createLinearGradient(-h, -h, h, h); lt.addColorStop(0, 'rgba(255,255,255,0.20)'); lt.addColorStop(1, 'rgba(40,20,0,0.10)'); g.fillStyle = lt; g.fillRect(-h, -h, S, S);
  g.restore();
  // góc gấp: tam giác lộ mặt sau, gập vào trong, bóng mềm dưới
  const tri = corner === 'bl' ? [[-h + ear, h], [-h, h - ear], [-h + ear, h - ear]] : [[h, h - ear], [h - ear, h], [h - ear, h - ear]];
  const tp = new Path2D(); tri.forEach(([x, y], i) => i ? tp.lineTo(x, y) : tp.moveTo(x, y)); tp.closePath();
  g.save(); g.shadowColor = 'rgba(60,30,10,0.35)'; g.shadowBlur = 8; g.shadowOffsetX = corner === 'bl' ? 3 : -3; g.shadowOffsetY = -3; g.fillStyle = back; g.fill(tp); g.restore();
  g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 1.2; g.stroke(tp);
  g.restore();
}

// ── phân tử: chiếu phối cảnh, cầu sắp theo z, que nối ──
const VIEW = { pitch: 0.87, yaw: -0.87, d: 11, s: 96 };
const view = a => rotY(rotX([a.x, a.y, a.z], VIEW.pitch), VIEW.yaw);       // toạ độ nhìn (x phải, y lên, z về phía người xem)
function project(p, cx, cy) { const k = VIEW.d / (VIEW.d - p[2]); return [cx + VIEW.s * p[0] * k, cy - VIEW.s * p[1] * k, k]; }
function sphere(x, y, r, col, { ghost = false, ink } = {}) {
  if (ghost) { g.save(); g.setLineDash([7, 6]); g.lineWidth = 3; g.strokeStyle = C.kakiInk; g.fillStyle = 'rgba(232,133,61,0.16)'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.stroke(); g.restore(); return; }
  g.save(); g.shadowColor = 'rgba(40,25,10,0.38)'; g.shadowBlur = r * 0.35; g.shadowOffsetX = r * 0.16; g.shadowOffsetY = r * 0.24; g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore();
  const gr = g.createRadialGradient(x - r * 0.38, y - r * 0.42, r * 0.06, x, y, r); gr.addColorStop(0, 'rgba(255,255,255,0.75)'); gr.addColorStop(0.28, 'rgba(255,255,255,0.12)');
  gr.addColorStop(0.75, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.30)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.strokeStyle = 'rgba(30,26,22,0.75)'; g.lineWidth = 1.6; g.stroke();
}
// pts: [{el, p:[x,y,z] (nhìn)}], bonds → vẽ; trả toạ độ màn hình từng nguyên tử
function molecule(pts, bonds, cx, cy, { ghost = false, labels = true } = {}) {
  const P = pts.map(a => { const [x, y, k] = project(a.p, cx, cy); return { ...a, x, y, k, r: EL[a.el].r * VIEW.s * k }; });
  const items = [...P.map((a, i) => ({ z: a.p[2], kind: 'a', i })), ...bonds.map(b => ({ z: Math.min(P[b.a].p[2], P[b.b].p[2]) - 0.01, kind: 'b', b }))].sort((a, b) => a.z - b.z);
  for (const it of items) {
    if (it.kind === 'b') { const A = P[it.b.a], B = P[it.b.b];
      g.save(); g.lineCap = 'round'; if (ghost) { g.setLineDash([6, 7]); g.strokeStyle = C.kakiInk; g.lineWidth = 3; }
      else { g.strokeStyle = '#4A443D'; g.lineWidth = 15; g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke(); g.strokeStyle = '#B9B0A2'; g.lineWidth = 9; }
      g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke(); g.restore(); }
    else { const a = P[it.i]; sphere(a.x, a.y, a.r, EL[a.el].col, { ghost });
      if (labels) { const fs = Math.max(28, a.r * 0.78); g.font = `700 ${fs}px ${NOTO}`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillStyle = ghost ? C.kakiInk : EL[a.el].ink; g.fillText(a.el, a.x, a.y + fs * 0.04); } }
  }
  return P;
}

// ── chữ ──
function txt(s, x, y, font, col, align = 'left', base = 'alphabetic') { g.save(); g.font = font; g.textAlign = align; g.textBaseline = base; g.fillStyle = col; g.fillText(s, x, y); const w = g.measureText(s).width; g.restore(); return w; }
function runs(parts, x, y, align = 'left') {                 // [chữ, font, màu, khoảng sau, nâng]
  const ws = parts.map(([s, f]) => { g.font = f; return g.measureText(s).width; }), tot = ws.reduce((a, w, i) => a + w + (parts[i][3] ?? 0), 0);
  let cx = align === 'right' ? x - tot : align === 'center' ? x - tot / 2 : x; const x0 = cx;
  parts.forEach(([s, f, col, gap = 0, rise = 0], i) => { txt(s, cx, y - rise, f, col); cx += ws[i] + gap; });
  return [x0, tot];
}
function onMat(s, x, y, size, align = 'left', wt = 700) {      // chữ 胡粉 trên thớt, bóng mực mềm
  g.save(); g.font = `${wt} ${size}px ${MIN}`; g.textAlign = align; g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 10; g.shadowOffsetY = 3; g.fillStyle = C.gofun; g.fillText(s, x, y);
  const w = g.measureText(s).width; g.restore(); return w;
}
function tate(s, x, y, size, col, font = MIN) { [...s].forEach((ch, i) => txt(ch, x, y + i * size * 1.08, `700 ${size}px ${font}`, col, 'center', 'top')); return s.length * size * 1.08; }
function lead(a, b, col = C.sumi, w = 2) { g.save(); g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke(); g.beginPath(); g.arc(...b, 3.5, 0, 7); g.fillStyle = col; g.fill(); g.restore(); }
function cross2(x, y, s) { g.save(); g.strokeStyle = C.shu; g.lineWidth = s * 0.2; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - s / 2, y - s / 2); g.lineTo(x + s / 2, y + s / 2); g.moveTo(x + s / 2, y - s / 2); g.lineTo(x - s / 2, y + s / 2); g.stroke(); g.restore(); }
function check(x, y, s) { g.save(); g.strokeStyle = C.sumi; g.lineWidth = s * 0.18; g.lineCap = g.lineJoin = 'round'; g.beginPath(); g.moveTo(x - s / 2, y); g.lineTo(x - s / 8, y + s * 0.38); g.lineTo(x + s / 2, y - s * 0.42); g.stroke(); g.restore(); }
// 短冊 / nhãn giấy nhỏ dán chéo nhẹ
function tag(x, y, w, h, col, rot = 0) { g.save(); g.translate(x + w / 2, y + h / 2); g.rotate(rot); g.shadowColor = 'rgba(60,40,15,0.35)'; g.shadowBlur = 10; g.shadowOffsetX = 3; g.shadowOffsetY = 5;
