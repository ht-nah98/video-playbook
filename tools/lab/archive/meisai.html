<script type="module">
// DNA tóm tắt — "明細" (ja/gacha). Bàn thử, KHÔNG phải code video. Chụp: node engine/render/shoot.js stills --page tools/lab/meisai.html --dur 2 --t 0.5,1.5 --outdir out/_lab/meisai
// Ý: video này rốt cuộc nói về TIỀN — nên mọi thứ nằm trên bàn kế toán sáng: giấy hoá đơn nhiệt (レシート), sao kê thẻ, sổ cái kẻ dòng. Người Nhật ai cũng cầm レシート / 明細 hằng ngày; "sao kê 3万円" cuối bài là chính chất liệu này, không phải ẩn dụ. Giọng điệu tạp chí thiết kế Nhật: giấy ngà #F6F3EC, mép bàn #E6E1D7, bóng mềm, chữ số mono — sáng, sạch, không giống 4 bài trước (gỗ/tối/kính/lacquer).
// Vật xuyên suốt: MỘT LƯỢT QUAY = MỘT DÒNG HOÁ ĐƠN ("01 ハズレ …… 160", 160 viên đá = một dòng) = một vạch kẻ / một chấm mực. Lưới 1000 = tờ sổ cái 1000 ô, hàng 90 = 90 vạch (cột), tiền = cột số bên phải, điểm đồ thị = chấm mực (1 người = 1 chấm).
// Màu (một màu một nghĩa): giấy ngà #F6F3EC/#FCFBF7 + mực #22201C = trung tính · 朱肉 #B3261E = cảnh báo / 賭博 / khoảng 74–80 · vàng lá (#F3DE8E→#9C7220, luôn có viền nâu #6B4C12) = ★5, độc nhất, chỉ dùng cho ★5 / thanh 90 / tem foil · đỏ casino tối #4A0A10–#7E1219 + kem #F1E6D2 = máy slot (đối lập pastel hồng-tím-mint của màn điện thoại) · xám #6E6A64 = lượt trượt.
// Chữ: Shippori Mincho 700 (tiêu đề, triện) · Noto Sans JP (lời, telop) · IBM Plex Mono (mọi con số, dòng hoá đơn) · Archivo (chữ Latin trên máy slot).
// Tiếng: máy in nhiệt (tạch-tạch-tạch, mỗi dòng 1 tiếng) = mỗi lượt quay · 判子 (triện 朱 đóng: 賭博, 天井) · tick/pop thư viện (chấm mực rơi) · shimmer chuông nhẹ (tem vàng ★5 lóe) · xé giấy (tách hoá đơn) · cash register / đồng xu (160 → tiền) · slot: cuộn quay + cần gạt + ding · page (lật sổ) · whoosh ngắn (cột dựng lên).
// Các phần khác: lưới 1000 = sổ cái 25×40 ô, 6 ô tô tem vàng · mô hình 0.6% = tờ kẻ 100 dòng, 55 dòng trắng · hộp Skinner + ảnh thật = ảnh dán góc (ảnh có viền trắng + băng dính giấy) lên sổ · Hooked 4 bước = 4 tờ hoá đơn xếp ngang, triện số · đồng hồ 23時間 = tem ngày giờ in nhiệt · bảng tin SNS = sao kê dạng cuộn dọc · bản đồ + ảnh báo cáo thật = tờ giấy A4 kẹp trên bàn, ảnh dán góc · đuôi dài 0.15% = một dải hoá đơn dài kéo ra khỏi khung · sao kê 3万円 = chính tờ 明細 thẻ tín dụng, dòng cuối đóng triện 朱 · 3 khúc rẽ = ba tờ hoá đơn ba hướng.
import { toCanvas } from '../../../engine/mascot.js';
import { hash } from '../../../engine/lib.js';

const W = 1920, H = 1080, g = document.getElementById('cv').getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const C = { ink: '#22201C', gray: '#6E6A64', paper: '#F6F3EC', thermal: '#FCFBF7', shu: '#B3261E', shuHi: '#C9392E', gold: '#D9B456', goldLine: '#6B4C12', cream: '#F1E6D2', red0: '#4A0A10', red1: '#7E1219' };
const MIN = '"Shippori Mincho"', NSJ = '"Noto Sans JP"', MONO = '"Plex Mono","Noto Sans JP"', ARC = '"Archivo"';
const IM = {}; let BG, ready = false;

const ev = s => Function(`return (${s})`)();
const must = (s, v) => { if (ev(s) !== v) throw new Error(`sai: ${s} ≠ ${v}`); return v; };
const P = () => new Path2D();
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function vnoise(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, s = t => t * t * (3 - 2 * t);
  const h = (i, j) => hash(i * 12.9898 + j * 78.233 + seed * 3.17);
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1), u = s(xf), v = s(yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// ---- mô hình (tính bằng code, kiểm bằng must) ----
const pm = n => n <= 73 ? 0.006 : Math.min(1, 0.006 + 0.06 * (n - 73));
const PMF = []; { let S = 1; for (let n = 1; n <= 90; n++) { PMF[n] = S * pm(n); S *= 1 - pm(n); } }
const cum = (a, b) => { let s = 0; for (let n = a; n <= b; n++) s += PMF[n]; return s; };
const SIM = (() => {                                       // 200 người = 200 × pmf, làm tròn theo phần dư lớn nhất → tổng đúng 200
  const raw = PMF.map(v => v * 200), cnt = raw.map(v => Math.floor(v)); let left = 200 - cnt.slice(1).reduce((a, b) => a + b, 0);
  const ord = raw.map((v, n) => [v - Math.floor(v), n]).slice(1).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  for (let k = 0; k < left; k++) cnt[ord[k][1]]++;
  return cnt;
})();
const PRE = '(()=>{const p=n=>n<=73?0.006:Math.min(1,0.006+0.06*(n-73));let S=1,c=[];for(let n=1;n<=90;n++){c[n]=S*p(n);S*=1-p(n)}';
const cumE = (a, b) => `${PRE}let s=0;for(let n=${a};n<=${b};n++)s+=c[n];return Math.round(s*100)})()`;
must(cumE(1, 73), 36); must(cumE(74, 80), 56);
const MED = must(`${PRE}let s=0,m=0;for(let n=1;n<=90;n++){s+=c[n];if(s>=0.5){m=n;break}}return m})()`, 76);
const MEAN = must(`${PRE}let s=0;for(let n=1;n<=90;n++)s+=n*c[n];return Math.round(s*10)/10})()`, 62.3);
must('Math.round((0.006+0.06*(74-73))*1000)/10', 6.6); must('Math.round((0.006+0.06*(89-73))*1000)/10', 96.6); must('Math.min(1,0.006+0.06*(90-73))', 1);
if (SIM.slice(1).reduce((a, b) => a + b, 0) !== 200) throw new Error('tổng 200');

// ---- nền: bàn sáng + tờ sổ cái kẻ dòng ----
function background() {
  const c = mk(), x = c.getContext('2d'), d = x.createImageData(W, H);
  for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
    const k = (py * W + px) * 4, n = (hash((py * W + px) * 0.731) - 0.5) * 5 + (vnoise(px / 420, py / 420, 3) - 0.5) * 7 + (vnoise(px / 3, py / 90, 8) - 0.5) * 3;
    const light = 6 - 12 * Math.min(1, Math.hypot(px + 200, py + 300) / 2400);
    d.data[k] = 230 + n + light; d.data[k + 1] = 225 + n + light; d.data[k + 2] = 215 + n * 0.9 + light; d.data[k + 3] = 255;
  }
  x.putImageData(d, 0, 0);
  const IN = 36;                                          // tờ sổ cái nằm trên bàn
  x.save(); x.shadowColor = 'rgba(60,50,35,0.30)'; x.shadowBlur = 26; x.shadowOffsetY = 8; x.fillStyle = C.paper; x.fillRect(IN, IN, W - 2 * IN, H - 2 * IN); x.restore();
  const gp = x.createLinearGradient(0, IN, W, H); gp.addColorStop(0, '#FBF9F4'); gp.addColorStop(1, '#F1EDE3'); x.fillStyle = gp; x.fillRect(IN, IN, W - 2 * IN, H - 2 * IN);
  const d2 = x.getImageData(IN, IN, W - 2 * IN, H - 2 * IN);                           // thớ giấy
  for (let i = 0; i < d2.data.length; i += 4) { const v = (hash(i * 0.37 + 9) - 0.5) * 5; d2.data[i] += v; d2.data[i + 1] += v; d2.data[i + 2] += v; }
  x.putImageData(d2, IN, IN);
  x.strokeStyle = 'rgba(86,112,140,0.17)'; x.lineWidth = 1.2;                           // dòng kẻ sổ
  for (let y = IN + 54; y < H - IN; y += 54) { x.beginPath(); x.moveTo(IN, y + 0.5); x.lineTo(W - IN, y + 0.5); x.stroke(); }
  x.strokeStyle = 'rgba(179,38,30,0.26)'; x.lineWidth = 1.4;                            // đôi vạch lề son
  for (const vx of [74, 80]) { x.beginPath(); x.moveTo(vx, IN); x.lineTo(vx, H - IN); x.stroke(); }
  return c;
}

// ---- vật liệu ----
function paperShadow(path, a = 0.26, dx = 6, dy = 12, blur = 22) { g.save(); g.shadowColor = `rgba(50,40,28,${a})`; g.shadowBlur = blur; g.shadowOffsetX = dx; g.shadowOffsetY = dy; g.fillStyle = '#fff'; g.fill(path); g.restore(); }
function txt(s, x, y, font, col = C.ink, align = 'left', base = 'alphabetic') { g.save(); g.font = font; g.textAlign = align; g.textBaseline = base; g.fillStyle = col; g.fillText(s, x, y); const w = g.measureText(s).width; g.restore(); return w; }
function goldFill(x0, y0, x1, y1) { const gr = g.createLinearGradient(x0, y0, x1, y1);
  gr.addColorStop(0, '#FFF4BE'); gr.addColorStop(0.28, '#E9C865'); gr.addColorStop(0.5, '#B98A2B'); gr.addColorStop(0.72, '#F4DE8E'); gr.addColorStop(1, '#A27622'); return gr; }
function starPath(cx, cy, R, r, rot = -Math.PI / 2) { const p = P(); for (let k = 0; k < 10; k++) { const a = rot + k * Math.PI / 5, q = k % 2 ? r : R; k ? p.lineTo(cx + q * Math.cos(a), cy + q * Math.sin(a)) : p.moveTo(cx + q * Math.cos(a), cy + q * Math.sin(a)); } p.closePath(); return p; }
function foilStar(cx, cy, R, pale) {                                    // sao vàng lá: gradient, viền nâu, vệt sáng chéo
  const p = starPath(cx, cy, R, R * 0.42);
  g.save(); g.shadowColor = 'rgba(70,45,10,0.35)'; g.shadowBlur = R * 0.3; g.shadowOffsetY = R * 0.1; g.fillStyle = pale ? '#FFF6D2' : goldFill(cx - R, cy - R, cx + R, cy + R); g.fill(p); g.restore();
  g.save(); g.clip(p); g.fillStyle = 'rgba(255,255,255,0.55)'; g.save(); g.translate(cx, cy); g.rotate(-0.6); g.fillRect(-R * 1.2, -R * 0.55, R * 2.4, R * 0.16); g.fillRect(-R * 1.2, -R * 0.18, R * 2.4, R * 0.06); g.restore(); g.restore();
  g.strokeStyle = C.goldLine; g.lineWidth = Math.max(1.4, R * 0.06); g.lineJoin = 'round'; g.stroke(p);
}
function foilSeal(cx, cy, r) {                                    // tem vàng răng cưa + sao
  const p = P(), n = 22; for (let k = 0; k < n * 2; k++) { const a = k * Math.PI / n, q = k % 2 ? r * 0.9 : r; k ? p.lineTo(cx + q * Math.cos(a), cy + q * Math.sin(a)) : p.moveTo(cx + q, cy); } p.closePath();
  g.save(); g.shadowColor = 'rgba(70,45,10,0.4)'; g.shadowBlur = r * 0.35; g.shadowOffsetY = r * 0.12; g.fillStyle = goldFill(cx - r, cy - r, cx + r, cy + r); g.fill(p); g.restore();
  g.strokeStyle = C.goldLine; g.lineWidth = 1.4; g.stroke(p);
  g.strokeStyle = 'rgba(107,76,18,0.7)'; g.lineWidth = 1.6; g.beginPath(); g.arc(cx, cy, r * 0.72, 0, 7); g.stroke();
  g.save(); g.clip(p); g.fillStyle = 'rgba(255,255,255,0.5)'; g.translate(cx, cy); g.rotate(-0.7); g.fillRect(-r, -r * 0.5, r * 2, r * 0.14); g.restore();
  const s = starPath(cx, cy, r * 0.52, r * 0.22); g.fillStyle = '#7A5617'; g.fill(s);
}
function sparkle(cx, cy, R, col = '#FFF8D6') { const p = P(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, q = k % 2 ? R * 0.2 : R; k ? p.lineTo(cx + q * Math.cos(a), cy + q * Math.sin(a)) : p.moveTo(cx + q, cy); } p.closePath(); g.fillStyle = col; g.fill(p); }
// 朱肉の判子: vẽ ra canvas phụ, đục lỗ mực, rồi nhân (multiply) lên giấy
function stamp(s, cx, cy, size, rot = 0, { col = C.shu, vertical = false, round = false } = {}) {
  const n = [...s].length, w = round ? size * 1.7 : vertical ? size * 1.5 : n * size + size * 0.7, h = round ? size * 1.7 : vertical ? n * size + size * 0.6 : size * 1.5;
  const pad = 8, c = mk(Math.ceil(w + 2 * pad), Math.ceil(h + 2 * pad)), x = c.getContext('2d');
  x.translate(pad, pad); x.strokeStyle = col; x.fillStyle = col; x.lineWidth = size * 0.1;
  if (round) { x.beginPath(); x.arc(w / 2, h / 2, w / 2 - size * 0.05, 0, 7); x.stroke(); x.lineWidth = size * 0.035; x.beginPath(); x.arc(w / 2, h / 2, w / 2 - size * 0.2, 0, 7); x.stroke(); }
  else { x.beginPath(); x.roundRect(size * 0.05, size * 0.05, w - size * 0.1, h - size * 0.1, size * 0.1); x.stroke(); x.lineWidth = size * 0.035; x.beginPath(); x.roundRect(size * 0.2, size * 0.2, w - size * 0.4, h - size * 0.4, size * 0.05); x.stroke(); }
  x.font = `700 ${size}px ${MIN}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  [...s].forEach((ch, i) => x.fillText(ch, vertical ? w / 2 : w / 2 + (i - (n - 1) / 2) * size, vertical ? h / 2 + (i - (n - 1) / 2) * size * 1.02 : h / 2 + size * 0.04));
  x.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 90; i++) { x.globalAlpha = 0.5 + hash(i * 2.3 + n) * 0.5; x.beginPath(); x.arc(hash(i * 5.1 + n) * w, hash(i * 8.7 + n) * h, 0.7 + hash(i * 1.7) * 2.1, 0, 7); x.fill(); }
  g.save(); g.translate(cx, cy); g.rotate(rot); g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.93; g.drawImage(c, -w / 2 - pad, -h / 2 - pad); g.restore();
  return { w, h };
}
// 感熱紙のレシート: mép răng cưa, cuộn nhẹ, chữ mono
function receiptPath(x, y, w, h, top, bot) {
  const p = P(), t = 11, th = 6; p.moveTo(x, y);
  if (top) for (let k = 0; k < w / t; k++) { p.lineTo(x + (k + 0.5) * t, y - th); p.lineTo(x + Math.min(w, (k + 1) * t), y); } else p.lineTo(x + w, y);
  p.lineTo(x + w, y + h);
  if (bot) for (let k = Math.floor(w / t); k > 0; k--) { p.lineTo(x + k * t - t / 2, y + h + th); p.lineTo(x + (k - 1) * t, y + h); } else p.lineTo(x, y + h);
  p.closePath(); return p;
}
function receipt(x, y, w, h, { rot = 0, top = false, bot = true, tint = C.thermal, curl = 0.07, draw } = {}) {
  g.save(); g.translate(x + w / 2, y + h / 2); g.rotate(rot); g.translate(-(x + w / 2), -(y + h / 2));
  const p = receiptPath(x, y, w, h, top, bot); paperShadow(p);
  g.fillStyle = tint; g.fill(p); g.save(); g.clip(p);
  const gr = g.createLinearGradient(x, 0, x + w, 0); gr.addColorStop(0, `rgba(60,50,35,${curl})`); gr.addColorStop(0.12, 'rgba(255,255,255,0.28)'); gr.addColorStop(0.55, 'rgba(255,255,255,0)'); gr.addColorStop(1, `rgba(60,50,35,${curl * 1.5})`);
  g.fillStyle = gr; g.fillRect(x, y - 10, w, h + 20);
  const gb = g.createLinearGradient(0, y + h - 90, 0, y + h + 8); gb.addColorStop(0, 'rgba(60,50,35,0)'); gb.addColorStop(1, 'rgba(60,50,35,0.10)'); g.fillStyle = gb; g.fillRect(x, y + h - 90, w, 100);
  draw && draw(); g.restore(); g.restore();
}
// điện thoại pastel
function phone(x, y, w, h) {
  const body = P(); body.roundRect(x, y, w, h, 58);
  paperShadow(body, 0.34, 14, 26, 40);
  let gr = g.createLinearGradient(x, y, x + w, y + h); gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(0.5, '#DCDAD6'); gr.addColorStop(1, '#F4F2EE'); g.fillStyle = gr; g.fill(body);
  g.strokeStyle = 'rgba(80,72,64,0.5)'; g.lineWidth = 1.5; g.stroke(body);
  const bez = P(); bez.roundRect(x + 9, y + 9, w - 18, h - 18, 50); g.fillStyle = '#141418'; g.fill(bez);
  const sx = x + 21, sy = y + 21, sw = w - 42, sh = h - 42, scr = P(); scr.roundRect(sx, sy, sw, sh, 40);
  g.save(); g.clip(scr);
  gr = g.createLinearGradient(sx, sy, sx + sw * 0.3, sy + sh); gr.addColorStop(0, '#FFE6EE'); gr.addColorStop(0.5, '#E8E3FA'); gr.addColorStop(1, '#D9F2E8'); g.fillStyle = gr; g.fillRect(sx, sy, sw, sh);
  // ánh ★5 vừa lóe: vầng vàng mờ sau thẻ
  const gl = g.createRadialGradient(sx + sw / 2, sy + 270, 10, sx + sw / 2, sy + 270, 250); gl.addColorStop(0, 'rgba(255,238,160,0.9)'); gl.addColorStop(0.5, 'rgba(255,238,170,0.35)'); gl.addColorStop(1, 'rgba(255,238,170,0)'); g.fillStyle = gl; g.fillRect(sx, sy, sw, sh);
  txt('ガチャ', sx + sw / 2, sy + 78, `700 34px ${NSJ}`, '#3A3550', 'center');
  txt('9:41', sx + 46, sy + 40, `500 22px ${MONO}`, '#3A3550', 'left');
  // thẻ foil
  const cw = 196, ch = 262, cx0 = sx + sw / 2 - cw / 2, cy0 = sy + 118, card = P(); card.roundRect(cx0, cy0, cw, ch, 16);
  g.save(); g.shadowColor = 'rgba(120,90,20,0.5)'; g.shadowBlur = 34; g.shadowOffsetY = 8; g.fillStyle = goldFill(cx0, cy0, cx0 + cw, cy0 + ch); g.fill(card); g.restore();
  g.save(); g.clip(card); const mx = cx0 + cw / 2, my = cy0 + ch * 0.44;
  for (let k = 0; k < 16; k++) { g.fillStyle = k % 2 ? 'rgba(255,250,220,0.34)' : 'rgba(255,250,220,0)'; g.beginPath(); g.moveTo(mx, my); g.arc(mx, my, 330, k * Math.PI / 8, (k + 1) * Math.PI / 8); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,0.5)'; g.save(); g.translate(mx, my); g.rotate(-0.55); g.fillRect(-220, -60, 440, 26); g.fillRect(-220, 0, 440, 8); g.restore(); g.restore();
  g.strokeStyle = C.goldLine; g.lineWidth = 2.5; g.stroke(card);
  g.strokeStyle = 'rgba(107,76,18,0.55)'; g.lineWidth = 1.5; g.beginPath(); g.roundRect(cx0 + 9, cy0 + 9, cw - 18, ch - 18, 10); g.stroke();
  foilStar(mx, my, 62, true); txt('★5', mx, cy0 + ch - 30, `700 34px ${MONO}`, '#4A3207', 'center');
  sparkle(cx0 - 6, cy0 + 40, 22); sparkle(cx0 + cw + 10, cy0 + 150, 17); sparkle(cx0 + cw - 8, cy0 - 8, 13); sparkle(cx0 + 22, cy0 + ch + 6, 11);
  txt('最高レア', sx + sw / 2, cy0 + ch + 56, `700 30px ${NSJ}`, '#5B3A06', 'center');
  // nút 回す
  txt('160 × 1', sx + sw / 2, sy + 508, `500 28px ${MONO}`, '#3A3550', 'center');
  const bw = sw - 70, bx = sx + 35, by = sy + 530, btn = P(); btn.roundRect(bx, by, bw, 84, 42);
