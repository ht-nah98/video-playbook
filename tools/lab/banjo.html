<script type="module">
// DNA tóm tắt — "盤上 · Banjō" (ja/2048). Bàn thử, KHÔNG phải code video. Chụp: node engine/render/shoot.js stills --page tools/lab/banjo.html --dur 2 --t 0.5,1.5 --outdir out/_lab/banjo
// Ý: 2048 là một ván cờ một người trên bàn 4×4 — nên bàn LÀ một 盤 gỗ 榧 dày như bàn 将棋/碁 thật, đặt trên chiếu 畳 tối, nắng xiên trên-trái; ô số LÀ quân 駒 gỗ 柘植 hình ngũ giác,
//   số khắc điền mực (彫り埋め). Người Nhật nhận ra tức thì (将棋 trên TV, 盤 榧 là vật quý), và chất liệu nói đúng ý bài: kịch bản so 2048 với 将棋AI, đối thủ là 運 chứ không phải kỳ thủ.
//   Cùng nhà với intro 漆と金 (quân lớn hoá sơn mài rồi vàng lá) nhưng KHÁC bài π: ấm, gỗ, ban ngày trong phòng chiếu — không trời chàm, không vành đồng.
// Vật xuyên suốt: BÀN 榧 4×4 (đường kẻ 墨 nổi 太刀盛り, 星 ở giao điểm giữa) + 駒. 17 bậc đọc bằng CHẤT LIỆU và ĐỘ DÀY: 2→128 柘植 nhạt dần sẫm (黒柿 ở 128) · 256/512 溜塗 · 1024 黒漆
//   · 2048→65536 金箔 ấm dần, chữ 墨 · 131072 黒漆 chữ 金箔. Quân cao dần 5→16 px. Bàn mini (cây trò chơi, điện thoại) là cùng bàn đó thu nhỏ. 駒台 bên bàn = chỗ của quân chưa có.
// Màu: 畳 #2A2619→#15130D · 榧 #DDB062 (vân #B98A42, mặt cạnh #8E6229) · 墨 #17110C · 柘植 #F1DDA8→#8A5F2E · 溜 #5A2B19 · 黒漆 #15100D · 金 #E4C977→#C08A34 · 和紙 #ECE3CF (棋譜 / 短冊)
//   · 胡粉 #F2EBDD chữ trên nền tối · 朱 #C53A20 (chữ #A42C16) CHỈ đáp án/khoảnh khắc chốt (= 131072, 期待値) · 浅葱 #3AA5B5 (chữ #156A78) = MAY RỦI (đồng xu 寛永通宝 gỉ xanh, nút 運, ô vừa rơi).
// Chữ: Shippori Mincho Bold (テロップ, số trên quân — số khắc kiểu 彫り駒) · Noto Sans JP (mũ ¹⁷, mũi tên, nhãn phụ) · Cormorant Garamond LN (số thập phân nhỏ nếu cần).
// Tiếng (~1/3 s): quân trượt = 駒音 "pachi" (snap/tick gỗ — mới: 駒を打つ音) · gộp = chip+snap, cao dần theo bậc; bậc 漆 thêm suzu nhẹ, bậc 金 shimmer · ô mới rơi = coin (浅葱) · 運 = coin búng / xúc xắc
//   (mới: サイコロ) · テロップ = hyoshigi (hồi), pen (nhãn), hanko (朱 đáp án) · bậc thang dựng = soroban · 131072 = taiko (hiếm, ≤3 cả bài) · page = lật 棋譜 · error = 詰み/thua.
// Các phần khác: Cirulli/Threes! = ba bàn gỗ nhỏ trên chiếu, bàn Threes quân 1·2·3 · 保存則 = cân đĩa đồng: hai quân 2 ⇄ một quân 4 thăng bằng; 質量保存 = bình thí nghiệm như thẻ đồ chơi
//   · 930/1018 lượt = chuỗi 棋譜 ghi tay "第1018手" · bậc thang = 17 quân xếp chồng như tháp, 2¹⁷ khắc trên 駒台 · rắn + gộp dây chuyền = mũi 金 chạy dọc rắn, quân lật vàng từng chiếc · ↓←→↑ = bốn
//   quân mũi tên trên 駒台 · 1.2垓 = 棋譜 kín trang, số 18¹⁶ · 将棋AI vs 運 = bàn 将棋 9×9 bên cạnh bàn 4×4, đối thủ là đồng xu 浅葱 · Michie = chân dung IMAGINED trên tờ 和紙 · 71.5%/96% = thanh
//   khắc trên 駒台 · TD学習 afterstate = bàn "sau khi vuốt" với ô trống sáng 浅葱 chưa rơi · Szubert & Jaśkowski, 松崎 = 棋譜 tên + năm · Đài Loan 1/10000 = 10000 quân nhỏ, một quân 金 · bảng tra 86%/8.4%
//   = sổ 定跡 · ô thứ 16 = ô 4 = quân 4 浅葱 rơi vào lỗ cuối, 1/10 · まとめ = 投了図: bàn cuối, ba câu trả lời trên ba 短冊.
import { toCanvas } from '../../engine/mascot.js';
import { hash } from '../../engine/lib.js';

const W = 1920, H = 1080, g = document.getElementById('cv').getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const MIN = '"Shippori Mincho"', NOTO = '"Noto Sans JP"', CG = '"Cormorant Garamond"';
const C = { sumi: '#17110C', gofun: '#F2EBDD', gofunDim: '#CFC3A8', shu: '#C53A20', shuInk: '#A42C16', asagi: '#3AA5B5', asagiInk: '#156A78', asagiLt: '#7FD0DB',
  gold: '#D9B45A', goldLt: '#F3DE9C', goldDk: '#8A6624', paper: '#ECE3CF', grey: '#5E5242', kaya: '#DDB062' };
const IM = {}, SH = {}; let TATAMI, KAYA, BG, PHONE, ready = false;

const ev = s => Function(`return (${s})`)();
const must = (s, v) => { const r = ev(s); if (r !== v) throw new Error(`sai: ${s} = ${r} ≠ ${v}`); return v; };
const r1 = x => Math.round(x * 10) / 10;
// độ tương phản WCAG — ĐO bằng số, ném lỗi nếu chữ chìm
const lum = hex => { const v = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(c => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; };
const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
const needC = (a, b, k, what) => { const c = contrast(a, b); if (c < k) throw new Error(`tương phản ${what} ${c.toFixed(2)} < ${k}`); return c; };
const comma = n => { const [i, d] = String(n).split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (d ? '.' + d : ''); };

function vnoise(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, s = t => t * t * (3 - 2 * t);
  const h = (i, j) => hash(i * 12.9898 + j * 78.233 + seed * 3.17);
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1), u = s(xf), v = s(yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// ---- luật 2048 thật: trượt + gộp một lần mỗi ô mỗi lượt ----
const slideLine = a => { const v = a.filter(x => x), o = []; for (let i = 0; i < v.length; i++) { if (v[i] === v[i + 1]) { o.push(2 * v[i]); i++; } else o.push(v[i]); } while (o.length < 4) o.push(0); return o; };
const MOVES = { U: '↑', R: '→', L: '←', D: '↓' };
function move(b, d) {
  const r = b.map(x => x.slice()), at = (i, k) => d === 'L' ? [i, k] : d === 'R' ? [i, 3 - k] : d === 'U' ? [k, i] : [3 - k, i];
  for (let i = 0; i < 4; i++) { const l = slideLine([0, 1, 2, 3].map(k => { const [y, x] = at(i, k); return b[y][x]; })); l.forEach((v, k) => { const [y, x] = at(i, k); r[y][x] = v; }); }
  return r;
}
const same = (a, b) => a.flat().join() === b.flat().join();
const total = b => b.flat().reduce((s, v) => s + v, 0);
// 評価値 (như AI 将棋): tổng quân × trọng số rắn, góc trên-trái nặng nhất
const WS = [[16, 15, 14, 13], [9, 10, 11, 12], [8, 7, 6, 5], [1, 2, 3, 4]];
const evalB = b => b.flat().reduce((s, v, i) => s + v * WS[i >> 2][i & 3], 0);
const spawns = a => { const out = []; a.flat().forEach((v, i) => { if (!v) for (const [t, p] of [[2, 0.9], [4, 0.1]]) { const c = a.map(x => x.slice()); c[i >> 2][i & 3] = t; out.push({ cell: i, t, p, c }); } }); return out; };
const expect = a => { const s = spawns(a), n = s.length / 2; return s.reduce((acc, o) => acc + o.p / n * evalB(o.c), 0); };

// ---- vật liệu nạp sẵn ----
function tatami() {                                     // chiếu 畳 tối: sợi い草 ngang, sợi gai dọc, nắng xiên trên-trái
  const c = mk(), x = c.getContext('2d'), d = x.createImageData(W, H);
  for (let py = 0; py < H; py++) {
    const row = Math.floor(py / 4.2), rv = hash(row * 1.37) - 0.5, inRow = (py / 4.2) % 1;
    for (let px = 0; px < W; px++) {
      const k = (py * W + px) * 4;
      const warp = (px % 46) < 1 ? -3 : 0;                                                    // sợi dọc
      const bump = Math.sin(inRow * Math.PI) * 9 - 5 + (vnoise(px / 9, row * 1.3, 6) - 0.5) * 6;                                          // từng cọng tròn
      const fib = (vnoise(px / 30, row * 0.7, 3) - 0.5) * 9 + (hash(px * 0.37 + row * 91.1) - 0.5) * 5;
      const light = 26 - 44 * Math.min(1.25, Math.hypot(px + 200, py + 260) / 2300);
      const vig = -26 * Math.max(0, Math.hypot((px - W / 2) / W, (py - H / 2) / H) - 0.32) * 2.4;
      const n = rv * 7 + warp + bump + fib + light + vig;
      d.data[k] = 46 + n; d.data[k + 1] = 41 + n * 0.95; d.data[k + 2] = 26 + n * 0.7; d.data[k + 3] = 255;
    }
  }
  x.putImageData(d, 0, 0); return c;
}
function kaya(sz = 900) {                               // 榧 柾目: vân thẳng mịn dọc, vàng óng
  const c = mk(sz, sz), x = c.getContext('2d'), d = x.createImageData(sz, sz), lo = [226, 184, 106], hi = [186, 136, 64];
  for (let py = 0; py < sz; py++) for (let px = 0; px < sz; px++) {
    const k = (py * sz + px) * 4;
    const ph = (px + 14 * vnoise(px / 300, py / 500, 2) + 4 * vnoise(px / 60, py / 220, 5)) / (5.5 + 3 * vnoise(px / 700, 0, 8));
    const f = ph - Math.floor(ph), band = vnoise(Math.floor(ph) * 1.9, 0.3, 11);
    const late = Math.max(0, Math.sin(f * Math.PI) ** 6) * (0.25 + 0.7 * band);
    const fib = (vnoise(px / 1.4, py / 40, 13) - 0.5) * 8 + (hash(py * sz + px) - 0.5) * 4;
    const sheen = 10 * vnoise(px / 200, py / 900, 17);
    for (let ch = 0; ch < 3; ch++) d.data[k + ch] = lo[ch] + (hi[ch] - lo[ch]) * late + (fib + sheen) * [1, 0.9, 0.7][ch];
    d.data[k + 3] = 255;
  }
  x.putImageData(d, 0, 0); return c;
}

// ---- 駒: 17 bậc ----
const rank = v => Math.round(Math.log2(v));
const WOODS = ['#F1DDA8', '#EAD093', '#E1C07B', '#D5AC63', '#C6964F', '#AE7C3E', '#8A5F2E'];          // 2 … 128 柘植 → 黒柿
const GOLDS = ['#E6C455', '#DFB84A', '#D8AC40', '#D09E37', '#C78F30', '#BC7F29'];                   // 2048 … 65536 金箔 ấm dần
function mat(v) {
  const r = rank(v);
  if (r <= 7) return { kind: 'wood', face: WOODS[r - 1], num: null };
  if (r <= 9) return { kind: 'lac', face: r === 8 ? '#6A341D' : '#4E2414', num: C.goldLt };       // 溜塗
  if (r === 10) return { kind: 'lac', face: '#1C1511', num: C.goldLt };                           // 黒漆
  if (r <= 16) return { kind: 'gold', face: GOLDS[r - 11], num: C.sumi };
  return { kind: 'lac', face: '#120D0B', num: C.goldLt, rim: true };                                // 131072 黒漆 + 金
}
const shade = (hex, f) => '#' + [1, 3, 5].map(i => Math.max(0, Math.min(255, Math.round(parseInt(hex.slice(i, i + 2), 16) * f))).toString(16).padStart(2, '0')).join('');
function numCol(m) { if (m.num) return m.num; return contrast(m.face, C.sumi) >= 4.5 ? C.sumi : C.gofun; }
function komaPath(cx, cy, w, h) {
  const p = new Path2D(), sh = h * 0.24;
  p.moveTo(cx, cy - h / 2);
  p.lineTo(cx + w * 0.40, cy - h / 2 + sh); p.lineTo(cx + w / 2, cy + h / 2); p.lineTo(cx - w / 2, cy + h / 2); p.lineTo(cx - w * 0.40, cy - h / 2 + sh); p.closePath();
  return p;
}
// một quân: bóng đổ, thân dày (cao theo bậc), mặt chất liệu, số khắc
function koma(cx, cy, s, v, { ghost = false, seed = 0, label = null, minPx = 30 } = {}) {
  const m = mat(v), r = rank(v), w = s * 0.86, h = s * 0.9, th = (ghost ? 14 : 3.5 + r * 0.72) * s / 142 * 1.6;
  const top = komaPath(cx, cy - th * 0.5, w, h);
  g.save();
  if (ghost) g.globalAlpha = 0.5;
  if (!ghost) { g.save(); g.fillStyle = 'rgba(20,10,2,0.35)'; g.translate(th * 0.55 + 3, th * 0.9 + 4); g.fill(komaPath(cx, cy - th * 0.5, w * 1.02, h * 1.02)); g.restore();
  const body = m.kind === 'wood' ? shade(m.face, 0.55) : m.kind === 'gold' ? '#22160E' : shade(m.face, 0.5);
  for (let k = th; k > 0; k -= 1) { g.save(); g.translate(k * 0.25, k); g.fillStyle = body; g.fill(top); g.restore(); } }
  if (m.kind === 'gold') { g.save(); g.translate(th * 0.25, th); g.strokeStyle = 'rgba(217,180,90,0.7)'; g.lineWidth = 1; g.stroke(top); g.restore(); }   // thân
  g.save(); if (m.kind === 'gold') { const gf = g.createLinearGradient(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2); gf.addColorStop(0, '#FFF3C4'); gf.addColorStop(0.2, shade(m.face, 1.1)); gf.addColorStop(0.46, shade(m.face, 0.72)); gf.addColorStop(0.62, shade(m.face, 1.05)); gf.addColorStop(0.86, shade(m.face, 0.6)); gf.addColorStop(1, shade(m.face, 0.48)); g.fillStyle = gf; } else g.fillStyle = m.face;
  g.fill(top); g.clip(top);
  if (m.kind === 'wood') {                                                                     // thớ 柘植 rất mịn
    for (let i = 0; i < 18; i++) { const gx = cx - w / 2 + hash(seed * 7.1 + i) * w, a = 0.05 + hash(seed + i * 3.3) * 0.08;
      g.strokeStyle = `rgba(90,52,18,${a})`; g.lineWidth = 0.8 + hash(i + seed) * 1.2; g.beginPath(); g.moveTo(gx, cy - h); g.bezierCurveTo(gx + 6, cy - h / 3, gx - 5, cy + h / 3, gx + 3, cy + h); g.stroke(); }
  } else if (m.kind === 'gold') {                                                             // tờ 金箔 vuông, mép nối
    const q = s * 0.3;
    for (let i = -2; i < 4; i++) for (let j = -2; j < 4; j++) { const hv = hash(i * 13.1 + j * 7.7 + seed);
      g.fillStyle = hv > 0.5 ? `rgba(255,246,206,${(hv - 0.5) * 0.4})` : `rgba(110,72,16,${(0.5 - hv) * 0.22})`; g.fillRect(cx - w / 2 + i * q, cy - h / 2 + j * q, q, q);
      g.strokeStyle = 'rgba(120,82,24,0.28)'; g.lineWidth = 0.8; g.strokeRect(cx - w / 2 + i * q, cy - h / 2 + j * q, q, q); }
  }
  const lt = g.createLinearGradient(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2);                // nắng xiên + bóng sơn
  if (m.kind === 'wood') { lt.addColorStop(0, 'rgba(255,250,232,0.22)'); lt.addColorStop(1, 'rgba(60,30,8,0.16)'); }
  else { lt.addColorStop(0, 'rgba(255,248,226,0.30)'); lt.addColorStop(0.32, 'rgba(255,248,226,0.04)'); lt.addColorStop(0.36, 'rgba(255,248,226,0.10)'); lt.addColorStop(0.42, 'rgba(255,248,226,0)'); lt.addColorStop(1, 'rgba(0,0,0,0.22)'); }
  g.fillStyle = lt; g.fillRect(cx - w, cy - h, 2 * w, 2 * h); g.restore();
  g.lineJoin = 'round'; g.strokeStyle = 'rgba(255,244,214,0.45)'; g.lineWidth = 1.2; g.stroke(top);                                     // mép vát sáng
  if (m.rim) { g.strokeStyle = C.gold; g.lineWidth = s * 0.03; g.stroke(komaPath(cx, cy - th * 0.5, w * 0.84, h * 0.86)); }
  // số khắc: cỡ vừa thân quân, KHÔNG dưới minPx
  const txt = label ?? String(v), maxW = w * (txt.length >= 5 ? 0.84 : 0.74);
  let fs = Math.max(minPx, s * (txt.length <= 2 ? 0.46 : txt.length === 3 ? 0.42 : 0.38)); g.font = `700 ${fs}px ${MIN}`;
  let sx = 1, mw = g.measureText(txt).width;
  if (mw > maxW) { fs = Math.max(minPx, fs * maxW / mw); g.font = `700 ${fs}px ${MIN}`; mw = g.measureText(txt).width; if (mw > maxW) sx = maxW / mw; }
  if (fs < minPx - 0.01) throw new Error(`số ${txt} nhỏ hơn ${minPx}px`);
  const ty = cy - th * 0.5 + h * 0.13, col = numCol(m), font = g.font;
  g.save(); g.translate(cx, ty); g.scale(sx, 1); g.textAlign = 'center'; g.textBaseline = 'middle';
  if (!ghost && m.kind !== 'lac') { g.fillStyle = 'rgba(255,246,220,0.5)'; g.fillText(txt, 0.9, 1.2); }                                // mép rãnh khắc bắt sáng
  g.fillStyle = col; g.fillText(txt, 0, 0); g.restore();
  g.restore();
  return { fs, col, face: m.face, th, ty, sx, font };
}

// ---- 盤 榧 ----
function ban(x, y, S, cells, { m = S * 0.045, thick = S * 0.08, legs = true, hl = null, chev = null, seed = 1 } = {}) {
  const cs = (S - 2 * m) / 4, ox = x + m, oy = y + m;
  g.save(); g.shadowColor = 'rgba(8,5,2,0.62)'; g.shadowBlur = S * 0.07; g.shadowOffsetX = S * 0.03; g.shadowOffsetY = S * 0.05;
  g.fillStyle = '#7A5424'; g.fillRect(x, y, S, S + thick); g.restore();
  if (legs) { g.fillStyle = '#3A2410'; const lw = S * 0.14, lh = thick * 0.6; for (const lx of [x + S * 0.09, x + S * 0.77]) g.fillRect(lx, y + S + thick - 2, lw, lh); }
  const side = g.createLinearGradient(0, y + S, 0, y + S + thick); side.addColorStop(0, '#B07C35'); side.addColorStop(0.15, '#94652A'); side.addColorStop(1, '#5E3E17');
  g.fillStyle = side; g.fillRect(x, y + S, S, thick);
  g.fillStyle = 'rgba(70,44,14,0.35)'; for (let i = 0; i < 9; i++) g.fillRect(x, y + S + 3 + i * thick / 9, S, 0.8);       // vân đầu ván
  g.drawImage(KAYA, (seed * 97) % 120, (seed * 61) % 120, 780, 780, x, y, S, S);
  const lt = g.createLinearGradient(x, y, x + S, y + S); lt.addColorStop(0, 'rgba(255,244,214,0.20)'); lt.addColorStop(0.6, 'rgba(255,244,214,0)'); lt.addColorStop(1, 'rgba(60,32,6,0.18)');
  g.fillStyle = lt; g.fillRect(x, y, S, S);
  g.strokeStyle = 'rgba(255,240,200,0.55)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y + S); g.lineTo(x, y); g.lineTo(x + S, y); g.stroke();   // mép trên-trái bắt nắng
  // đường kẻ 墨 nổi (太刀盛り): bóng sáng lệch dưới-phải + nét mực
  const lw = Math.max(1.4, S * 0.0042);
