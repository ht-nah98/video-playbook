<canvas id=cv width=1920 height=1080></canvas>
<script type="module">
// DNA tóm tắt — "Gameshow" (intuition). Bàn thử, KHÔNG phải code video.
//   node engine/render/shoot.js stills --page tools/lab/gameshow.html --dur 2 --t 0.5,1.5 --outdir out/_lab/gameshow
// Ý trung tâm: trực giác là ĐỘNG CƠ, logic là PHANH → cả video là một trường quay game show thập niên 70: trực giác là thí sinh
//   giơ thẻ trả lời viết tay, logic là bảng lật Solari + bóng đèn tính ra đáp án. Hồi 2 dùng chính bảng lật: ô 9 lật mãi.
// Vật xuyên suốt: THẺ TRẢ LỜI BẬT RA — tấm bảng trắng trên que gỗ, chữ bút dạ hồng sen vẽ bằng nét path (đầu tròn, lệch theo
//   hash, chỗ nét chồng đậm hơn như mực dạ). Monty Hall: dấu X đỏ còi sai (viền đỏ thẫm, lõi đỏ, vệt sáng). 0,999…: KHÔNG gạch —
//   dán nhãn in kiểu nhãn hồ sơ (giấy kem, dải hổ phách = logic dán nhãn) "A DIFFERENT NUMBER SYSTEM".
// Màu (đo tại chỗ, WCAG): phông #1A0F10→#2B1618 · hổ phách #FFC04A = logic/đáp án tính (chữ bảng lật trên ô #1E1C1D 10.4:1,
//   bóng đèn, bảng đèn 12.0:1) · hồng sen #B80D66 = trực giác (bút dạ trên thẻ #F2EBDD 5.4:1, góc tối 4.8:1) · đỏ tín hiệu
//   #E3262B = SAI (chỉ dấu X; viền đỏ thẫm #6A0A0E vì đỏ/thẻ chỉ 3.9:1) · xanh ngọc #2EC4B6 = xác suất dồn về (khối 1/3, 2/3,
//   diện tích ∝ xác suất; chữ #06231F trên khối 7.6:1, đáy khối 5.7:1) · cửa xanh chàm #34408A khung kem #EADCC0 · chữ ngà
//   #F3E6CF trên phông 15.2:1, mờ #C9B79E 9.6:1, mực nhãn #2A1A14 trên giấy 13.6:1.
// Chữ: Archivo 800 hẹp (bảng lật, số trên cửa, đèn) · IBM Plex Mono (nhãn in, tiêu đề cột) · bút dạ = nét path tự vẽ.
// Tiếng: flap (lật bảng — MỚI, tràng lách cách) · buzzer (còi sai — MỚI) · door (cửa mở — MỚI) · goat (dê kêu — MỚI, 1 lần) ·
//   shimmer (bóng đèn chạy) · whoosh (khối 2/3 chảy) · pen (viết thẻ) · correct (đáp án sáng đèn) · chip (dán nhãn).
// Phần khác: hộp Bertrand = 3 lá bài bìa cứng trên bục, mặt đỏ/trắng, đếm 3 MẶT đỏ bằng bóng đèn · lớp học phim 21 = bảng đen
//   vẽ lại thành bảng lật trong giảng đường, chữ "decides" sáng đèn · 100 cửa = dãy cửa nhỏ chạy xa, 98 cửa mở lộ dê · 1.000 ván =
//   hai bảng điểm lật song song STAY/SWITCH đếm lên ≈ 1/3, 2/3 · vos Savant = bao thư rơi đầy sàn, bảng lật đếm 10,000 ·
//   luật không ai nói = thẻ luật in dưới cửa, dòng "MUST" bị bỏ trống · 1/3 × 3 và 10x − x = bảng lật ghi chép, nhãn "SHORTCUT" ·
//   không số nào chen giữa = hai ô bảng lật sát nhau, không có ô trống · Newton/Leibniz/Robinson = khách mời với bảng tên
//   bóng đèn · động cơ/phanh = thẻ hồng (động cơ) + bảng hổ phách (phanh) · Poincaré = câu trích trên bảng lật dài ·
//   tóm tắt = ba cửa làm ba câu hỏi, mở từng cửa · lần sau = hai câu hỏi trên hai thẻ, bóng đèn tắt dần.
import { toCanvas } from '../../engine/mascot.js';
import { hash } from '../../engine/lib.js';

const W = 1920, H = 1080, main = document.getElementById('cv').getContext('2d');
let g = main;
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const C = { bg: '#1A0F10', amber: '#FFC04A', amberD: '#C27A10', pink: '#B80D66', red: '#E3262B', redD: '#6A0A0E', teal: '#2EC4B6',
  tealInk: '#06231F', door: '#34408A', doorD: '#232C66', frame: '#EADCC0', card: '#F2EBDD', ink: '#F3E6CF', dim: '#C9B79E',
  cell: '#1E1C1D', label: '#2A1A14' };
const ARC = '"Archivo"', MONO = '"IBM Plex Mono"';
const IM = {}; let BACK, ready = false, ONE_BULBS = [];
const ev = s => Function(`return (${s})`)();
const must = (s, v) => { if (ev(s) !== v) throw new Error(`sai: ${s} ≠ ${v}`); return v; };
const frac = (n, d) => `${n}/${d}`;

// ───────── chữ
function text(s, x, y, size, color, o = {}) {
  g.save(); g.font = `${o.w || 800} ${size}px ${o.f || ARC}`; g.fontStretch = o.st || (o.f ? 'normal' : 'condensed');
  g.fillStyle = color; g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'alphabetic'; g.letterSpacing = (o.ls || 0) + 'px';
  if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = o.blur || 18; }
  g.fillText(s, x, y); const w = g.measureText(s).width; g.restore(); return w;
}
const label = (s, x, y, color = C.dim, align = 'left', size = 20) => text(s.toUpperCase(), x, y, size, color, { f: MONO, w: 500, align, ls: 2.5 });
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

// ───────── phông trường quay: màn nhung xếp nếp, tia nắng thập niên 70 rất mờ, vệt đèn sân khấu (vẽ một lần lúc nạp)
function backdrop(F, spots) {
  const c = mk(), x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 0, F); gr.addColorStop(0, '#140B0C'); gr.addColorStop(1, '#2B1618'); x.fillStyle = gr; x.fillRect(0, 0, W, F);
  for (let px = 0; px < W; px += 2) {                         // nếp màn: độ sáng theo sin chồng hai tần số + nhiễu hash
    const v = 0.5 + 0.32 * Math.sin(px / 23 + Math.sin(px / 71) * 1.6) + 0.12 * Math.sin(px / 9.3) + (hash(px * 0.37) - 0.5) * 0.08;
    x.fillStyle = v > 0.5 ? `rgba(120,50,45,${(v - 0.5) * 0.16})` : `rgba(0,0,0,${(0.5 - v) * 0.5})`; x.fillRect(px, 0, 2, F);
  }
  x.save(); x.translate(W * 0.36, F * 0.42);                  // tia sunburst
  for (let k = 0; k < 28; k++) { const a = k / 28 * Math.PI * 2; x.fillStyle = k % 2 ? 'rgba(255,150,70,0.035)' : 'rgba(0,0,0,0)';
    x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, 1400, a, a + Math.PI * 2 / 28); x.fill(); }
  x.restore();
  for (const [sx, sy, r, a] of spots) { const rg = x.createRadialGradient(sx, sy, 0, sx, sy, r);
    rg.addColorStop(0, `rgba(255,170,100,${a})`); rg.addColorStop(1, 'rgba(255,170,100,0)'); x.fillStyle = rg; x.fillRect(0, 0, W, F); }
  // sàn bóng: đen ấm, mép sân khấu viền sáng, vạch phối cảnh mờ hội tụ
  const fg = x.createLinearGradient(0, F, 0, H); fg.addColorStop(0, '#1D1011'); fg.addColorStop(1, '#0B0607'); x.fillStyle = fg; x.fillRect(0, F, W, H - F);
  x.strokeStyle = 'rgba(255,200,150,0.05)'; x.lineWidth = 1.5;
  for (let k = -12; k <= 12; k++) { x.beginPath(); x.moveTo(W * 0.4 + k * 60, F); x.lineTo(W * 0.4 + k * 260, H); x.stroke(); }
  x.fillStyle = 'rgba(255,205,160,0.22)'; x.fillRect(0, F, W, 2); x.fillStyle = 'rgba(0,0,0,0.5)'; x.fillRect(0, F + 2, W, 3);
  const vg = x.createRadialGradient(W / 2, H * 0.45, H * 0.45, W / 2, H * 0.5, H * 1.05);   // vignette
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)'); x.fillStyle = vg; x.fillRect(0, 0, W, H);
  return c;
}

// ───────── bóng đèn tròn: tắt = thuỷ tinh hổ phách tối; sáng = lõi trắng ấm → hổ phách, quầng bằng shadowBlur
function bulb(x, y, r, on) {
  g.save();
  if (on) { g.shadowColor = 'rgba(255,180,60,0.9)'; g.shadowBlur = r * 2.6;
    const rg = g.createRadialGradient(x - r * 0.25, y - r * 0.25, 0, x, y, r); rg.addColorStop(0, '#FFF7DC'); rg.addColorStop(0.45, '#FFCF6A');
    rg.addColorStop(1, '#D98A14'); g.fillStyle = rg; }
  else { const rg = g.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r); rg.addColorStop(0, '#6E5232'); rg.addColorStop(1, '#2E1F12'); g.fillStyle = rg; }
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.restore();
  g.fillStyle = on ? 'rgba(255,255,255,0.85)' : 'rgba(255,230,190,0.25)'; g.beginPath(); g.arc(x - r * 0.35, y - r * 0.35, r * 0.22, 0, Math.PI * 2); g.fill();
}
function marquee(x, y, w, h, t, o = {}) {                      // khung sơn mài đỏ thẫm + hàng bóng đèn chạy quanh viền
  const pad = o.pad || 22, r = o.r || 7;
  g.save(); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 30; g.shadowOffsetY = 12;
  const fr = g.createLinearGradient(0, y, 0, y + h); fr.addColorStop(0, '#5A1A1E'); fr.addColorStop(1, '#3A0F12'); g.fillStyle = fr; rr(x, y, w, h, 14); g.fill(); g.restore();
  g.strokeStyle = 'rgba(255,210,170,0.25)'; g.lineWidth = 2; rr(x + 3, y + 3, w - 6, h - 6, 12); g.stroke();
  g.fillStyle = '#0E0B0B'; rr(x + pad * 1.6, y + pad * 1.6, w - pad * 3.2, h - pad * 3.2, 6); g.fill();
  const per = 2 * (w + h - 4 * pad), n = Math.round(per / (o.step || 34)), step = per / n, ph = Math.floor(t * 8);
  for (let i = 0; i < n; i++) {
    let d = i * step, bx, by; const iw = w - 2 * pad, ih = h - 2 * pad;
    if (d < iw) { bx = x + pad + d; by = y + pad; } else if ((d -= iw) < ih) { bx = x + w - pad; by = y + pad + d; }
    else if ((d -= ih) < iw) { bx = x + w - pad - d; by = y + h - pad; } else { d -= iw; bx = x + pad; by = y + h - pad - d; }
    bulb(bx, by, r, (i + ph) % 3 !== 0);
  }
}

// ───────── bảng lật Solari: ô = tấm trên + tấm dưới, khe giữa, chốt bản lề; chữ in hổ phách
const CELL = {};
function cellCanvas(ch, w, h, color = C.amber) {
  const key = `${ch}|${w}|${h}|${color}`; if (CELL[key]) return CELL[key];
  const c = mk(w, h), x = c.getContext('2d');
  const t = x.createLinearGradient(0, 0, 0, h / 2); t.addColorStop(0, '#2C292A'); t.addColorStop(1, '#211F20');
  x.fillStyle = t; x.beginPath(); x.roundRect(0, 0, w, h / 2 + 1, [5, 5, 1, 1]); x.fill();
  const b = x.createLinearGradient(0, h / 2, 0, h); b.addColorStop(0, '#1A1819'); b.addColorStop(1, '#121011');
  x.fillStyle = b; x.beginPath(); x.roundRect(0, h / 2, w, h / 2, [1, 1, 5, 5]); x.fill();
  if (ch !== ' ') {
    x.font = `800 ${Math.round(h * 0.74)}px ${ARC}`; x.fontStretch = 'condensed'; x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    x.fillText(ch, w / 2, h / 2 + h * 0.265);
    x.fillStyle = 'rgba(0,0,0,0.14)'; x.fillRect(0, h / 2, w, h / 2);             // tấm dưới hơi khuất sáng
  }
  x.fillStyle = '#040303'; x.fillRect(0, h / 2 - 1.5, w, 3);                      // khe giữa
  x.fillStyle = 'rgba(255,255,255,0.07)'; x.fillRect(0, h / 2 + 1.5, w, 1);
  x.fillStyle = 'rgba(255,255,255,0.08)'; x.fillRect(2, 1, w - 4, 1);
  x.fillStyle = '#5A5452'; x.fillRect(-1, h / 2 - 4, 3, 8); x.fillRect(w - 2, h / 2 - 4, 3, 8);   // chốt bản lề
  return (CELL[key] = c);
}
function flapCell(x, y, w, h, ch, color) { g.drawImage(cellCanvas(ch, w, h, color), x, y); }
// ô đang lật: tấm trên đã là ký tự mới, tấm dưới vẫn ký tự cũ, lá lật (nửa trên ký tự cũ) đang gập xuống quanh bản lề,
// co theo cos(θ), mép tự do phình ra (gần người xem), tối dần theo góc; thêm vệt chuyển động mờ hai bên
function flipCell(x, y, w, h, oldC, newC, th, color) {
  const A = cellCanvas(oldC, w, h, color), B = cellCanvas(newC, w, h, color), m = h / 2;
  g.drawImage(B, 0, 0, w, m, x, y, w, m);
  g.drawImage(A, 0, m, w, m, x, y + m, w, m);
  const N = 24;
  if (th < Math.PI / 2) {                                     // nửa đầu: lá = nửa trên ký tự cũ, che dần tấm trên
    const k = Math.cos(th), sp = Math.sin(th) * 0.3;
    for (let i = 0; i < N; i++) { const u0 = i / N, hh = m / N, ww = w * (1 + sp * (1 - u0));
      g.drawImage(A, 0, u0 * m, w, hh + 0.6, x + (w - ww) / 2, y + m - (1 - u0) * m * k, ww, hh * k + 0.8); }
    const top = y + m - m * k, gw = w * (1 + sp);
    g.fillStyle = `rgba(0,0,0,${0.15 + 0.45 * (1 - k)})`;
    g.beginPath(); g.moveTo(x + (w - gw) / 2, top); g.lineTo(x + (w + gw) / 2, top); g.lineTo(x + w, y + m); g.lineTo(x, y + m); g.fill();
    g.fillStyle = 'rgba(255,220,170,0.35)'; g.fillRect(x + (w - gw) / 2, top - 1, gw, 2);
  } else {                                                    // nửa sau: lá = nửa dưới ký tự mới, rơi xuống che tấm dưới cũ
    const k = -Math.cos(th), sp = Math.sin(th) * 0.3, bot = y + m + m * k, gw = w * (1 + sp);
    g.save(); g.shadowColor = 'rgba(0,0,0,0.7)'; g.shadowBlur = 12; g.shadowOffsetY = 6;
    g.fillStyle = '#121011'; g.beginPath(); g.moveTo(x, y + m); g.lineTo(x + w, y + m); g.lineTo(x + (w + gw) / 2, bot); g.lineTo(x + (w - gw) / 2, bot); g.fill(); g.restore();
    for (let i = 0; i < N; i++) { const u0 = i / N, hh = m / N, ww = w * (1 + sp * u0);
      g.drawImage(B, 0, m + u0 * m, w, hh + 0.6, x + (w - ww) / 2, y + m + u0 * m * k, ww, hh * k + 0.8); }
    g.fillStyle = `rgba(0,0,0,${0.1 + 0.4 * (1 - k)})`;
    g.beginPath(); g.moveTo(x, y + m); g.lineTo(x + w, y + m); g.lineTo(x + (w + gw) / 2, bot); g.lineTo(x + (w - gw) / 2, bot); g.fill();
    g.fillStyle = 'rgba(255,220,170,0.4)'; g.fillRect(x + (w - gw) / 2, bot - 1, gw, 2);           // mép lá bắt sáng
    for (let j = 1; j <= 3; j++) { g.fillStyle = `rgba(255,192,74,${0.14 - j * 0.035})`; g.fillRect(x + (w - gw) / 2 - j * 2, bot + j * 5, gw + j * 4, 1.5); }  // vệt rơi
  }
  g.fillStyle = '#040303'; g.fillRect(x - 1, y + m - 1.5, w + 2, 3);
}
function flapRow(s, x, y, w, h, gap, color) { for (let i = 0; i < s.length; i++) { const cx = x + i * (w + gap), dot = s[i] === '·';
  flapCell(cx, y, w, h, dot ? ' ' : s[i], color); if (dot) bulb(cx + w / 2, y + h / 2, w * 0.17, true); } return x + s.length * (w + gap) - gap; }

// ───────── bút dạ: nét path, đầu tròn, điểm lệch theo hash; mỗi nét in hai lần (đậm + vệt sáng mảnh) như mực dạ thật
const ell = (cx, rx, n = 26, a0 = -1.9) => ['c', ...Array.from({ length: n + 3 }, (_, i) => { const a = a0 + i / n * Math.PI * 2; return [cx + rx * Math.cos(a), 0.5 + 0.49 * Math.sin(a)]; })];
const GLY = {
  '0': [0.62, [ell(0.31, 0.29)]],
  '5': [0.62, [[[0.55, 0.03], [0.14, 0.03], [0.09, 0.45]], ['c', [0.09, 0.45], [0.3, 0.37], [0.5, 0.42], [0.59, 0.63], [0.52, 0.87], [0.3, 0.98], [0.05, 0.9]]]],
  '/': [0.46, [[[0.44, 0.0], [0.02, 1.0]]]],
  'S': [0.6, [['c', [0.54, 0.13], [0.42, 0.02], [0.22, 0.02], [0.07, 0.13], [0.09, 0.32], [0.26, 0.45], [0.44, 0.55], [0.57, 0.71], [0.53, 0.89], [0.36, 0.99], [0.16, 0.97], [0.03, 0.86]]]],
  'T': [0.58, [[[0.0, 0.03], [0.58, 0.01]], [[0.29, 0.02], [0.3, 1.0]]]],
  'I': [0.16, [[[0.08, 0.0], [0.08, 1.0]]]],
  'L': [0.48, [[[0.06, 0.0], [0.06, 1.0], [0.46, 0.99]]]],
  'A': [0.6, [[[0.0, 1.0], [0.3, 0.0], [0.6, 1.0]], [[0.12, 0.64], [0.48, 0.63]]]],
  'E': [0.5, [[[0.48, 0.0], [0.06, 0.0], [0.06, 1.0], [0.48, 1.0]], [[0.06, 0.5], [0.4, 0.49]]]],
  'H': [0.58, [[[0.06, 0.0], [0.06, 1.0]], [[0.52, 0.0], [0.52, 1.0]], [[0.06, 0.5], [0.52, 0.5]]]],
  'O': [0.68, [ell(0.34, 0.32)]],
  'R': [0.58, [['c', [0.06, 1.0], [0.06, 0.0], [0.3, 0.0], [0.48, 0.07], [0.53, 0.24], [0.46, 0.42], [0.26, 0.5], [0.06, 0.5]], [[0.26, 0.5], [0.56, 1.0]]]],
  ' ': [0.34, []],
};
function strokePath(pts) {
  const smooth = pts[0] === 'c', P = smooth ? pts.slice(1) : pts;
  g.beginPath(); g.moveTo(P[0][0], P[0][1]);
  if (!smooth) for (let i = 1; i < P.length; i++) g.lineTo(P[i][0], P[i][1]);
  else { for (let i = 1; i < P.length - 1; i++) g.quadraticCurveTo(P[i][0], P[i][1], (P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2);
    g.lineTo(P[P.length - 1][0], P[P.length - 1][1]); }
  g.stroke();
}
function marker(s, x, y, h, color, seed = 1, track = 0.16) {      // y = đỉnh chữ; trả về bề rộng
  const lw = h * 0.15; let cx = x;
  for (let i = 0; i < s.length; i++) {
    const [gw, strokes] = GLY[s[i]] || GLY[' '], sz = h * (0.95 + hash(seed + i * 3.1) * 0.1), dy = (hash(seed + i * 7.7) - 0.5) * h * 0.06;
    const rot = (hash(seed + i * 5.3) - 0.5) * 0.08;
    strokes.forEach((st, k) => {
      const smooth = st[0] === 'c', P = (smooth ? st.slice(1) : st).map(([px, py], j) => {
