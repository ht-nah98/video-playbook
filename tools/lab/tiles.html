<!doctype html><meta charset="utf-8">
<title>Lab — tiles</title>
<style>
  @font-face{font-family:"Archivo";src:url("../../assets/fonts/Archivo[wdth,wght].ttf");font-weight:100 900;font-stretch:62% 125%;}
  @font-face{font-family:"IBM Plex Mono";src:url("../../assets/fonts/IBMPlexMono-Medium.ttf");font-weight:500;}
  @font-face{font-family:"Cormorant Garamond";src:url("../../assets/fonts/CormorantGaramond-Italic-LN[wght].ttf");font-style:italic;font-weight:300 700;}
  html,body{margin:0;background:#22303F;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
<canvas id=cv width=1920 height=1080></canvas>
<script type="module">
// DNA tóm tắt — "Tiles" (neg-times-neg). Bàn thử, KHÔNG phải code video.
//   node engine/render/shoot.js stills --page tools/lab/tiles.html --dur 2 --t 0.5,1.5 --outdir out/_lab/tiles
// Ý trung tâm: số âm không phải ý tưởng trừu tượng mà là ĐỒ VẬT trên bàn học — viên gạch đại số. Ta không "chọn" luật dấu:
//   gạch chỉ có một cách xếp để cặp viên nào cũng triệt tiêu. Phép nhân = hình chữ nhật lưới viên; chứng minh = đếm gạch.
// Vật xuyên suốt: ZERO PAIR — viên +1 vàng úp vào viên −1 đỏ, cả hai biến mất, để lại dấu chân viền đứt = 0.
//   Hồi 4: hai viên ĐỎ úp vào nhau nhưng không biến mất → không còn cặp số đối, vết nứt xanh băng chạy qua thảm.
// Màu: thảm cắt xanh than #22303F + lưới in #8FA6BD · +1 vàng #F4C430 (chữ cùng màu) · −1 đỏ gạch #D8443A (chữ #FF8070 cho
//   đủ 5.5:1) · chữ ngà #F2ECDD / phụ #A9B6C4 · "SAI/SỤP" = xanh băng #52D8E6 (nứt, gạch, viền) · giả định = giấy nhớ #F1E6C8.
// Chữ: Archivo (phương trình, số thẳng hàng) · IBM Plex Mono (nhãn in trên thảm) · Cormorant nghiêng (lời dẫn, giấy nhớ).
// Tiếng: chip (đặt viên xuống thảm) · tick (đếm viên) · pop (zero pair biến mất) · snap (khép lưới chữ nhật) · error/tear (nứt).
// Phần khác: Stendhal = gạch bị nghi ngờ, mascot cầm viên đỏ lật xem · Diophantus 4x+20=4 = viên x dài + 20 vàng, không đủ đỏ
//   → bỏ · que Trung Quốc = thẻ gỗ đỏ/đen đặt cạnh gạch (cùng vai +/−) · Brahmagupta "tài sản/nợ" = gạch vàng/đỏ in chữ cổ ·
//   Cardano/Maseres/Frend = gạch đỏ bị dồn ra mép thảm · nợ = mỗi viên đỏ một khoản nợ, trả nợ = zero pair · dãy số = cột
//   chữ nhật co dần 3×2, 2×2, 1×2, 0, rồi lật màu · quay 180° = lật viên (mặt vàng ↔ đỏ) trên trục số in thảm · Euler/luật =
//   thẻ luật dán thảm · tóm tắt = khay gạch xếp lại · quay 90° = viên đứng dọc, hé lộ màu thứ ba (gợi số ảo).
import { toCanvas } from '../../engine/mascot.js';
import { hash } from '../../engine/lib.js';

const W = 1920, H = 1080, g = document.getElementById('cv').getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const C = { mat: '#22303F', grid: '143,166,189', ink: '#F2ECDD', dim: '#A9B6C4', pos: '#F4C430', posS: '#B98E12', posT: '#F4C430',
  neg: '#D8443A', negS: '#952A22', negT: '#FF8070', ice: '#52D8E6', note: '#F1E6C8', noteInk: '#1E2A36', noteRed: '#B8322A' };
const ARC = '"Archivo"', MONO = '"IBM Plex Mono"', CG = '"Cormorant Garamond"';
const IM = {}; let MAT, ready = false;
const ev = s => Function(`return (${s})`)();
const must = (s, v) => { if (ev(s) !== v) throw new Error(`sai: ${s} ≠ ${v}`); return v; };
const num = v => (v < 0 ? '−' + -v : String(v));                 // số code trả về → chữ, dấu trừ U+2212
const par = v => (v < 0 ? `(${num(v)})` : num(v));

function mat() {                                      // thảm cắt tự lành: xanh than, lưới 1 cm in mờ, vạch 45°, vết dao cũ
  const c = mk(), x = c.getContext('2d'), d = x.createImageData(W, H), b = [0x22, 0x30, 0x3F];
  for (let i = 0; i < W * H; i++) {
    const px = i % W, py = (i / W) | 0, n = (hash(i * 0.517) - 0.5) * 5;
    const r = Math.hypot((px - W * 0.45) / W, (py - H * 0.45) / H), v = 1.06 - 0.5 * r * r;
    d.data[i * 4] = b[0] * v + n; d.data[i * 4 + 1] = b[1] * v + n; d.data[i * 4 + 2] = b[2] * v + n; d.data[i * 4 + 3] = 255;
  }
  x.putImageData(d, 0, 0);
  const S = 40, ox = 20, oy = 20;
  for (let k = 0; ox + k * S <= W; k++) { x.fillStyle = `rgba(${C.grid},${k % 5 ? 0.09 : 0.2})`; x.fillRect(ox + k * S, 0, k % 5 ? 1 : 1.6, H); }
  for (let k = 0; oy + k * S <= H; k++) { x.fillStyle = `rgba(${C.grid},${k % 5 ? 0.09 : 0.2})`; x.fillRect(0, oy + k * S, W, k % 5 ? 1 : 1.6); }
  x.strokeStyle = `rgba(${C.grid},0.07)`; x.lineWidth = 1;
  for (let k = -H; k < W; k += 400) { x.beginPath(); x.moveTo(k, H); x.lineTo(k + H, 0); x.stroke(); }
  for (let k = 0; k < 14; k++) {                        // vết dao: đường mảnh sáng, tất định
    const sx = hash(k * 2.3) * W, sy = hash(k * 5.9) * H, a = (hash(k * 9.1) - 0.5) * 0.6 + (k % 2 ? 0 : Math.PI / 2), l = 60 + hash(k * 4.4) * 220;
    x.strokeStyle = 'rgba(190,205,220,0.07)'; x.lineWidth = 1.2; x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + l * Math.cos(a), sy + l * Math.sin(a)); x.stroke();
  }
  return c;
}
function text(s, x, y, font, color, align = 'left', ls = 0) { g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'alphabetic';
  g.letterSpacing = ls + 'px'; g.fillText(s, x, y); const w = g.measureText(s).width; g.letterSpacing = '0px'; return w; }
const label = (s, x, y, color = C.dim, align = 'left', size = 20) => text(s.toUpperCase(), x, y, `500 ${size}px ${MONO}`, color, align, 2.5);
function eq(parts, x, y, size, align = 'left') {      // chuỗi phương trình nhiều màu; trả về [x0, x1] của từng phần
  const font = `600 ${size}px ${ARC}`; g.font = font;
  const ws = parts.map(([s]) => g.measureText(s).width), tot = ws.reduce((a, b) => a + b, 0);
  let cx = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x; const out = [];
  parts.forEach(([s, col], i) => { text(s, cx, y, font, col || C.ink); out.push([cx, cx + ws[i]]); cx += ws[i]; });
  return out;
}
const mid = r => (r[0] + r[1]) / 2;
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function line(pts, color, w, dash = []) { g.save(); g.strokeStyle = color; g.lineWidth = w; g.lineCap = g.lineJoin = 'round'; g.setLineDash(dash);
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); g.restore(); }
function arrowHead(x, y, ang, color, s = 14) { g.save(); g.translate(x, y); g.rotate(ang); g.fillStyle = color;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(-s, -s * 0.42); g.lineTo(-s * 0.75, 0); g.lineTo(-s, s * 0.42); g.closePath(); g.fill(); g.restore(); }

// Viên gạch: mặt phẳng + cạnh dày (lệch xuống-phải) + bóng mềm; dấu +/− dập chìm trên mặt (người mù màu vẫn đọc được)
function tile(x, y, s, kind, o = {}) {
  const P = kind === 'p', face = P ? C.pos : C.neg, side = P ? C.posS : C.negS, d = Math.max(3, s * 0.1), r = s * 0.12;
  g.save(); g.translate(x + s / 2, y + s / 2); g.rotate(o.rot || 0); g.translate(-s / 2, -s / 2); g.globalAlpha = o.alpha ?? 1;
  g.save(); g.shadowColor = 'rgba(5,10,18,0.55)'; g.shadowBlur = s * 0.28; g.shadowOffsetX = s * 0.08; g.shadowOffsetY = s * 0.14;
  g.fillStyle = side; rr(d * 0.6, d, s, s, r); g.fill(); g.restore();
  g.fillStyle = side; rr(d * 0.6, d, s, s, r); g.fill();
  const gr = g.createLinearGradient(0, 0, s, s); gr.addColorStop(0, 'rgba(255,255,255,0.22)'); gr.addColorStop(0.5, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.10)');
  g.fillStyle = face; rr(0, 0, s, s, r); g.fill(); g.fillStyle = gr; g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1.2; rr(1.5, 1.5, s - 3, s - 3, r * 0.8); g.stroke();
  const m = s * 0.2, t = Math.max(2, s * 0.06);                // dấu dập chìm: vệt tối + viền sáng dưới
  g.fillStyle = 'rgba(0,0,0,0.20)'; g.fillRect(s / 2 - m, s / 2 - t / 2, 2 * m, t); if (P) g.fillRect(s / 2 - t / 2, s / 2 - m, t, 2 * m);
  g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(s / 2 - m, s / 2 + t / 2, 2 * m, 1); if (P) g.fillRect(s / 2 + t / 2, s / 2 - m, 1, 2 * m);
  if (o.wrong) { g.strokeStyle = C.ice; g.lineWidth = 3.5; g.setLineDash([9, 6]); rr(-7, -7, s + 14 + d * 0.6, s + 14 + d, r + 6); g.stroke(); }
  g.restore();
}
function footprint(x, y, s, color = C.dim, label0 = true) {   // dấu chân viền đứt nơi một zero pair vừa biến mất = 0
  g.save(); g.strokeStyle = color; g.lineWidth = 2.4; g.setLineDash([8, 7]); rr(x, y, s, s, s * 0.12); g.stroke(); g.restore();
  if (label0) text('0', x + s / 2, y + s / 2 + s * 0.17, `500 ${s * 0.46}px ${ARC}`, color, 'center');
}
function zeroPair(x, y, s, top = 'p', bot = 'n') {     // viên trên đang úp xuống viên dưới (lệch, nghiêng) — khoảnh khắc trước khi biến mất
  tile(x, y, s, bot); tile(x + s * 0.34, y - s * 0.3, s, top, { rot: -0.16 });
}
// Hình chữ nhật nhân: cột thừa số trái, hàng thừa số trên, lòng = tích; đường chữ L ngà ngăn thừa số với tích
function mulRect(x, y, s, rows, cols, rk, ck, pk, o = {}) {
  const p = s + 7, gap = 18, X = x + p + gap, Y = y + p + gap;
  for (let i = 0; i < rows; i++) tile(x, Y + i * p, s, rk);
  for (let j = 0; j < cols; j++) tile(X + j * p, y, s, ck);
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) tile(X + j * p, Y + i * p, s, pk, { wrong: o.wrong });
  line([[X - gap / 2, y - 6], [X - gap / 2, Y + rows * p + 4]], 'rgba(242,236,221,0.55)', 2);
  line([[x - 6, Y - gap / 2], [X + cols * p + 4, Y - gap / 2]], 'rgba(242,236,221,0.55)', 2);
  return { x0: x, x1: X + cols * p - 7, y0: y, y1: Y + rows * p - 7, X, Y, p };
}
function crack(pts, w = 3) {                          // vết nứt xanh băng: đường gãy + nhánh, quầng mờ (shadowBlur, không filter)
  g.save(); g.shadowColor = 'rgba(82,216,230,0.7)'; g.shadowBlur = 14; line(pts, C.ice, w); g.restore();
  pts.forEach(([px, py], i) => { if (i && i < pts.length - 1 && i % 2) { const a = hash(i * 3.7) * 6.28, l = 18 + hash(i * 1.9) * 30;
    line([[px, py], [px + l * Math.cos(a), py + l * Math.sin(a)]], C.ice, 1.6); } });
}
function sprite(pose) {                               // nhân vật + viền tối 3px để áo trắng tách khỏi thảm
  const im = IM[pose], p = 6, c = mk(im.width + 2 * p, im.height + 2 * p), x = c.getContext('2d');
  const sil = mk(im.width, im.height), sx = sil.getContext('2d'); sx.drawImage(im, 0, 0); sx.globalCompositeOperation = 'source-in';
  sx.fillStyle = '#0E151E'; sx.fillRect(0, 0, im.width, im.height);
  for (let k = 0; k < 16; k++) { const a = k / 16 * 2 * Math.PI; x.drawImage(sil, p + 3.2 * Math.cos(a), p + 3.2 * Math.sin(a)); }
  x.drawImage(im, p, p); return { c, p, h: im.height };
}
function figure(S, cx, foot, h) {
  const s = h / S.h, w = S.c.width * s; g.drawImage(S.c, cx - w / 2, foot - h - S.p * s, w, S.c.height * s);
}
function legend(x, y) {                               // chú giải in góc thảm: +1, −1, zero pair = 0
  const s = 44;
  tile(x, y, s, 'p'); label('+1', x + s / 2 + 3, y + s + 34, C.posT, 'center');
  tile(x + 84, y, s, 'n'); label('−1', x + 84 + s / 2 + 3, y + s + 34, C.negT, 'center');
  zeroPair(x + 196, y + 6, s); text('→', x + 290, y + 34, `500 30px ${ARC}`, C.dim, 'center');
  footprint(x + 318, y, s); label('zero pair', x + 196 + 40, y + s + 34, C.dim, 'center');
}

const frames = [
  () => {                                             // 0 · HỒI 3: bước cuối của chứng minh
    const a = -3, b = 2, nb = must('-2', -2), zero = must('2 + (-2)', 0), p0 = must('(-3) * 0', 0);
    const ab = must('(-3) * 2', -6), x = must('0 - (-6)', 6), chk = must('-6 + 6', 0);
    if (must('(-3) * (-2)', x) !== x || chk !== 0) throw new Error('chứng minh lệch');
    label('Act III · the proof, last step', 96, 92);
    legend(1454, 92);
    // dòng 1: (−3) × (2 + (−2)) = (−3) × 0 = 0 — 2 và −2 thành một zero pair dưới chữ
    const S1 = 64, L1 = eq([[par(a) + ' × ('], [num(b), C.posT], [' + '], [par(nb), C.negT], [') = ' + par(a) + ' × '], [num(zero)], [' = '], [num(p0)]], 96, 196, S1);
    const ts = 52, ty = 250;
    const z0 = mid(L1[1]) - 20;
    for (let k = 0; k < b; k++) zeroPair(z0 + k * 104, ty + 20, ts);
    const zx = mid(L1[5]) - ts - 6; for (let k = 0; k < b; k++) footprint(zx + k * (ts + 12), ty + 6, ts, C.dim, false);
    line([[z0 + b * 104 + 14, ty + 40], [zx - 24, ty + 34]], C.dim, 2, [2, 8]); arrowHead(zx - 14, ty + 34, -0.02, C.dim, 14);
    label(`${b} zero pairs`, z0, ty + 116, C.dim);
    // dòng 2: = (−3) × 2 + (−3) × (−2), mỗi số hạng là một hình chữ nhật gạch
    const L2 = eq([['= '], [par(a) + ' × ' + num(b)], [' + '], [par(a) + ' × ' + par(nb)]], 96, 470, S1);
    const s = 52, wR = 2 * (s + 7) + 18 + s;
    const R1 = mulRect(mid(L2[1]) - wR / 2, 512, s, 3, 2, 'n', 'p', 'n');
    const R2 = mulRect(mid(L2[3]) - wR / 2, 512, s, 3, 2, 'n', 'n', 'p');
    label(`= ${num(ab)}`, mid([R1.X, R1.x1]), R1.y1 + 44, C.negT, 'center', 24);
    label(`= ${num(x)}`, mid([R2.X, R2.x1]), R2.y1 + 44, C.posT, 'center', 24);
    for (let i = 0; i < 3; i++) {                     // nối từng hàng đỏ ↔ vàng: sáu cặp số đối
      const yy = R1.Y + i * R1.p + s / 2; line([[R1.x1 + 14, yy], [R2.x0 - 14, yy]], 'rgba(242,236,221,0.6)', 2, [3, 7]); }
    const bY = R1.y1 + 78; line([[R1.X, bY], [R1.X, bY + 14], [R2.x1, bY + 14], [R2.x1, bY]], C.dim, 2);
    label(`${-ab} zero pairs → ${num(chk)}`, mid([R1.X, R2.x1]), bY + 50, C.ink, 'center', 22);
    // cột phải: kết luận
    const cx = 820;
    eq([['0 = '], [num(ab), C.negT], [' + ' + par(a) + ' × ' + par(nb)]], cx, 620, 50);
    text(`so ${par(a)} × ${par(nb)} is the opposite of ${num(ab)}`, cx, 692, `italic 600 40px ${CG}`, C.dim);
    const LC = eq([[par(a) + ' × ' + par(nb) + ' = '], [num(x), C.posT]], cx, 850, 76);
    if (LC[1][1] > 1340) throw new Error('kết luận đè nhân vật');
    label('forced, not chosen', cx + 4, 916, C.ink, 'left', 22);
    figure(IM.chalkS, 1660, 1080, 760);
  },
  () => {                                             // 1 · HỒI 4: phá một luật → 0 = −2
    const rule = -1, z = must('1 + (-1)', 0), p0 = must('(-1) * 0', 0), t1 = must('(-1) * 1', -1);
    const sum = must('(-1) * 1 + (-1)', -2), real = must('(-1) * (-1)', 1);
    if (real === rule) throw new Error('giả định phải khác thật');
    figure(IM.startS, 262, 1080, 760);
    label('Act IV · break one rule', 1824, 92, C.dim, 'right');
    // giấy nhớ: giả định
    g.save(); g.translate(760, 156); g.rotate(-0.025);
    g.save(); g.shadowColor = 'rgba(5,10,18,0.5)'; g.shadowBlur = 18; g.shadowOffsetY = 8; g.fillStyle = C.note; g.fillRect(-270, -86, 540, 172); g.restore();
    g.fillStyle = 'rgba(230,224,205,0.65)'; g.save(); g.rotate(0.05); g.fillRect(-70, -102, 140, 32); g.restore();
    text('Suppose we decide…', -240, -30, `italic 600 34px ${CG}`, '#4A4236');
    g.font = `600 56px ${ARC}`; const w1 = g.measureText('(−1) × (−1) = ').width;
    text('(−1) × (−1) = ', -240, 50, `600 56px ${ARC}`, C.noteInk); text(num(rule), -240 + w1, 50, `600 56px ${ARC}`, C.noteRed);
    text('?', 228, 50, `600 56px ${ARC}`, '#6B5E48', 'center');
    g.restore();
    // dòng A: (−1) × (1 + (−1)) = (−1) × 0 = 0
    const S1 = 58, X0 = 500;
    const LA = eq([['(−1) × ('], ['1', C.posT], [' + '], ['(−1)', C.negT], [') = (−1) × '], [num(z)], [' = '], [num(p0)]], X0, 338, S1);
    zeroPair(mid(LA[1]) + 10, 404, 50); footprint(mid(LA[5]) - 25, 392, 50, C.dim, false);
    line([[mid(LA[1]) + 100, 420], [mid(LA[5]) - 44, 418]], C.dim, 2, [2, 8]); arrowHead(mid(LA[5]) - 34, 418, 0, C.dim, 14);
    // dòng B: = (−1) × 1 + (−1) × (−1) → hai hình chữ nhật 1×1; viên tích thứ hai là luật mới (đỏ, viền băng)
    const LB = eq([['= (−1) × 1'], [' + '], ['(−1) × (−1)']], X0, 568, S1);
    const s = 60, wR = 2 * (s + 7) + 18 - 7;
    const R1 = mulRect(mid(LB[0]) + 16 - wR / 2, 606, s, 1, 1, 'n', 'p', 'n');
    const R2 = mulRect(mid(LB[2]) - wR / 2, 606, s, 1, 1, 'n', 'n', 'n', { wrong: true });
    label(`= ${num(t1)}`, R1.x1 + 24, R1.Y + s / 2 + 8, C.negT, 'left', 24);
    label(`= ${num(rule)}`, R2.x1 + 30, R2.Y + s / 2 + 8, C.negT, 'left', 24);
    label('new rule', R2.x1 + 30, R2.Y + s / 2 - 30, C.ice, 'left', 18);
    eq([['= '], [num(t1), C.negT], [' + '], [par(rule), C.negT], [' = '], [num(sum), C.negT]], X0, 860, S1);
    // phải: hai viên đỏ úp vào nhau nhưng KHÔNG biến mất — nứt
    const px = 1460, py = 330, ts = 116;
    footprint(px - 40, py - 10, ts, C.dim, false); label('a zero pair', px - 40 + ts / 2, py + ts + 34, C.dim, 'center', 18);
    label('should leave this', px - 40 + ts / 2, py + ts + 60, C.dim, 'center', 18);
    zeroPair(px + 180, py + 26, ts, 'n', 'n');
    label('−1 and −1', px + 180 + ts * 0.6, py + ts + 60, C.negT, 'center', 18);
    label('do not cancel', px + 180 + ts * 0.6, py + ts + 86, C.ice, 'center', 18);
    // 0 = −2, dấu = bị gạch, nứt băng chạy qua thảm
