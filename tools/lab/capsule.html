<script type="module">
// DNA tóm tắt — "カプセル · ガシャポン" (ja/gacha). Bàn thử, KHÔNG phải code video. Chụp: node engine/render/shoot.js stills --page tools/lab/capsule.html --dur 2 --t 0.5,1.5 --outdir out/_lab/capsule
// Ý: chữ ガチャ vốn là tiếng máy bán đồ chơi viên nang (ガチャガチャ/ガシャポン) — người Nhật nào cũng từng vặn một lần. Nên CẢ bài là một buổi chụp ảnh sản phẩm sáng, mờ nhựa matte, trong studio trắng ấm: "một lượt quay = một viên nang". Cái vui ngây thơ (pastel, tròn) đặt cạnh sự thật lạnh (0.6%, 天井) tạo đối lập có chủ ý; máy slot sơn mài đỏ-đen ở khung 0 là vật DUY NHẤT tối trong cả thế giới — nên nó chói.
// Vật xuyên suốt: VIÊN NANG hai nửa (nửa trên màu pastel bán trong, nửa dưới trắng ngọc, vạch nối, ánh cầu). 1 lượt = 1 viên: lưới 1000 viên (6 viên vàng), dãy 90 cột = 90 viên bút chì xếp hàng, 160 viên đá = 1 viên, mỗi người trong phân bố = 1 chấm-viên nhỏ; ★5 = viên VÀNG ÁNH CẦU (vàng + hồng/ngọc lam xoay), viên duy nhất phát sáng.
// Màu (một màu một nghĩa): nền trắng ấm #FFFCF6→#F3EBDF · mực #2B2A33 (chữ) / #5C5648 (phụ) · trời pastel #9FCDF2 = bình thường/0.6% · hồng-san hô #F6A9C4→#E8566E = xác suất đang TĂNG (74+) · vàng #FFF1B0→#E8B63A→#9A6A12 (+ ánh cầu) = ★5 / TRÚNG, chỉ dùng cho điều này · bạc hà #9BE0C2 = sau 天井 / đã chắc · son sơn mài #B3121F→#4A060C + đen #120708 + vàng kim = CASINO / 賭博 (cảnh báo, chỉ máy slot và chữ 賭博). Tiền = viên đá lam #5CC8E6 (160).
// Chữ: Shippori Mincho Bold (テロップ, tiêu đề, số lớn) · Noto Sans JP (nhãn, trục) · Cormorant Garamond (chữ Latin trang trí trên máy slot). Chữ ≥ 28 px.
// Tiếng (~1/3 s): vặn núm = ガチャ ratchet click (mới: 回転音) · viên rơi = pop/knock nhựa rỗng (mới) · mở nắp viên = click-pop · ★5 = shimmer/鈴 + whoosh sáng · slot = cuộn kêu lạch cạch + chuông (mới) · đồng xu = coin clink · cột dựng lên = tick tăng dần · テロップ = pen/pop.
// Các phần khác: lưới 1000 = 1000 viên trong một khối acrylic trong, 6 viên vàng · hộp Skinner + ảnh thật = ảnh nằm trong "thẻ sản phẩm" acrylic trắng bo tròn, đổ bóng mềm như bảng giá cửa hàng, viên nang đứng cạnh · Hooked 4 bước = 4 viên theo thứ tự mở ra (đặt-chờ-mở-thưởng) · đồng hồ 23時間 = máy bán viên có mặt đồng hồ, viên "đang nạp" · bảng tin SNS = dải thẻ pastel, mỗi thẻ có một viên vàng · bản đồ + ảnh báo cáo = thẻ sản phẩm lớn, cờ nước bằng viên nang tô · đuôi dài 0.15% = một viên vàng nhỏ ở cuối dãy viên pastel · sao kê 3万円 = 190 viên xếp thành chồng như xu · 3 khúc rẽ = 3 viên mở ra 3 hướng, まとめ = 3 viên đứng thẳng hàng.
import { toCanvas } from '../../engine/mascot.js';
import { hash } from '../../engine/lib.js';

const W = 1920, H = 1080, g = document.getElementById('cv').getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const MIN = '"Shippori Mincho"', NOTO = '"Noto Sans JP"', CG = '"Cormorant Garamond"';
const C = { ink: '#2B2A33', mute: '#5C5648', white: '#FFFFFF', lac: '#B3121F', lacDk: '#4A060C', blk: '#120708', gold: '#E8B63A', goldDk: '#8A5A00', coral: '#C2335A' };
const IM = {}; let BG0, BG1, NOISE, ready = false;

// ---- số: tính bằng code, must() ----
const ev = s => Function(`return (${s})`)();
const must = (s, v) => { const r = ev(s); if (r !== v) throw new Error(`sai: ${s} = ${r} ≠ ${v}`); return v; };
const PM = window.PM = {
  p: n => n <= 73 ? 0.006 : Math.min(1, 0.006 + 0.06 * (n - 73)),
  pmf: (() => { let S = 1; const a = []; for (let n = 1; n <= 90; n++) { const p = (n <= 73 ? 0.006 : Math.min(1, 0.006 + 0.06 * (n - 73))); a.push(S * p); S *= 1 - p; } return a; })(),
};
const cum = (a, b) => PM.pmf.slice(a - 1, b).reduce((s, v) => s + v, 0);
window.cum = cum;
const r3 = s => `Math.round((${s}) * 1000) / 1000`;
must('Math.round(PM.p(74) * 1000) / 10', 6.6); must('Math.round(PM.p(89) * 1000) / 10', 96.6); must('PM.p(90)', 1); must('PM.p(73)', 0.006);
const P73 = must(r3('cum(1,73)'), 0.356), P7480 = must(r3('cum(74,80)'), 0.563);
must('Math.round(window.cum(1,90) * 1e9)', 1e9);
must('(() => { let c = 0; for (let n = 1; n <= 90; n++) { c += PM.pmf[n - 1]; if (c >= 0.5) return n; } })()', 76);
must('Math.round(PM.pmf.reduce((s, v, i) => s + v * (i + 1), 0) * 10) / 10', 62.3);
// 200 người, làm tròn bằng phần dư lớn nhất, tổng = 200
const PEOPLE = (() => { const f = PM.pmf.map(v => v * 200), fl = f.map(Math.floor); let r = 200 - fl.reduce((a, b) => a + b, 0);
  f.map((v, i) => [v - fl[i], i]).sort((a, b) => b[0] - a[0]).slice(0, r).forEach(([, i]) => fl[i]++); return fl; })();
must('200', PEOPLE.reduce((a, b) => a + b, 0));
const N73 = PEOPLE.slice(0, 73).reduce((a, b) => a + b, 0), N7480 = PEOPLE.slice(73, 80).reduce((a, b) => a + b, 0), PEAK = Math.max(...PEOPLE);
if (Math.abs(N73 / 200 - P73) > 0.01 || Math.abs(N7480 / 200 - P7480) > 0.01 || Math.round(P73 * 100) !== 36 || Math.round(P7480 * 100) !== 56) throw new Error('chấm ≠ %');

// ---- tiện ích ----
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const hx = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const lerpC = (a, b, t) => { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
const rr = (x, y, w, h, r) => { const p = new Path2D(); p.roundRect(x, y, w, h, r); return p; };
const txt = (s, x, y, font, col = C.ink, align = 'left', base = 'alphabetic') => { g.save(); g.font = font; g.textAlign = align; g.textBaseline = base; g.fillStyle = col; g.fillText(s, x, y); const w = g.measureText(s).width; g.restore(); return w; };
const runs = (parts, x, y, align = 'left') => { const ws = parts.map(([s, f]) => { g.font = f; return g.measureText(s).width; }), tot = ws.reduce((a, b) => a + b, 0);
  let cx = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x; parts.forEach(([s, f, col], i) => { txt(s, cx, y, f, col); cx += ws[i]; }); return tot; };
const shadow = (col, blur, ox, oy, fn) => { g.save(); g.shadowColor = col; g.shadowBlur = blur; g.shadowOffsetX = ox; g.shadowOffsetY = oy; fn(); g.restore(); };
const star = (cx, cy, R, r = R * 0.42, a0 = -Math.PI / 2) => { const p = new Path2D(); for (let k = 0; k < 10; k++) { const a = a0 + k * Math.PI / 5, rad = k % 2 ? r : R; k ? p.lineTo(cx + rad * Math.cos(a), cy + rad * Math.sin(a)) : p.moveTo(cx + rad * Math.cos(a), cy + rad * Math.sin(a)); } p.closePath(); return p; };
const glint = (cx, cy, R, a = 1) => { g.save(); g.globalAlpha = a; const p = new Path2D(); p.moveTo(cx, cy - R); p.quadraticCurveTo(cx, cy, cx + R, cy); p.quadraticCurveTo(cx, cy, cx, cy + R); p.quadraticCurveTo(cx, cy, cx - R, cy); p.quadraticCurveTo(cx, cy, cx, cy - R);
  g.fillStyle = '#FFFFFF'; g.shadowColor = 'rgba(255,220,120,0.9)'; g.shadowBlur = R * 0.8; g.fill(p); g.restore(); };
const gem = (cx, cy, s) => { g.save(); const p = new Path2D(); p.moveTo(cx - s, cy - s * 0.2); p.lineTo(cx - s * 0.5, cy - s * 0.8); p.lineTo(cx + s * 0.5, cy - s * 0.8); p.lineTo(cx + s, cy - s * 0.2); p.lineTo(cx, cy + s); p.closePath();
  const gr = g.createLinearGradient(cx - s, cy - s, cx + s, cy + s); gr.addColorStop(0, '#C8F3FF'); gr.addColorStop(0.5, '#5CC8E6'); gr.addColorStop(1, '#2A8FB8'); g.fillStyle = gr; g.fill(p);
  g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(cx - s, cy - s * 0.2); g.lineTo(cx + s, cy - s * 0.2); g.moveTo(cx - s * 0.5, cy - s * 0.8); g.lineTo(cx - s * 0.25, cy - s * 0.2); g.lineTo(cx, cy + s); g.moveTo(cx + s * 0.5, cy - s * 0.8); g.lineTo(cx + s * 0.25, cy - s * 0.2); g.stroke(); g.restore(); };

// ---- VIÊN NANG hai nửa ----
const PAL = {
  sky: [['#F2FAFF', '#9FCDF2', '#5C97CF'], ['#FFFFFF', '#F6F2EC', '#D2CAC0']],
  pink: [['#FFEEF4', '#F8A9C6', '#D9709A'], ['#FFFFFF', '#F6F2EC', '#D2CAC0']],
  mint: [['#EAFCF3', '#9BE0C2', '#55AE8D'], ['#FFFFFF', '#F6F2EC', '#D2CAC0']],
  lemon: [['#FFFAE0', '#FFE08A', '#E5B53C'], ['#FFFFFF', '#F6F2EC', '#D2CAC0']],
  lav: [['#F4EEFF', '#C6B3F0', '#8F78CB'], ['#FFFFFF', '#F6F2EC', '#D2CAC0']],
  skyP: [['#F2FAFF', '#9FCDF2', '#5C97CF'], ['#FFEEF4', '#F8A9C6', '#D9709A']],
  mintL: [['#EAFCF3', '#9BE0C2', '#55AE8D'], ['#FFFAE0', '#FFE08A', '#E5B53C']],
  goldS: [['#FFFBE0', '#FFE070', '#E0A820'], ['#FFF8D0', '#FFD24C', '#D09418']],
  gold: [['#FFF7C8', '#F0C444', '#9A6A12'], ['#FFF3BE', '#E8B63A', '#8E5E0C']],
};
function capsule(cx, cy, r, rot, pal, { ground = true, gold = false } = {}) {
  if (ground) { g.save(); g.translate(cx, cy + r * 1.0); g.scale(1, 0.18); const sg = g.createRadialGradient(0, 0, 0, 0, 0, r * 1.05); sg.addColorStop(0, 'rgba(80,56,40,0.26)'); sg.addColorStop(1, 'rgba(80,56,40,0)'); g.fillStyle = sg; g.beginPath(); g.arc(0, 0, r * 1.05, 0, 7); g.fill(); g.restore(); }
  g.save(); g.beginPath(); g.arc(cx, cy, r, 0, 7); g.clip(); g.translate(cx, cy);
  g.save(); g.rotate(rot);
  [[-1, pal[0]], [1, pal[1]]].forEach(([h, c]) => { g.save(); g.beginPath(); g.rect(-r, h < 0 ? -r : 0, 2 * r, r); g.clip();
    const gr = g.createRadialGradient(-0.32 * r, h < 0 ? -0.42 * r : -0.1 * r, r * 0.05, 0, 0, r * 1.12); gr.addColorStop(0, c[0]); gr.addColorStop(0.5, c[1]); gr.addColorStop(1, c[2]);
    g.fillStyle = gr; g.fillRect(-r, -r, 2 * r, 2 * r); g.restore(); });
  g.fillStyle = 'rgba(40,24,30,0.16)'; g.fillRect(-r, -r * 0.075, 2 * r, r * 0.04); g.fillRect(-r, r * 0.04, 2 * r, r * 0.035);            // khe nối
  g.fillStyle = gold ? 'rgba(255,248,214,0.8)' : 'rgba(255,255,255,0.55)'; g.fillRect(-r, -r * 0.04, 2 * r, r * 0.08);                       // vành nối
  g.restore();
  if (gold && g.createConicGradient) { const cg = g.createConicGradient(-0.9, 0, 0); cg.addColorStop(0, 'rgba(255,140,190,0.42)'); cg.addColorStop(0.25, 'rgba(255,236,140,0.12)'); cg.addColorStop(0.5, 'rgba(110,230,255,0.42)'); cg.addColorStop(0.75, 'rgba(255,236,140,0.12)'); cg.addColorStop(1, 'rgba(255,140,190,0.42)');
    g.fillStyle = cg; g.fillRect(-r, -r, 2 * r, 2 * r); }
  const ed = g.createRadialGradient(0, 0, r * 0.55, 0, 0, r); ed.addColorStop(0, 'rgba(60,30,60,0)'); ed.addColorStop(1, 'rgba(60,30,60,0.22)'); g.fillStyle = ed; g.fillRect(-r, -r, 2 * r, 2 * r);
  g.restore();
  g.save(); g.translate(cx, cy);                                                                                                                  // ánh cầu + phản chiếu viền
  g.save(); g.rotate(-0.75); const hg = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.3); hg.addColorStop(0, 'rgba(255,255,255,0.95)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
  g.translate(-0.4 * r, -0.44 * r); g.scale(1, 0.55); g.fillStyle = hg; g.beginPath(); g.arc(0, 0, r * 0.3, 0, 7); g.fill(); g.restore();
  g.strokeStyle = 'rgba(255,255,255,0.32)'; g.lineWidth = Math.max(1, r * 0.06); g.beginPath(); g.arc(0, 0, r * 0.86, 0.12 * Math.PI, 0.55 * Math.PI); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(-0.12 * r, -0.62 * r, Math.max(0.8, r * 0.045), 0, 7); g.fill();
  g.restore();
}

// ---- nền studio: trắng ấm, sàn cyc, nhiễu matte ----
function noiseTex() { const c = mk(256, 256), x = c.getContext('2d'), d = x.createImageData(256, 256);
  for (let i = 0; i < 65536; i++) { const v = hash(i * 1.37 + 3) > 0.5 ? 255 : 0; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 7; } x.putImageData(d, 0, 0); return c; }
function studio(floor) {
  const c = mk(), x = c.getContext('2d'); let gr = x.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#FFFDF8'); gr.addColorStop(0.7, '#F8F1E6'); gr.addColorStop(1, '#EDE2D2'); x.fillStyle = gr; x.fillRect(0, 0, W, H);
  [[300, 220, 760, 'rgba(255,200,222,0.30)'], [1640, 180, 700, 'rgba(176,214,255,0.30)'], [960, 700, 900, 'rgba(255,244,214,0.5)']].forEach(([cx, cy, r, col]) => {
    const rg = x.createRadialGradient(cx, cy, 0, cx, cy, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = rg; x.fillRect(0, 0, W, H); });
  if (floor) { gr = x.createLinearGradient(0, 830, 0, 960); gr.addColorStop(0, 'rgba(120,92,70,0)'); gr.addColorStop(1, 'rgba(120,92,70,0.10)'); x.fillStyle = gr; x.fillRect(0, 830, W, H - 830);
    x.fillStyle = 'rgba(255,255,255,0.55)'; x.fillRect(0, 905, W, 1.5); }
  x.fillStyle = x.createPattern(NOISE, 'repeat'); x.fillRect(0, 0, W, H);
  const v = x.createRadialGradient(W / 2, H / 2, 520, W / 2, H / 2, 1180); v.addColorStop(0, 'rgba(90,60,40,0)'); v.addColorStop(1, 'rgba(90,60,40,0.10)'); x.fillStyle = v; x.fillRect(0, 0, W, H);
  return c;
}

// ---- Điện thoại: màn ガチャ tự thiết kế (pastel), ★5 vừa lóe ----
function phone(cx, top) {
  const w = 380, h = 740, x0 = cx - w / 2;
  g.save(); g.translate(cx, top + h + 22); g.scale(1, 0.1); let sg = g.createRadialGradient(0, 0, 0, 0, 0, 260); sg.addColorStop(0, 'rgba(70,50,40,0.30)'); sg.addColorStop(1, 'rgba(70,50,40,0)'); g.fillStyle = sg; g.beginPath(); g.arc(0, 0, 260, 0, 7); g.fill(); g.restore();
  shadow('rgba(70,50,40,0.22)', 40, 10, 22, () => { g.fillStyle = '#E9E2D8'; g.fill(rr(x0, top, w, h, 58)); });
  let gr = g.createLinearGradient(x0, top, x0 + w, top + h); gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(0.5, '#ECE6DE'); gr.addColorStop(1, '#CFC7BC'); g.fillStyle = gr; g.fill(rr(x0, top, w, h, 58));
  g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 2; g.stroke(rr(x0 + 1.5, top + 1.5, w - 3, h - 3, 57));
  g.fillStyle = '#E2DBD1'; g.fill(rr(x0 + w - 3, top + 150, 6, 70, 3)); g.fill(rr(x0 - 3, top + 130, 6, 52, 3));                                   // nút bên
  const sx = x0 + 15, sy = top + 15, sw = w - 30, sh = h - 30, S = rr(sx, sy, sw, sh, 44);
  g.save(); g.clip(S);
  gr = g.createLinearGradient(0, sy, 0, sy + sh); gr.addColorStop(0, '#FFF3F8'); gr.addColorStop(0.55, '#F1F5FF'); gr.addColorStop(1, '#DDEEFF'); g.fillStyle = gr; g.fillRect(sx, sy, sw, sh);
  const gx = cx, gy = top + 320;
  gr = g.createRadialGradient(gx, gy, 0, gx, gy, 250); gr.addColorStop(0, 'rgba(255,236,150,0.95)'); gr.addColorStop(0.45, 'rgba(255,214,120,0.40)'); gr.addColorStop(1, 'rgba(255,214,120,0)'); g.fillStyle = gr; g.fillRect(sx, sy, sw, sh);
  for (let k = 0; k < 16; k++) { const a = k / 16 * 2 * Math.PI + 0.2, a2 = a + 0.09; g.fillStyle = k % 2 ? 'rgba(255,240,170,0.34)' : 'rgba(255,255,255,0.40)'; g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx + 300 * Math.cos(a), gy + 300 * Math.sin(a)); g.lineTo(gx + 300 * Math.cos(a2), gy + 300 * Math.sin(a2)); g.fill(); }
  txt('ガチャ', sx + 30, top + 92, `700 42px ${MIN}`, '#3B2F4A');
  g.fillStyle = '#FFFFFF'; g.fill(rr(sx + sw - 150, top + 56, 124, 46, 23)); gem(sx + sw - 124, top + 80, 14); txt('160', sx + sw - 98, top + 91, `700 30px ${NOTO}`, '#1E5E7C');
  capsule(gx, gy, 98, -0.45, PAL.gold, { ground: false, gold: true });
  [[gx - 128, gy - 92, 26], [gx + 122, gy - 70, 20], [gx + 100, gy + 82, 24], [gx - 112, gy + 78, 16]].forEach(([x, y, s]) => glint(x, y, s));
  for (let i = 0; i < 5; i++) { const sxp = gx + (i - 2) * 56; g.save(); g.shadowColor = 'rgba(232,182,58,0.8)'; g.shadowBlur = 12; const sp = star(sxp, top + 468, 24); const sg2 = g.createLinearGradient(sxp, top + 444, sxp, top + 492); sg2.addColorStop(0, '#FFF1B0'); sg2.addColorStop(1, '#E8B63A'); g.fillStyle = sg2; g.fill(sp); g.restore(); }
  txt('最高レア', gx, top + 540, `700 36px ${MIN}`, '#7A4F00', 'center');
  const hist = ['sky', 'pink', 'mint', 'lemon', 'lav']; hist.forEach((k, i) => capsule(gx + (i - 2) * 66, top + 596, 24, 0.3 + i * 0.5, PAL[k], { ground: false }));
  const bx = gx - 138, by = top + 640, bw = 276, bh = 72; g.save(); g.shadowColor = 'rgba(217,58,98,0.45)'; g.shadowBlur = 22; g.shadowOffsetY = 10;
  gr = g.createLinearGradient(0, by, 0, by + bh); gr.addColorStop(0, '#F0648A'); gr.addColorStop(1, '#D23A62'); g.fillStyle = gr; g.fill(rr(bx, by, bw, bh, 36)); g.restore();
