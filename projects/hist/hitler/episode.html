<!doctype html><meta charset="utf-8">
<title>hist/hitler — Every Mistake That Made Hitler Lose WW2</title>
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
<canvas id=cv width=1920 height=1080></canvas>
<script type="module">
// Tập 4 kênh lịch sử — lời SCRIPT.md (bản 2), mốc = data/narration.timeline.json, tiếng = data/cues.py → cues.json.
// Trang này chỉ NẠP tài nguyên + ghép cảnh; cảnh theo hồi ở scenes/aN.js (`export default K => [[giờ, (t, X) => …], …]`).
// Luật dựng: channels/hist/EDITING.md · CHARACTER.md (nhân vật nổi tiếng _kit/famous.js, người dẫn = sĩ quan tuỳ tùng).
//   node engine/render/shoot.js check --page projects/hist/hitler/episode.html
// Bản đồ: europe1960 CHỈ lấy bờ biển (không vẽ biên giới — sai năm). Vật xuyên suốt: khay thẻ ảnh thật → bảng xếp hạng (common.js).
import { loadMap, creditLeft } from '../_kit/mapkit.js';
import { bindNarrator } from '../_kit/narrator.js';
import { bindStage, PAPER } from '../_kit/stage.js';
import { bindCast } from '../_kit/cast.js';
import { bindFamous } from '../_kit/famous.js';
import { bindCommon } from './scenes/common.js';
import a0 from './scenes/a0.js'; import a1 from './scenes/a1.js'; import a2 from './scenes/a2.js'; import a3 from './scenes/a3.js';
import a4 from './scenes/a4.js'; import a5 from './scenes/a5.js'; import a6 from './scenes/a6.js';
creditLeft();

const g = document.getElementById('cv').getContext('2d');
bindNarrator(g);
const IM = {}, MISSING = []; window.__missing = MISSING;
let M = null, TL = null, ready = false;
const img = (k, src) => { const im = new Image(); im.src = src; return im.decode().then(() => { IM[k] = im; }); };
const json = u => fetch(u).then(r => r.json());
const metaImgs = (dir, pre, ext = 'jpg') => json(dir + 'meta.json').then(m => Promise.all(Object.keys(m).map(k => img(pre + k, `${dir}${k}.${m[k].ext ?? ext}`).catch(() => { MISSING.push(pre + k); })))).catch(() => {});
Promise.all([new FontFace('Archivo', 'url("../../../assets/fonts/Archivo[wdth,wght].ttf")', { weight: '100 900' }).load().then(f => document.fonts.add(f)),
  loadMap('../_kit/maps/europe1960.json').then(m => { M = m; }),
  json('data/narration.timeline.json').then(j => { TL = j; }),
  json('data/narration.mouth.json').then(j => bindNarrator(g, { mouth: j })),
  metaImgs('assets/photos/', 'p_'), img('boom1', '../sarajevo/assets/cut/boom1.png')])
  .then(() => { bindStage(g, { IM, M }); bindCast(g, {}); bindFamous(g); bindCommon(g, IM, M); build(); ready = true; }).catch(e => { window.__intro.error = String(e); });

const norm = s => s.toLowerCase().replace(/[^a-z0-9']/g, '');
function LT(pre) { const ls = TL.lines.filter(l => l.text.startsWith(pre)); if (ls.length !== 1) throw new Error(`LT: "${pre}" khớp ${ls.length} dòng`); return ls[0]; }
/** giờ bắt đầu của từ `word` (lần thứ nth) tính từ dòng có đầu `pre` (dòng đó + 2 dòng sau) */
function wd(pre, word, nth = 0) { const i0 = TL.lines.indexOf(LT(pre)); const ws = TL.lines.slice(i0, i0 + 3).flatMap(l => l.words).filter(x => norm(x.w) === norm(word));
  if (!ws[nth]) throw new Error(`wd: "${word}" ∉ "${pre}"`); return ws[nth].start; }
const ST = pre => LT(pre).start - 0.2;
const E = pre => LT(pre).end;

let SC = [], DUR = 800;
function build() {
  const last = TL.lines[TL.lines.length - 1];
  DUR = last.end + 7.0;                                   // thẻ kết đứng ≥ 4 s
  const K = { g, IM, M, TL, LT, wd, ST, E, END: last.end + 1.0, get DUR() { return DUR; } };
  SC = [a0, a1, a2, a3, a4, a5, a6].flatMap(f => f(K)).sort((a, b) => a[0] - b[0]);
}
function frame(X) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  if (!ready) { g.fillStyle = PAPER; g.fillRect(0, 0, 1920, 1080); return; }
  let i = SC.findLastIndex(s => X >= s[0]); if (i < 0) i = 0;
  g.save(); SC[i][1](X - SC[i][0], X); g.restore();
}
window.__intro = { get ready() { return ready; }, still: frame, frame, get DUR() { return DUR; }, LEAD: 0, error: null };
</script>
