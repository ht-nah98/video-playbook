// World War I phần 1 (tập mẫu kênh lịch sử) — lời SCRIPT.md, mốc = data/narration.timeline.json, tiếng = data/cues.py → cues.json.
// Luật dựng: channels/hist/EDITING.md · lời + người dẫn: WRITING.md §1c · đồ nghề hình: ../_kit/stage.js (import, không chép lại).
// Mọi ảnh CC0 / public domain — nguồn ở assets/{photos,web}/meta.json.

import { loadMap, view, drawMap, mapFace, cutout, ll, bubble, ANCHOR, INK, SEA, LAND, creditLeft } from '../_kit/mapkit.js';

const g = document.getElementById('cv').getContext('2d');
bindNarrator(g);
const AH = 'Austro-Hungarian Empire', RS = 'Serbia', DE = 'German Empire', RU = 'Russian Empire', FR = 'France',

// ── tài nguyên ──
const IM = {}; let M = null, MW = null, TL = null, ready = false;

Promise.all([new FontFace('Archivo', 'url("../../../assets/fonts/Archivo[wdth,wght].ttf")', { weight: '100 900' }).load().then(f => document.fonts.add(f)),
  loadMap('../_kit/maps/europe1914.json').then(m => { M = m; }), loadMap('../_kit/maps/world1914.json').then(m => { MW = m; }),
  fetch('data/narration.timeline.json').then(r => r.json()).then(j => { TL = j; }),
  fetch('data/narration.mouth.json').then(r => r.json()).then(j => bindNarrator(g, { mouth: j })),
  ...['car', 'boom1', 'ff_bust', 'sophie_bust', 'potiorek_bust'].map(k => img(k, `assets/cut/${k}.png`)),
  ...['ff', 'princip', 'nyt', 'townhall', 'sarajevo', 'cabri', 'worldnow', 'rhodes'].map(k => img('p_' + k, `assets/photos/${k}.jpg`)),
  ...['street1910', 'phone', 'fordT', 'wright', 'ring', 'imperialmap', 'cake', 'bulow', 'hospital', 'latin1930'].map(k => img('w_' + k, `assets/web/${k}.jpg`))])
  .then(() => { bindStage(g, { IM, M, MW }); build(); ready = true; }).catch(e => { window.__intro.error = String(e); });

// dòng cảnh đánh số theo bản 4 → dòng bản hiện tại tìm bằng ĐẦU CÂU (sống sót qua mọi lần viết lại / cắt câu)
const HOSTX = 1780;   // chỗ người dẫn trong đám đông phố Sarajevo — giữ nguyên qua hai cảnh liền nhau (EDITING A2)
const PRE = ["Hey everyone.", "By nineteen fourteen, the world had", "Naturally, they decided", "In nineteen fourteen they finally", "Today we just call it", "This is the world map today", "And this is the world in nineteen fourteen", "That's imperialism", "Britain ran about a fifth", "Germany, on the other hand", "But by the time Germany", "So Europe split", "Germany, Austria-Hungary, which", "Italy, still sulking", "Everyone promised", "And the most dangerous spot", "People called the Balkans", "That spark came", "June twenty-eighth", "Along the route", "The first one throws", "So he swallows", "Plan failed", "But no.", "After complaining", "Nice of him", "So the cars turn", "Standing right there", "And no, he wasn't", "He fires twice", "Franz Ferdinand and Sophie are dead", "One month later", "All because nobody told", "Next time:"];
const LT = pre => { const l = TL.lines.find(l => l.text.startsWith(pre)); if (!l) throw new Error(`LT: "${pre}"`); return l; };
const L = n => LT(PRE[n - 1]);
function w(n, word, nth = 0) { const i0 = TL.lines.indexOf(L(n)); const ws = TL.lines.slice(i0, i0 + 3).flatMap(l => l.words).filter(x => x.w.replace(/[^a-z']/g, '') === word); if (!ws[nth]) throw new Error(`w: "${word}" ∉ L${n}`); return ws[nth].start; }

// ── cảnh — dựng sau khi có mốc giọng ──
let SC = [], DUR = 212;
function build() {
  const S = n => L(n).start - 0.2;
  DUR = L(34).end + 4.0;
  const V0 = view(M, { cx: 15, cy: 49.5, zoom: 1.05 });
  const T = {};                                                       // mốc từ
  for (const [k, n, word, nth] of [['tele', 2, 'telephones'], ['cars', 2, 'cars'], ['air', 2, 'airplanes'], ['biz', 2, 'richer'], ['great', 3, 'biggest'], ['punch', 3, 'navy'],
    ['war4', 4, 'war'], ['writer', 4, 'wells'], ['ww', 5, 'world'], ['us', 6, 'united'], ['hand', 7, 'handful'], ['imp', 8, 'imperialism'], ['flag', 8, 'flag'], ['ship', 8, 'ship'],
    ['fifth', 9, 'fifth'], ['fr9', 9, 'france'], ['eigh', 10, 'eighteen'], ['steel', 10, 'steel'], ['party', 11, 'party'], ['place', 11, 'place'], ['alli', 13, 'alliance'],
    ['nerv', 13, 'nervous'], ['tunisia', 14, 'tunisia'], ['asked', 14, 'asked'], ['sure', 14, 'sure'], ['spoil', 14, 'spoiler'], ['small', 15, 'small'], ['giant', 15, 'giant'], ['bosnia', 16, 'bosnia'], ['serb', 16, 'serbia'],
    ['furious', 16, 'furious'], ['keg', 17, 'keg'], ['spark', 17, 'spark'], ['wrong18', 18, 'wrong'], ['drv18', 18, 'driver'],
    ['arch', 19, 'archduke'], ['rides', 19, 'rides'], ['sophie', 19, 'sophie'], ['six', 20, 'six'], ['secret', 20, 'secret'], ['pist', 20, 'pistols'],
    ['throw', 21, 'throws'], ['bounce', 21, 'bounces'], ['expl', 21, 'explodes'], ['jump', 22, 'jumps'], ['poison', 22, 'poison'], ['five', 22, 'five'], ['canc', 23, 'cancelled'],
    ['guest', 25, 'guest'], ['bombs', 25, 'bombs'], ['decide', 25, 'decides'], ['drv26', 26, 'driver'], ['gov', 27, 'governor'], ['rev', 27, 'reversing'], ['stall', 27, 'stalls'],
    ['deli', 27, 'deli'], ['prin', 28, 'gavrilo'], ['target', 28, 'target'], ['feet', 28, 'feet'], ['myth', 29, 'myth'], ['fires', 30, 'fires'], ['twice', 30, 'twice'],
    ['month', 32, 'month'], ['decl', 32, 'declares'], ['week', 32, 'week'], ['drv33', 33, 'driver'], ['letter', 34, 'letter'], ['week7', 34, 'seven']]) T[k] = w(n, word, nth);
  const at = (k, T0) => T0 - T[k];

  SC = [
    // ═══ MỞ BÀI ═══
    [0, (t, X) => { photoBg(IM.p_sarajevo, t, { desat: 0.6, dark: 0.35, fy: 0.5, zoom: 1.14 }); lipHost(X, clamp(t / 0.35)); }],   // L1 chào — trên ảnh phố 1914 (REVIEW B: khung đen chết)
    [LT('Today: how a wrong turn').start - 0.2, (t, X) => { const l = LT('Today: how a wrong turn'), wt = wd => l.words.find(x => x.w.replace(/[^a-z']/g, '') === wd)?.start ?? l.start;   // câu MÓC: 3 hình nhanh
      if (X < wt('stalled')) { photoBg(IM.w_latin1930, t, { desat: 0.5, fy: 0.62 }); carPhoto(lerp(1500, 900, easeOut(t / 0.8)), 1070, 900, X, { riders: false, moving: true }); label('WRONG TURN', 960, 200, 90, clamp(t / 0.2), '#FFF', { stroke: RED }); }
      else if (X < wt('nineteenyearold') - 0.05 && X < wt('outside')) { photoBg(IM.w_latin1930, t, { desat: 0.5, fy: 0.62 }); carPhoto(900, 1070, 900, X, { riders: false }); smoke(900 + 400, 980, wt('stalled'), X); label('*STALL*', 1250, 760, 64, clamp((X - wt('stalled')) / 0.2), '#FFF', { stroke: INK }); }
      else if (X < wt('lit')) { paper('#141414'); assassin(960, 1000, 520, { look: -1, gun: 0.9 }); label('19', 1260, 420, 110, clamp((X - wt('outside')) / 0.2), '#FFF', { stroke: RED }); }
      else { drawMap(g, M, V0, { fill: { [AH]: 'flag', [RS]: 'flag', [DE]: 'flag', [FR]: 'flag', [RU]: 'flag', [UK]: 'flag' } }); for (const n of [AH, RS, DE, FR, RU, UK]) mapFace(g, M, V0, n, { mood: 'angry' });
        const u = X - wt('lit'); realBoom(pt(V0, ...SARA)[0], pt(V0, ...SARA)[1], 520, u, 3); realBoom(700, 420, 480, u - 0.5, 4); realBoom(1300, 380, 480, u - 0.8, 5); }
      lipHost(X); }],
    [LT('But first, you need to know').start - 0.2, (t, X) => { const V = view(M, { cx: lerp(15, 18.4, ease(t / 3)), cy: lerp(49.5, 44, ease(t / 3)), zoom: lerp(1.05, 2.2, ease(t / 3)) });   // ngòi nổ chạy qua châu Âu
      drawMap(g, M, V, { fill: { [AH]: 'flag', [RS]: 'flag', [DE]: 'flag', [FR]: 'flag', [RU]: 'flag', [UK]: 'flag' } }); desat(0.5, 0.2);
      const c = pt(V, ...SARA), u = clamp(t / 3.5), s0 = [c[0] - 900, c[1] - 420], p = [lerp(s0[0], c[0], u), lerp(s0[1], c[1], u)];
      g.save(); g.strokeStyle = '#2A2A2A'; g.lineWidth = 8; g.setLineDash([18, 10]); g.beginPath(); g.moveTo(...s0); g.lineTo(...c); g.stroke(); g.restore();
      for (let i = 0; i < 12; i++) { const a = hash(i + Math.floor(X * 20)) * 7, r = 10 + 30 * hash(i + 5); g.fillStyle = i % 2 ? '#FFD34D' : '#FF7A1A'; g.beginPath(); g.arc(p[0] + Math.cos(a) * r, p[1] + Math.sin(a) * r, 6, 0, 7); g.fill(); }
      label('THE FUSE', 960, 150, 80, clamp(t / 0.3), '#FFF', { stroke: INK }); lipHost(X); }],
    [S(2), (t, X) => {                                                                                                                         // L2 ảnh đời thật đổi theo từ
      const pics = [['w_street1910', S(2), 'Los Angeles, c. 1910', 0.5, 0.75], ['w_phone', T.tele, 'Liberty Loan poster, 1917', 0.5, 0.35], ['w_fordT', T.cars, 'Ford Model T, c. 1910', 0.5, 0.6],
        ['w_wright', T.air, 'Wright Flyer, 1903', 0.5, 0.5], ['w_street1910', T.biz, 'Los Angeles, c. 1910', 0.5, 0.35]];
      let i = pics.findLastIndex(p => X >= p[1]); if (i < 0) i = 0; const [k, t0, cr, fx, fy] = pics[i];
      photoBg(IM[k], X - t0, { fx, fy, zoom: k === 'w_phone' ? 1.0 : 1.05, credit: cr + ' · public domain' });
      if (i === 4) stamp('BUSINESS: BOOMING', 760, 300, 64, clamp((X - T.biz) / 0.3), -0.06);
      lipHost(X); }],
    [S(3), (t, X) => { paper('#FFFFFF'); const pre = X < T.punch, pk = pre ? 0.15 : undefined;                                 // L3 các nước ra oai → tới chữ "punch" thì đấm
      // (bản 4 đầu dùng cận mặt người dẫn 3.5 s ở đây — người dùng: "sao có mỗi cái mặt"; cận mặt chỉ là phản ứng ≤ 1.2 s, §197)
      boxer(UK, 330, 900, 380, X, { dir: 1, mood: pre ? 'smug' : 'angry', punch: pk }); boxer(FR, 760, 820, 330, X + 0.3, { dir: -1, mood: pre ? 'smug' : 'angry', punch: pk });
      boxer(DE, 1180, 900, 380, X + 0.6, { dir: 1, mood: pre ? 'cool' : 'angry', punch: pk }); boxer(RU, 1620, 880, 420, X + 0.9, { dir: -1, mood: pre ? 'smug' : 'angry', punch: pk });
      if (pre) label("WHO'S THE STRONGEST?", 960, 200, 80, clamp((X - T.great) / 0.3), INK);
      if (X > T.punch) for (let i = 0; i < 4; i++) label('POW!', 540 + i * 420, 360 + 60 * Math.sin(i), 70, clamp((X - T.punch - i * 0.2) / 0.2), RED, { stroke: '#FFF', rot: (hash(i) - 0.5) * 0.4 }); }],
    [S(4), (t, X) => { const [sx, sy] = shake(clamp(((X - T.war4) % 0.8) / 0.5), 10, X);                                                       // L4 bản đồ cũ + vụ nổ thật chồng lên
      g.save(); g.translate(sx, sy); photoBg(IM.w_imperialmap, t, { zoom: 1.1, fy: 0.42, desat: 0.85 }); g.fillStyle = 'rgba(20,18,15,0.35)'; g.fillRect(-40, -40, W + 80, H + 80);
      for (let i = 0; i < 14; i++) realBoom(160 + hash(i + 20) * 1500, 280 + hash(i + 40) * 600, 420 + 260 * hash(i + 60), X - (T.war4 + i * 0.42), i);
      g.restore();
      if (X > T.writer) { label('“THE WAR THAT WILL END WAR”', 700, 140, 60, clamp((X - T.writer) / 0.3), '#FFF', { stroke: INK }); label('— H. G. Wells, 1914', 700, 205, 38, clamp((X - T.writer - 0.4) / 0.3), '#FFF', { stroke: INK }); }
      lipHost(X); credit('Map: Imperial Federation, 1886 · public domain'); }],
    [S(5), (t, X) => { photoBg(IM.w_ring, t, { dark: 0.25, fy: 0.45 });                                                                        // L5 sàn đấu thật + các nước + tên trận
      boxer(UK, 260, 1000, 360, X, { dir: 1 }); boxer(FR, 620, 860, 300, X + 0.4, { dir: 1 }); boxer(DE, 1000, 980, 380, X + 0.8, { dir: -1 }); boxer(RU, 1320, 880, 330, X + 1.2, { dir: -1 });

      const k = clamp((X - T.ww) / 0.3); if (k > 0) { label('WORLD WAR I', 900, 250, 170, k, '#FFF', { stroke: RED }); label('1914 – 1918', 900, 340, 56, clamp(k - 0.4), '#FFF', { stroke: INK }); }
      credit('Boxing ring · CC0 (StockSnap)'); }],
    // ═══ BỐI CẢNH ═══
    [S(6), (t, X) => { const P = photoBg(IM.p_worldnow, t, { push: 0.004, fy: 0.45, credit: 'Political Map of the World, CIA · public domain' });     // L6 bản đồ hôm nay — nước Mỹ ngủ
      label('THE WORLD TODAY', 960, 90, 64, clamp(t / 0.3), INK, { stroke: '#FFF' });
      const k = clamp((X - T.us) / 0.3); if (k > 0) { const [x, y] = P(410, 330); g.save(); g.strokeStyle = RED; g.lineWidth = 8; g.globalAlpha = k; g.beginPath(); g.ellipse(x, y, 230 * back(k), 130 * back(k), 0, 0, 7); g.stroke(); g.restore();
        for (const s of [-1, 1]) { g.fillStyle = '#FFF'; g.strokeStyle = INK; g.lineWidth = 4; g.beginPath(); g.ellipse(x + s * 46, y, 34, 40, 0, 0, 7); g.fill(); g.stroke(); g.fillStyle = INK; g.fillRect(x + s * 46 - 36, y - 42, 72, 46); }
        label('z z z', x + 150, y - 110, 54, clamp((X - T.us - 0.5) / 0.3), INK, { stroke: '#FFF' }); }
      lipHost(X, clamp(t / 0.35)); }],
    [S(7), (t, X) => { world1914(X, T.hand); label('THE WORLD IN 1914', 960, 90, 64, clamp(t / 0.3), INK, { stroke: '#FFF' }); }],                // L7 thế giới 1914 tô theo đế quốc
    [S(8), (t, X) => { paper('#1B1A18'); photo(IM.p_rhodes, 640, 560, 500, 1, { push: 1 + 0.02 * t, credit: '“The Rhodes Colossus”, Punch, 1892 · public domain' });   // L8 chủ nghĩa đế quốc
      stamp('IMPERIALISM', 600, 140, 70, clamp((X - T.imp) / 0.3), -0.05);
      [['1. SHOW UP', T.imp + 0.5], ['2. PLANT A FLAG', T.flag], ['3. SHIP THE GOOD STUFF HOME', T.ship]].forEach(([tx, t0], i) => label(tx, 1000, 420 + i * 110, 48, clamp((X - t0) / 0.25), '#FFF', { align: 'left', stroke: INK }));
      lipHost(X, clamp(t / 0.3)); }],
    [S(9), (t, X) => { if (X < T.fr9 - 0.1) { photoBg(IM.w_imperialmap, t, { zoom: 1.0, fy: 0.45, credit: 'Imperial Federation map of the British Empire, 1886 · public domain' });   // L9 Đế quốc Anh
        g.fillStyle = 'rgba(15,15,20,0.35)'; g.fillRect(0, 0, W, H); stamp('≈ 1/5 OF ALL LAND', 960, 200, 90, clamp((X - T.fifth) / 0.3), 0.04); return; }
      world1914(X, 0, { only: ['UK', 'FR', 'RU'] }); label('BRITAIN · FRANCE · RUSSIA', 960, 90, 60, clamp((X - T.fr9) / 0.3), INK, { stroke: '#FFF' }); }],
    [S(10), (t, X) => { const V = view(M, { cx: lerp(15, 11, ease(t / 1.5)), cy: lerp(49.5, 51, ease(t / 1.5)), zoom: lerp(1.05, 2.0, ease(t / 1.5)) });   // L10 nước Đức trẻ, nhiều thép
      drawMap(g, M, V, { fill: { [DE]: 'flag', [UK]: 'flag' } }); mapFace(g, M, V, DE, { mood: X > T.steel ? 'cool' : 'smug' }); mapFace(g, M, V, UK, { mood: X > T.steel ? 'shock' : 'calm' });
      stamp('UNITED: 1871', 1450, 200, 64, clamp((X - T.eigh) / 0.3), 0.05); bars(X, T.steel); }],
    [S(11), (t, X) => { if (X < T.place - 0.1) { paper('#1B1A18'); photo(IM.w_cake, 960, 540 + 260 - t * 40, 900, 1, { push: 1.1 + 0.02 * t, credit: '“China — the cake of kings and emperors”, Le Petit Journal, 1898 · public domain' });   // L11 tiệc thuộc địa
        label('THE COLONY PARTY', 960, 110, 64, clamp((X - T.party) / 0.3), '#FFF', { stroke: INK }); return; }
      paper('#1B1A18'); photo(IM.w_bulow, 560, 540, 520, 1, { push: 1 + 0.02 * t, credit: 'Bernhard von Bülow · public domain' });
      nameTag('BERNHARD VON BÜLOW, 1897', clamp((X - T.place) / 0.3), 900, 420);
      bubble(g, 'We demand our own place in the sun!', 1300, 600, 900, 520, clamp((X - T.place - 0.3) / 0.25), 40); }],
    [S(12), (t, X) => { drawMap(g, M, V0, { fill: { [DE]: '#9C3B3B', [AH]: '#9C3B3B', [IT]: '#9C3B3B', [UK]: '#3B5E9C', [FR]: '#3B5E9C', [RU]: '#3B5E9C' } });   // L12–L13 hai băng
      for (const n of [DE, AH, IT, UK, FR, RU]) mapFace(g, M, V0, n, { mood: 'angry' }); label('TWO GANGS', 960, 100, 80, clamp(t / 0.3), '#FFF', { stroke: INK }); }],
    [S(13), (t, X) => { photoBg(IM.p_worldnow, t, { dark: 0.6, desat: 1, push: 0.005 });
      const k1 = clamp((X - T.alli) / 0.3), k2 = clamp((X - w(13, 'britain')) / 0.3);
      [[DE, 240, 400], [AH, 480, 360], [IT, 700, 330]].forEach(([n, x, h], i) => { if (k1 > 0) cutout(g, M, n, x, 1000 - (1 - back(k1)) * 300, h, { mood: 'cool', arms: 'cross', t: X }); });
      [[UK, 1180, 330], [FR, 1420, 360], [RU, 1700, 420]].forEach(([n, x, h]) => { if (k2 > 0) cutout(g, M, n, x, 1000 - (1 - back(k2)) * 300, h, { mood: X > T.nerv ? 'shock' : 'calm', arms: 'cross', t: X }); });
      label('TRIPLE ALLIANCE', 470, 150, 64, k1, '#FFF', { stroke: INK }); label('TRIPLE ENTENTE', 1440, 150, 64, k2, '#FFF', { stroke: INK });
      if (X > T.nerv) for (const x of [1180, 1420, 1700]) sweat(x + 90, 600, 1.4); }],
    [S(14), (t, X) => { photoBg(IM.p_worldnow, t, { dark: 0.6, desat: 1, push: 0.005 });                                                         // L14 Ý tự xin vào (cay Pháp vì Tunisia) — đúng sử
      cutout(g, M, IT, 1320, 1000, 440, { mood: X > T.asked ? 'sad' : 'angry', arms: 'wave', t: X }); cutout(g, M, DE, 560, 1000, 460, { mood: X > T.spoil ? 'shock' : 'smug', arms: 'cross', t: X });
      if (X < T.asked) bubble(g, 'France took TUNISIA!', 1320, 330, 1320, 560, clamp((X - T.tunisia) / 0.25), 48);
      else bubble(g, 'Can I join your gang?', 1320, 330, 1320, 560, clamp((X - T.asked) / 0.25), 48);
      bubble(g, 'Sure. Just don’t flake on us.', 640, 300, 560, 520, clamp((X - T.sure) / 0.25), 48);
      stamp('SPOILER: ITALY SWITCHES SIDES (1915)', 960, 930, 48, clamp((X - T.spoil) / 0.3), -0.04); }],
    [S(15), (t, X) => { paper('#FFFFFF');                                                                                                     // L15 hứa bảo kê → domino
      const row = [[RS, 0.6], [AH, 1], [RU, 1.15], [DE, 1], [FR, 0.95], [UK, 0.85]];
      row.forEach(([n, s], i) => { const x = 200 + i * 300, tip = clamp((X - T.giant - i * 0.18) / 0.35);
