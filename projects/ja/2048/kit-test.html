<!doctype html><meta charset="utf-8">
<title>ja/2048 — tờ thử kit</title>
<style>
  @font-face{font-family:"Cormorant Garamond";src:url("../../../assets/fonts/CormorantGaramond-LN[wght].ttf");font-weight:300 700;}
  @font-face{font-family:"Noto Sans JP";src:url("../../../assets/fonts/NotoSansJP[wght].ttf");font-weight:100 900;}
  @font-face{font-family:"Shippori Mincho";src:url("../../../assets/fonts/ShipporiMincho-Regular.ttf");font-weight:400;}
  @font-face{font-family:"Shippori Mincho";src:url("../../../assets/fonts/ShipporiMincho-Bold.ttf");font-weight:700;}
  html,body{margin:0;background:#111;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
<canvas id=cv width=1920 height=1080></canvas>
<script type="module">
// Tờ thử MỌI hàm kit có tham số k ở k = 0.25 / 0.5 / 0.75 / 1 (LESSONS §89), 17 bậc quân, bàn mini nhiều cỡ.
//   t ∈ [0,4) tờ A (bàn, quân, chữ) · [4,8) tờ B (giấy, xu, bàn tính, 駒台, mascot) · [8,12) tờ C (cây, 将棋, vuốt, rắn)
//   [12,13) 17 bậc · [13,14) bàn nhiều cỡ + điện thoại · [14,18) thẻ hồi ở 4 mốc. Khung i: k = KS[i % 4].
//   node engine/render/shoot.js stills --page projects/ja/2048/kit-test.html --dur 18 --t 0.5,1.5,…,17.5 --outdir out/_lab/ja/2048/kit
import { W, H, C, MIN, JP, CG, FONTS, FONT_SAMPLE, loadKit, ground, dark, write, telop, answer, luck, wrong, heading, vtext, brush, arrow,
  strikeInk, stamp, koma, ban, board, boardMove, chevrons, komadai, kifu, tanzaku, coin, tree, shogiban, soroban, actCard, figure,
  phoneBoard, snake, slide, spawn, play, LADDER, SNAKE, MEAN, empty } from './kit.js';
const g = document.getElementById('cv').getContext('2d'), KS = [0.25, 0.5, 0.75, 1];
let ready = false;
(async () => {
  await Promise.all(FONTS.map(f => document.fonts.load(f, FONT_SAMPLE)));
  const P = '../../../assets/character-v2/cut/';
  await loadKit({ 'pose-point': P + 'pose-point.png', 'pose-phone': P + 'pose-phone.png', 'pose-coin-flip': P + 'pose-coin-flip.png' });
  ready = true;
})().catch(e => { window.__intro.error = String(e.stack || e); });
const STAIR = snake(LADDER), CHAIN = SNAKE.slice(0, 15).map((_, i) => [SNAKE[15 - i], SNAKE[14 - i]]);
const MID = [[128, 64, 32, 16], [8, 16, 4, 2], [2, 4, 0, 0], [0, 2, 0, 0]];
const lab = (s, x = 1824, y = 60) => write(g, s, x, y, 1, { font: `500 28px ${JP}`, color: '@dim', align: 'right' });
const frame = t => {
  g.setTransform(1, 0, 0, 1, 0, 0); ground(g, t);
  const i = Math.floor(t), k = KS[i % 4];
  if (i < 4) {                                                       // ── A: bàn, quân, chữ ──
    lab(`A · k = ${k}`);
    heading(g, 2, '16マスにぴったりの階段', k);
    board(g, STAIR, 96, 230, 560, k, { chev: CHAIN, kChev: k });
    ban(g, 720, 230, 300, k, { hl: [1, 2] });
    [[2, {}], [256, {}], [512, {}], [1024, {}], [2048, {}], [65536, { luck: true }], [131072, { ghost: true }]].forEach(([v, o], j) => koma(g, v, 760 + j * 160, 900, 140, k, o));
    telop(g, '16マスにぴったりの階段', 1100, 290, k);
    answer(g, [['= ', `700 50px ${MIN}`], ['131072', `700 50px ${MIN}`]], 1100, 370, k);
    luck(g, '確率 1/10', 1100, 450, k, { size: 40 });
    const B = wrong(g, 'いくらでも大きく？', 1100, 530, 1, { size: 40 }); strikeInk(g, B.x - 10, B.y + B.h * 0.55, B.x + B.w + 10, B.y + B.h * 0.5, k);
    telop(g, 'いいえ', 1100, 600, k, { size: 40 });
    write(g, [['2', `700 56px ${MIN}`], ['17', `700 30px ${JP}`, '@ink', { rise: 26, sup: true }], [' = 131072', `700 56px ${MIN}`]], 1100, 690, k);
    arrow(g, 1560, 600, 1800, 600, k); stamp(g, '答', 1700, 300, k); stamp(g, '評価', 1780, 440, k, { size: 34 });
  } else if (i < 8) {                                                // ── B: giấy, xu, bàn tính, 駒台, mascot ──
    lab(`B · k = ${k}`);
    kifu(g, 96, 120, 700, 560, k, { rules: true, content: X => {
      write(g, '第1018手', X.ix, X.iy + 50, k, { font: `700 44px ${MIN}`, on: 'paper' });
      write(g, [['平均 ', `700 36px ${MIN}`], [String(MEAN), `700 40px ${MIN}`, '@ans']], X.ix, X.iy + 120, k, { on: 'paper' });
      luck(g, '2が出る　9/10', X.ix, X.iy + 180, k, { size: 32, on: 'paper' });
      board(g, MID, X.ix, X.iy + 220, 220, 1, { numbers: false, legs: false, thick: 14 });
      board(g, MID, X.ix + 260, X.iy + 220, 280, 1, { legs: false, thick: 18 });
    } });
    tanzaku(g, 900, 130, 96, 540, k, { n: 1, text: 'なぜ負けるのか' });
    tanzaku(g, 1020, 130, 96, 540, k, { n: 2, text: 'どこまで大きく' });
    tanzaku(g, 1140, 130, 96, 540, 1, { n: 3, text: 'どう運と戦う', back: '平均で読み、自分で学ぶ', flip: k, size: 36 });
    coin(g, 1300, 230, 60, k); coin(g, 1440, 230, 60, 1, { spin: k * 2.5, tilt: 0.7 });
    soroban(g, 1240, 360, 131072, k, { from: 0, kv: k });
    const D = komadai(g, 96, 760, 520, 200, k); koma(g, 2048, D.x + 140, D.y + 100, 150, k); koma(g, 65536, D.x + 360, D.y + 100, 150, k);
    soroban(g, 680, 790, 4096, 1, { from: 4092, kv: k, cols: 5 });
    figure(g, 'point', 1660, H, 560, k);
  } else if (i < 12) {                                               // ── C: cây, 将棋, vuốt, rắn ──
    lab(`C · k = ${k}`);
    const R = [[256, 128, 64, 32], [4, 16, 16, 8], [2, 8, 4, 8], [4, 2, 8, 2]], up = slide(R, 'U').cells;
    const kids = []; up.forEach((row, r) => row.forEach((v, c) => { if (!v) for (const [vv, p] of [[2, '9/10'], [4, '1/10']]) { const cc = up.map(x => x.slice()); cc[r][c] = vv; kids.push({ type: 'board', cells: cc, hl: [r, c], tag: p }); } }));
    kifu(g, 60, 90, 1180, 920, 1, { content: () => {
      tree(g, { type: 'board', cells: R, children: [{ type: 'me', dir: 'U', best: true, children: [{ type: 'luck', best: true, children: kids }] }, { type: 'me', dir: 'R' }, { type: 'me', dir: 'L' }, { type: 'me', dir: 'D' }] },
        170, 540, k, { dx: 300, dy: 170, size: 150 });
    } });
    shogiban(g, 1300, 90, 440, k);
    const from = [[2, 2, 4, 0], [0, 4, 4, 8], [16, 0, 0, 16], [2, 2, 2, 2]], sp = spawn(slide(from, 'L').cells, 5);
    boardMove(g, from, 'L', 1360, 600, 400, k, { spawn: { ...sp, k: (k - 0.75) / 0.25 } });
  } else if (i === 12) {                                             // ── 17 bậc cạnh nhau ──
    lab('17 bậc · s = 180');
    for (let r = 1; r <= 17; r++) { const row = r <= 9 ? 0 : 1, j = row ? r - 10 : r - 1; koma(g, 2 ** r, 140 + j * 205 + row * 100, 300 + row * 420, 180, 1); }
  } else if (i === 13) {                                             // ── bàn nhiều cỡ + điện thoại ──
    lab('bàn mini: 70 · 110 · 160 · 230 (không số) · 320 · 440 (có số)');
    const run = play([[2, 0, 0, 0], [0, 0, 0, 2], [0, 0, 0, 0], [0, 0, 0, 0]], 60, { seed: 4 }).at(-1).cells;
    [70, 110, 160, 230].reduce((x, S) => { board(g, STAIR, x, 120, S, 1, { numbers: false, legs: S >= 110, thick: S * 0.07 }); return x + S + 40; }, 96);
    board(g, run, 96, 500, 320, 1); board(g, STAIR, 460, 500, 440, 1);
    const F = figure(g, 'phone', 1500, H, 900, 1, { talk: false }); phoneBoard(g, F, STAIR);
    figure(g, 'coin-flip', 1100, H, 520, 1, { talk: false });
  } else {                                                           // ── thẻ hồi ở 4 mốc (FROM 10, START 12.6) ──
    const tt = [10.95, 11.6, 12.3, 13.3][i - 14];
    lab(`actCard t = START ${(tt - 12.6).toFixed(2)}`, 1824, 1000);
    board(g, STAIR, 96, 230, 420, 1, { numbers: false });
    actCard(g, tt, 10, 12.6, 6);
  }
};
window.__intro = { get ready() { return ready; }, still: frame, frame, DUR: 18 };
</script>
