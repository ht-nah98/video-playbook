<!doctype html><meta charset="utf-8">
<title>2048の数学 ― なぜ私たちは負けるのか — p2</title>
<style>
  @font-face{font-family:"Cormorant Garamond";src:url("../../../assets/fonts/CormorantGaramond-LN[wght].ttf");font-weight:300 700;}
  @font-face{font-family:"Noto Sans JP";src:url("../../../assets/fonts/NotoSansJP[wght].ttf");font-weight:100 900;}
  @font-face{font-family:"Shippori Mincho";src:url("../../../assets/fonts/ShipporiMincho-Regular.ttf");font-weight:400;}
  @font-face{font-family:"Shippori Mincho";src:url("../../../assets/fonts/ShipporiMincho-Bold.ttf");font-weight:700;}
  html,body{margin:0;background:#111;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
<canvas id=cv width=1920 height=1080></canvas>
<script type="module">
// Phần p2 (lời audio/p2.wav, mốc data/p2.timeline.json — align.py).
// Cảnh: plates/*.js, mỗi file `export default class` có static ERA, IMAGES {key: đường dẫn}, POSES [..];
// sau init({ tl }) có START (câu đầu của mục) và FROM (lúc cảnh bắt đầu hiện; mở hồi = START − 2.6).
// Chuyển cùng ERA「lật 棋譜」(DNA §7): tấm cũ trượt sang trái (nghiêng nhẹ), tấm mới vào từ phải theo vệt nắng; 0.9 s từ FROM.
//   Tiếng mặc định `page` (cảnh đặt TRANSITION để đổi, CONTINUES = cắt thẳng, im). Khác ERA → loang từ WIPE.
// Chụp riêng vài cảnh: p2.html?plates=a1-x,a2-y
import { makeTimeline } from '../../../engine/timeline.js';
import { loadKit, setTalk, outCubic, prog, W, H, mk, FONTS, FONT_SAMPLE, setGround, ground } from './kit.js';
import { ALL } from './plates/p2-order.js';
import { collectCues } from '../../../engine/sfx.js';
// LEAD/TAIL đọc từ build.json (MỘT nguồn): trang và build lệch LEAD là hình lệch tiếng cả phần (zero-div suýt mắc).
let LEAD = 0, TAIL = 0; const g = document.getElementById('cv').getContext('2d');
let ready = false, plates = [], DUR = 0, CUES = [];
const BUF = [mk(), mk()].map(c => c.getContext('2d'));
(async () => {
  // MỌI mặt chữ của kit (kit.FONTS) — Promise.all trước init (đua font, LESSONS §16).
  await Promise.all(FONTS.map(f => document.fonts.load(f, FONT_SAMPLE)));
  const part = (await (await fetch('./build.json')).json()).parts.find(p => p.page === 'p2');
  LEAD = part.lead; TAIL = part.tail;
  const tl = makeTimeline(await (await fetch('./data/p2.timeline.json')).json());
  // miệng nói (engine/talk.js): đường bao giọng từ tools/voice/mouth_env.py. Chưa có tệp → mascot im;
  // build.py chặn render khi thiếu hoặc cũ hơn audio/p2.dry.wav.
  const mo = await fetch('./data/p2.mouth.json'); if (mo.ok) setTalk(await mo.json());
  const want = new URLSearchParams(location.search).get('plates');
  const names = want ? want.split(',') : ALL;
  const mods = await Promise.all(names.map(n => import(`./plates/${n}.js`)));
  const C = '../../../assets/character-v2/cut/', imgs = {};
  for (const m of mods) { Object.assign(imgs, m.default.IMAGES || {}); for (const p of m.default.POSES || []) imgs['pose-' + p] = C + `pose-${p}.png`; }
  await loadKit(imgs);
  plates = mods.map(m => { const p = new m.default(); p.init({ tl }); return p; }).sort((a, b) => a.FROM - b.FROM);
  // lật 棋譜 = tiếng giấy: cảnh cùng ERA chưa tự đặt TRANSITION thì mặc định 'page' (CONTINUES vẫn im — engine/sfx.js)
  plates.forEach((p, j) => { if (j && p.TRANSITION === undefined && !p.CONTINUES && p.constructor.ERA === plates[j - 1].constructor.ERA) p.TRANSITION = 'page'; });
  DUR = LEAD + tl.lines.at(-1).end + TAIL;
  CUES = collectCues(plates, LEAD); // tiếng hiệu ứng: chuyển cảnh tự có + sfx() của từng cảnh (docs/lesson/SFX.md)
  ready = true;
})().catch(e => { window.__intro.error = String(e.stack || e); });
const frame = t => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.textAlign = 'left'; g.filter = 'none';
  const T = t - LEAD;
  let i = 0; for (let j = 0; j < plates.length; j++) if (T >= plates[j].FROM) i = j;
  const cur = plates[i], prev = plates[i - 1];
  // CONTINUES = true: cảnh nối tiếp bố cục cảnh trước → cắt thẳng, không trượt (LESSONS §50).
  const k = prev && !cur.CONTINUES ? prog(T, cur.FROM, cur.FROM + 0.9) : 1;
  if (k >= 1) { cur.render(g, T); return; }
  if (prev.constructor.ERA !== cur.constructor.ERA) {
    prev.render(g, T);
    const [cx, cy] = cur.WIPE || [W / 2, H / 2];
    g.save(); g.beginPath(); g.arc(cx, cy, 2300 * Math.pow(outCubic(k), 1.3), 0, 7); g.clip(); cur.render(g, T); g.restore();
    return;
  }
  // lật 棋譜: hai cảnh vẽ vào bộ đệm trong suốt (setGround(false) bỏ nền chiếu), ghép trên MỘT nền chiếu chung.
  const e = outCubic(k);
  setGround(false);
  try { for (const [b, p] of [[BUF[0], prev], [BUF[1], cur]]) { b.setTransform(1, 0, 0, 1, 0, 0); b.clearRect(0, 0, W, H); b.globalAlpha = 1; b.globalCompositeOperation = 'source-over'; p.render(b, T); } }
  finally { setGround(true); }
  ground(g, T);
  const dxo = Math.round(-e * (W + 120)), dxi = Math.round((1 - e) * (W + 120));   // dịch làm tròn (LESSONS §47)
  const sheet = (b, dx, rot) => { g.save(); g.translate(dx + W / 2, H / 2); g.rotate(rot); g.translate(-W / 2, -H / 2); g.drawImage(b.canvas, 0, 0); g.restore(); };
  sheet(BUF[0], dxo, -0.035 * e); sheet(BUF[1], dxi, 0.035 * (1 - e));
  // vệt nắng dọc mép tấm mới (sáng ấm, mềm) — tắt khi tấm đã vào
  const xe = dxi, a = 0.35 * Math.sin(Math.PI * k);
  if (a > 0.01) { const gr = g.createLinearGradient(xe - 160, 0, xe + 60, 0); gr.addColorStop(0, 'rgba(255,226,170,0)'); gr.addColorStop(0.7, `rgba(255,226,170,${a})`); gr.addColorStop(1, 'rgba(255,226,170,0)');
    g.save(); g.globalCompositeOperation = 'screen'; g.fillStyle = gr; g.fillRect(xe - 160, 0, 220, H); g.restore(); }
};
window.__intro = { get ready() { return ready; }, still: frame, frame, get DUR() { return DUR; }, get LEAD() { return LEAD; }, get cues() { return CUES; } };
</script>
