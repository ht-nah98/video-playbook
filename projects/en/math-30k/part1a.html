<!doctype html><meta charset="utf-8">
<title>math-30k — preview</title>
<style>
  @font-face{font-family:"Archivo";src:url("../../../assets/fonts/Archivo[wdth,wght].ttf");font-weight:100 900;font-stretch:62% 125%;}
  @font-face{font-family:"IBM Plex Mono";src:url("../../../assets/fonts/IBMPlexMono-Medium.ttf");font-weight:500;}
  @font-face{font-family:"Cormorant Garamond";src:url("../../../assets/fonts/CormorantGaramond-LN[wght].ttf");font-weight:300 700;}
  @font-face{font-family:"Cormorant Garamond";src:url("../../../assets/fonts/CormorantGaramond-Italic-LN[wght].ttf");font-style:italic;font-weight:300 700;}
  html,body{margin:0;background:#111;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
<canvas id=cv width=1920 height=1080></canvas>
<script type="module">
// Phần 1a: mở bài (lời audio/p1a.wav) — kết bằng màn chập đen kín; intro chèn sau (tools: out/en/math-30k/_p1.sh).
import { makeTimeline } from '../../../engine/timeline.js';
import { loadKit } from './kit.js';
import { ColdOpen } from './plates/c0-open.js';
const LEAD = 0.6, g = document.getElementById('cv').getContext('2d');
let ready = false, plate, DUR = 0;
(async () => {
  await Promise.all(['800 92px "Archivo"', '800 64px "Archivo"', '800 60px "Archivo"', '800 46px "Archivo"', '800 38px "Archivo"', '800 30px "Archivo"',
    '500 20px "IBM Plex Mono"', '500 18px "IBM Plex Mono"', '500 16px "IBM Plex Mono"',
    'italic 600 96px "Cormorant Garamond"', 'italic 600 84px "Cormorant Garamond"', 'italic 600 64px "Cormorant Garamond"', 'italic 600 60px "Cormorant Garamond"', 'italic 600 40px "Cormorant Garamond"'].map(f => document.fonts.load(f)));
  const tl = makeTimeline(await (await fetch('./data/p1a.timeline.json')).json());
  await loadKit({ 'pose-point': '../../../assets/character-v2/cut/pose-point.png' });
  plate = new ColdOpen(); plate.init({ tl });
  DUR = LEAD + plate.END;
  ready = true;
})().catch(e => { window.__intro.error = String(e.stack || e); });
const frame = t => { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.textAlign = 'left'; plate.render(g, t - LEAD); };
window.__intro = { get ready() { return ready; }, still: frame, frame, get DUR() { return DUR; }, get LEAD() { return LEAD; } };
</script>
