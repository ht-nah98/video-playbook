<!doctype html><meta charset="utf-8">
<title>math-30k — preview</title>
<style>
  @font-face{font-family:"Archivo";src:url("../../../assets/fonts/Archivo[wdth,wght].ttf");font-weight:100 900;font-stretch:62% 125%;}
  @font-face{font-family:"IBM Plex Mono";src:url("../../../assets/fonts/IBMPlexMono-Medium.ttf");font-weight:500;}
  @font-face{font-family:"Cormorant Garamond";src:url("../../../assets/fonts/CormorantGaramond-LN[wght].ttf");font-weight:300 700;}
  @font-face{font-family:"Cormorant Garamond";src:url("../../../assets/fonts/CormorantGaramond-Italic-LN[wght].ttf");font-style:italic;font-weight:300 700;}
  html,body{margin:0;background:#111;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
<canvas id=cv width=1920 height=1080></canvas>
<script type="module">
// Phần 1b: Hồi 1 — xương (câu 0–10) rồi Sumer (câu 11–21), lời audio/p1b.wav. Mở từ đen (sau intro).
// Chuyển xương → đất sét: nền đất sét LAN từ ba vạch ra (DNA §2: đổi chất liệu, không cắt).
import { makeTimeline } from '../../../engine/timeline.js';
import { loadKit, outCubic, prog, ground, H } from './kit.js';
import { Bone } from './plates/a1-bone.js';
import { Sumer } from './plates/a2-sumer.js';
const LEAD = 3.0, TAIL = 1.6, g = document.getElementById('cv').getContext('2d');
let ready = false, bone, sumer, DUR = 0;
(async () => {
  await Promise.all(['800 150px "Archivo"', '800 92px "Archivo"', '800 64px "Archivo"', '500 34px "IBM Plex Mono"', '500 28px "IBM Plex Mono"', '500 26px "IBM Plex Mono"',
    '500 24px "IBM Plex Mono"', '500 22px "IBM Plex Mono"', '500 20px "IBM Plex Mono"', '500 15px "IBM Plex Mono"',
    'italic 500 72px "Cormorant Garamond"', 'italic 600 64px "Cormorant Garamond"', 'italic 600 54px "Cormorant Garamond"', 'italic 600 52px "Cormorant Garamond"',
    'italic 500 46px "Cormorant Garamond"', 'italic 600 44px "Cormorant Garamond"'].map(f => document.fonts.load(f)));
  const tl = makeTimeline(await (await fetch('./data/p1b.timeline.json')).json());
  const C = '../../../assets/character-v2/cut/', Hh = './assets/history/';
  await loadKit({ 'pose-three': C + 'pose-three.png', 'pose-ponder': C + 'pose-ponder.png', 'pose-point': C + 'pose-point.png',
    ishango: Hh + 'Ishango_bone_(cropped).jpg', sumer: Hh + 'sumer-tablet     │ phiến đất sét có chữ số Sumer hoặc chữ hình nêm.jpeg' });
  bone = new Bone(); bone.init({ tl }); sumer = new Sumer(); sumer.init({ tl });
  DUR = LEAD + tl.lines.at(-1).end + TAIL;
  ready = true;
})().catch(e => { window.__intro.error = String(e.stack || e); });
const frame = t => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.textAlign = 'left';
  const T = t - LEAD, s0 = sumer.START, k = prog(T, s0 - 1.4, s0 - 0.2);
  if (k < 1) bone.render(g, T);
  if (k > 0) {
    // đuôi phần 1b: tờ Sumer trượt lên (nạp giấy) để lộ nền đất sét trống — phần 2 (Babylon, cũng đất sét) mở từ đúng
    // nền đó; không có bước này thì mối nối 1b → 2 là cắt cứng (đo được ở bản cuối, 184.2 s)
    const end = sumer.T.end, up = outCubic(prog(T, end + 0.3, end + 1.3));
    if (up > 0) { ground(g, 'clay'); g.save(); g.translate(0, -H * 1.08 * up); }
    g.save(); g.beginPath(); g.arc(806, 525, 2300 * Math.pow(outCubic(k), 1.3), 0, 7); g.clip(); sumer.render(g, T); g.restore();
    if (up > 0) g.restore();
  }
};
window.__intro = { get ready() { return ready; }, still: frame, frame, get DUR() { return DUR; }, get LEAD() { return LEAD; } };
</script>
