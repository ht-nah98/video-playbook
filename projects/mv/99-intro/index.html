<!doctype html><meta charset="utf-8">
<title>99% from scratch — intro</title>
<style>
  @font-face{font-family:"Archivo";src:url("../../../assets/fonts/Archivo[wdth,wght].ttf");font-weight:100 900;}
  @font-face{font-family:"IBM Plex Mono";src:url("../../../assets/fonts/IBMPlexMono-Regular.ttf");font-weight:400;}
  @font-face{font-family:"IBM Plex Mono";src:url("../../../assets/fonts/IBMPlexMono-Medium.ttf");font-weight:500;}
  @font-face{font-family:"Cormorant Garamond";src:url("../../../assets/fonts/CormorantGaramond-Italic[wght].ttf");font-style:italic;font-weight:300 700;}
  html,body{margin:0;background:#05070f;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
<canvas id=cv width=1920 height=1080></canvas>
<script type="module">
import { Show } from '../../../engine/main.js';
import { P, beat, SONG, DUR } from './song.js';

import P1 from './plates/p1-dial.js';
import P2 from './plates/p2-dot.js';
import P3 from './plates/p3-break.js';
import P4 from './plates/p4-rotate.js';
import P5 from './plates/p5-erase.js';
import P6 from './plates/p6-question.js';
import P7 from './plates/p7-stamp.js';
import P8 from './plates/p8-lattice.js';
import P9 from './plates/p9-close.js';

const g = document.getElementById('cv').getContext('2d');
const show = new Show({
  order: [
    [P.dial, P1], [P.dot, P2], [P.break_, P3], [P.rotate, P4], [P.erase, P5],
    [P.question, P6], [P.stamp, P7], [P.lattice, P8], [P.close, P9],
  ],
  beat, end: DUR,
  assets: '../../../assets/character/cut',
});

let ready = false;
(async () => {
  // Nạp ĐỦ mọi họ+cỡ font trước init(): cảnh đo bề rộng chữ rồi cache,
  // nếu font chưa về thì bố cục khoá vào font dự phòng → mất tính tất định.
  await Promise.all([
    document.fonts.load('900 190px "Archivo"'),
    document.fonts.load('700 120px "Archivo"'),
    document.fonts.load('400 30px "IBM Plex Mono"'),
    document.fonts.load('500 34px "IBM Plex Mono"'),
    document.fonts.load('italic 500 86px "Cormorant Garamond"'),
  ]);
  await document.fonts.ready;
  await show.init();
  window.__intro.gl = { plates: show.plates.length, song: SONG.title };
  ready = true;
})();

const frame = t => show.render(g, t);
window.__intro = { get ready(){ return ready; }, still: frame, frame, DUR };

// Xem trước trong trình duyệt. Renderer headless gọi still(t) trực tiếp —
// vòng lặp này PHẢI tắt ở đó, nếu không hai bên tranh canvas và ảnh chụp
// ra là frame của vòng lặp, không phải thời điểm được yêu cầu.
const PREVIEW = !/headless/i.test(navigator.userAgent);
let t0 = performance.now();
function loop(){
  if (ready) frame(((performance.now() - t0) / 1000) % DUR);
  requestAnimationFrame(loop);
}
if (PREVIEW) loop();
</script>
