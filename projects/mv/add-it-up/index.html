<!doctype html><meta charset="utf-8">
<title>Add It Up — add-it-up</title>
<style>
  @font-face{font-family:"Archivo";src:url("../../../assets/fonts/Archivo[wdth,wght].ttf");font-weight:100 900;font-stretch:62% 125%;}
  @font-face{font-family:"IBM Plex Mono";src:url("../../../assets/fonts/IBMPlexMono-Regular.ttf");font-weight:400;}
  @font-face{font-family:"IBM Plex Mono";src:url("../../../assets/fonts/IBMPlexMono-Medium.ttf");font-weight:500;}
  @font-face{font-family:"Cormorant Garamond";src:url("../../../assets/fonts/CormorantGaramond-Italic[wght].ttf");font-style:italic;font-weight:300 700;}
  html,body{margin:0;background:#F2EDE4;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
<canvas id=cv width=1920 height=1080></canvas>
<script type="module">
import { SheetShow } from '../../../engine/sheets.js';
import { Face } from '../../../engine/face.js';
import { makeEnv } from '../../../engine/visemes.js';
import { SONG, PAL, beat, loadSong } from './song.js';
import { ORDER } from './order.js';

const g = document.getElementById('cv').getContext('2d');
let ready = false, show;
(async () => {
  // Nạp ĐỦ mọi họ + cỡ font trước init() — cảnh đo chữ rồi cache (LESSONS: đua font phá tất định).
  await Promise.all([
    document.fonts.load('900 300px "Archivo"'), document.fonts.load('800 66px "Archivo"'), document.fonts.load('700 40px "Archivo"'),
    document.fonts.load('500 40px "IBM Plex Mono"'), document.fonts.load('500 17px "IBM Plex Mono"'), document.fonts.load('400 26px "IBM Plex Mono"'),
    document.fonts.load('italic 600 84px "Cormorant Garamond"'), document.fonts.load('italic 300 400px "Cormorant Garamond"'),
  ]);
  await document.fonts.ready;
  const { tl, drums } = await loadSong();
  const face = await new Face().load('../../../assets/character-v2/cut', { set: 'b' });
  const vox = makeEnv(await (await fetch('./data/vox.json')).json());
  show = new SheetShow({
    order: ORDER(tl), beat, end: SONG.duration, feed: 0.35,
    assets: '../../../assets/character-v2/cut', poses: ['ponder', 'plusc', 'three', 'pointer', 'fist', 'peace-back'],
    bg: PAL.paper, extra: { tl, face, vox, drums },
  });
  await show.init();
  ready = true;
})();
const frame = t => show.render(g, t);
window.__intro = { get ready(){ return ready; }, still: frame, frame, DUR: SONG.duration };
const PREVIEW = !/headless/i.test(navigator.userAgent);   // xem trước trong trình duyệt; renderer headless tự gọi still(t)
const t0 = performance.now();
(function loop(){ if (PREVIEW) { if (ready) frame(((performance.now() - t0) / 1000) % SONG.duration); requestAnimationFrame(loop); } })();
</script>
